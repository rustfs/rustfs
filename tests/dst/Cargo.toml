[package]
name = "rustfs-dst"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
homepage.workspace = true
publish = false
description = "Deterministic simulation harness for RustFS 1.0.7 erasure-set durability."
keywords = ["rustfs", "simulation", "erasure-coding", "testing"]
categories = ["development-tools", "filesystem"]

[lints]
workspace = true

[dependencies]
rustfs-ecstore = { workspace = true, features = ["dst"] }
rustfs-filemeta = { workspace = true }
rustfs-utils = { workspace = true }

[lib]
doctest = false

[[bin]]
name = "dst-campaign"
path = "src/bin/dst-campaign.rs"
