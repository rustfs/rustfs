[package]
edition = "2021"
rust-version = "1.66"
name = "pyroscope"
version = "2.1.1"
authors = ["Abid Omar <contact@omarabid.com>"]
build = "build.rs"
autolib = false
autobins = false
autoexamples = false
autotests = false
autobenches = false
description = """
Pyroscope Profiler Agent for continuous profiling of Rust, Python and Ruby applications.
"""
homepage = "https://grafana.com/docs/pyroscope/latest/configure-client/language-sdks/rust/"
documentation = "https://docs.rs/pyroscope"
readme = "README.md"
keywords = [
    "pyroscope",
    "profiler",
    "profiling",
    "pprof",
]
license = "Apache-2.0"
repository = "https://github.com/grafana/pyroscope-rs"

[features]
backend-jemalloc = ["dep:jemalloc_pprof"]
backend-pprof-rs = [
    "dep:backtrace",
    "dep:backtrace",
    "dep:once_cell",
    "dep:nix",
    "dep:spin",
    "dep:tempfile",
    "dep:findshlibs",
    "dep:smallvec",
    "dep:framehop",
    "dep:memmap2",
    "dep:object",
    "dep:aligned-vec",
    "dep:symbolic-demangle",
]
default = ["rustls-tls"]
native-tls = ["reqwest/native-tls"]
native-tls-vendored = ["reqwest/native-tls-vendored"]
rustls-no-provider = ["reqwest/rustls-no-provider"]
rustls-tls = ["reqwest/rustls"]

[lib]
name = "pyroscope"
path = "src/lib.rs"

[[example]]
name = "jemalloc"
path = "examples/jemalloc.rs"
required-features = ["backend-jemalloc"]

[[test]]
name = "agent"
path = "tests/agent.rs"

[[test]]
name = "pprof_backend"
path = "tests/pprof_backend.rs"

[[test]]
name = "session"
path = "tests/session.rs"

[[test]]
name = "timer"
path = "tests/timer.rs"

[[test]]
name = "timer-epoll"
path = "tests/timer-epoll.rs"

[dependencies.aligned-vec]
version = "0.6"
optional = true

[dependencies.backtrace]
version = "0.3"
optional = true

[dependencies.findshlibs]
version = "0.10"
optional = true

[dependencies.framehop]
version = "0.16"
optional = true

[dependencies.jemalloc_pprof]
version = "0.9"
features = ["symbolize"]
optional = true

[dependencies.libc]
version = "^0.2.124"

[dependencies.libflate]
version = "2.1.0"

[dependencies.log]
version = "0.4"

[dependencies.memmap2]
version = "0.9"
optional = true

[dependencies.nix]
version = "0.31"
features = [
    "signal",
    "fs",
]
optional = true
default-features = false

[dependencies.object]
version = "0.40"
optional = true

[dependencies.once_cell]
version = "1.9"
optional = true

[dependencies.prost]
version = "0.14"

[dependencies.reqwest]
version = "0.13"
features = [
    "blocking",
    "query",
]
default-features = false

[dependencies.serde_json]
version = "1.0.115"

[dependencies.smallvec]
version = "1.7"
optional = true

[dependencies.spin]
version = "0.12"
optional = true

[dependencies.symbolic-demangle]
version = "13.1.0"
features = ["rust"]
optional = true
default-features = false

[dependencies.tempfile]
version = "3.1"
optional = true

[dependencies.thiserror]
version = "2.0"

[dependencies.url]
version = "2.2.2"

[dependencies.uuid]
version = "1.20.0"
features = ["v4"]

[dev-dependencies.assert_matches]
version = "=1.5.0"

[dev-dependencies.claims]
version = "=0.8.0"

[dev-dependencies.env_logger]
version = "=0.11.10"

[dev-dependencies.tikv-jemallocator]
version = "0.7"
features = ["profiling"]

[profile.bench]
opt-level = 3
lto = true
codegen-units = 1
debug = 0
debug-assertions = false
rpath = false

[profile.dev]
opt-level = 0
lto = false
codegen-units = 4
debug = 2
debug-assertions = true
rpath = false

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
debug = 0
debug-assertions = false
rpath = false
strip = "symbols"

[profile.test]
opt-level = 1
lto = false
codegen-units = 4
debug = 2
debug-assertions = true
rpath = false

[[test]]
name = "rustfs_zstd"
path = "tests/rustfs_zstd.rs"
required-features = ["backend-pprof-rs"]
