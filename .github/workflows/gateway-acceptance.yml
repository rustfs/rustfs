# Gateway black-box acceptance lanes (rustfs/backlog#2775 T3.4, #2776 T3.5).
#
# Runs two suites of the rustfs/gateway repository against the candidate binary,
# with isolated data and a separate server for each suite:
#
#   - the conformance corpus, `--profile rustfs`, judged by
#     scripts/check_conformance_rulings.py against .config/conformance-rulings.toml
#     (red: an unruled failure, a ruled case failing differently, a stale ruling,
#     a skip on the server's own answer);
#   - the client matrix, ci/compat/run_matrix.sh --external, judged by
#     scripts/compat_matrix_report.py (no `fail`, no `sut-unregistered`, every
#     client ran; a client that could not be installed is reported as skipped).
#
# The suites are checked out at the rustfs/gateway rev Cargo.toml pins, so the
# suite and the framework under test never drift apart. The verdict is computed
# from what the run left on disk (startup record, runner exit code, liveness
# after the corpus, report), never from the exit status of an earlier step.
#
# Not a pull-request gate. Scheduled failures are owned by the scheduled-validation
# watchdog (.github/scheduled-validations.json).

name: Gateway Acceptance

on:
  schedule:
    - cron: "29 3 * * *"
  workflow_dispatch:

# Matches ci.yml: these variables are hashed into the rust-cache key, so the
# candidate build reads the same ci-dev cache as build-rustfs-debug-binary.
env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  plan:
    name: Read the gateway pin
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      gateway-rev: ${{ steps.pin.outputs.rev }}
      ceph-rev: ${{ steps.pin.outputs.ceph-rev }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@f548e57e544e1ff5a4c46bf1e1b8685f8e4a348a # v7
        with:
          persist-credentials: false

      - name: Read the gateway and Ceph pins
        id: pin
        run: python3 scripts/gateway_corpus_capture.py pins >> "$GITHUB_OUTPUT"

  build-candidate:
    name: Build candidate binary
    # The same debug build as ci.yml's build-rustfs-debug-binary, reading the
    # ci-dev cache written on sm-standard-4.
    runs-on: sm-standard-4
    timeout-minutes: 60
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
    steps:
      - name: Checkout repository
        uses: actions/checkout@f548e57e544e1ff5a4c46bf1e1b8685f8e4a348a # v7
        with:
          persist-credentials: false

      - name: Setup Rust environment
        uses: ./.github/actions/setup
        with:
          rust-version: stable
          cache-shared-key: ci-dev
          cache-save-if: 'false'
          install-build-packaging-tools: 'false'

      - name: Build debug binary
        run: python3 scripts/e2e_binary.py build --bins --features e2e-test-hooks

      - name: Upload candidate binary
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: gateway-acceptance-candidate-binary
          overwrite: true
          path: |
            target/debug/rustfs
            target/debug/rustfs.e2e.json
          if-no-files-found: error
          retention-days: 1

  build-gateway-tools:
    name: Build gateway conformance runner and compat-sut
    needs: [ plan ]
    # The gateway workspace builds with its own rust-toolchain.toml, which rustup
    # installs on first use; nothing here names a toolchain.
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout rustfs/gateway at the pinned rev
        uses: actions/checkout@f548e57e544e1ff5a4c46bf1e1b8685f8e4a348a # v7
        with:
          repository: rustfs/gateway
          ref: ${{ needs.plan.outputs.gateway-rev }}
          path: gateway
          persist-credentials: false

      - name: Build
        working-directory: gateway
        run: |
          cargo build --locked --release -p rustfs-gateway-conformance -p rustfs-gateway-compat-sut -p rustfs-gateway-corpus \
            --bin rustfs-gateway-conformance --bin compat-sut --bin corpus

      - name: Upload tools
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: gateway-acceptance-tools
          overwrite: true
          path: |
            gateway/target/release/rustfs-gateway-conformance
            gateway/target/release/compat-sut
            gateway/target/release/corpus
          if-no-files-found: error
          retention-days: 1

  acceptance:
    name: Acceptance
    needs: [ plan, build-candidate, build-gateway-tools ]
    # GitHub-hosted like the s3-tests targets of reference-parity.yml: the job
    # only runs prebuilt binaries and the pinned clients, none of which needs Docker.
    runs-on: ubuntu-latest
    # About 3x the 15 minutes the job took in run 43325101234 (client install about
    # 8, matrix about 3, corpus about 3), so a hung server costs 45 runner minutes, not more.
    timeout-minutes: 45
    env:
      ENDPOINT: http://127.0.0.1:9000
      CONFORMANCE_ENDPOINT: http://127.0.0.1:19000
      # The conformance suite signs with these fixed fixture credentials (the AWS
      # documentation example pair), so the candidate is started with them and the
      # client matrix is handed the same pair.
      ACCESS_KEY: AKIAIOSFODNN7EXAMPLE
      SECRET_KEY: wJalrXUtnFEMI/K7MDENG/bPxRfiCYEXAMPLEKEY
    steps:
      - name: Checkout repository
        uses: actions/checkout@f548e57e544e1ff5a4c46bf1e1b8685f8e4a348a # v7
        with:
          persist-credentials: false

      - name: Checkout rustfs/gateway at the pinned rev
        uses: actions/checkout@f548e57e544e1ff5a4c46bf1e1b8685f8e4a348a # v7
        with:
          repository: rustfs/gateway
          ref: ${{ needs.plan.outputs.gateway-rev }}
          path: gateway
          persist-credentials: false

      - name: Download candidate binary
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: gateway-acceptance-candidate-binary
          path: target/debug

      - name: Download gateway tools
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: gateway-acceptance-tools
          path: tools

      - name: Start conformance candidate
        env:
          # The corpus declares both virtual-host endpoints and a 2 MiB HTTP/2 connection window.
          ENDPOINT: ${{ env.CONFORMANCE_ENDPOINT }}
          HOST_DIR: lane
          RUSTFS_H2_INITIAL_CONN_WINDOW_SIZE: "2097152"
          RUSTFS_CONSOLE_ENABLE: "false"
          RUSTFS_SERVER_DOMAINS: s3.example.com,s3.us-east-1.example.com
        run: &start-candidate |
          set -uo pipefail
          chmod +x target/debug/rustfs tools/*
          mkdir -p "$HOST_DIR" "$RUNNER_TEMP/$HOST_DIR"/data/rustfs{0..3}
          target/debug/rustfs --version | tee "$HOST_DIR/candidate-version.txt"
          # The four directories share the runner's one disk; the bypass is the CI case the
          # physical-disk guard sanctions (as in mint.yml).
          RUSTFS_UNSAFE_BYPASS_DISK_CHECK=true RUST_LOG=info target/debug/rustfs --address "${ENDPOINT#http://}" \
            --access-key "$ACCESS_KEY" --secret-key "$SECRET_KEY" "$RUNNER_TEMP/$HOST_DIR"/data/rustfs{0..3} \
            > "$HOST_DIR/rustfs.log" 2>&1 &
          pid=$!
          echo "$pid" > "$HOST_DIR/rustfs.pid"
          # Liveness first: a ready answer counts only while this process is still running.
          for _ in $(seq 120); do
            if ! kill -0 "$pid" 2>/dev/null; then
              status=0
              wait "$pid" || status=$?
              echo "did not start: exit ${status}: $(grep -v '^[[:space:]]*$' "$HOST_DIR/rustfs.log" | tail -n 1)" > "$HOST_DIR/startup.txt"
              cat "$HOST_DIR/startup.txt"
              exit 1
            fi
            if curl -sf "$ENDPOINT/health/ready" >/dev/null; then
              echo ready > "$HOST_DIR/startup.txt"
              exit 0
            fi
            sleep 1
          done
          echo "did not start: /health/ready did not answer within 120 seconds" > "$HOST_DIR/startup.txt"
          exit 1

      # The exit code is data for the judge step, not this step's result.
      - name: Run gateway conformance (rustfs profile)
        run: |
          set +e
          tools/rustfs-gateway-conformance run --root gateway/conformance --profile rustfs \
            --endpoint "$CONFORMANCE_ENDPOINT" --allow-external-fixtures \
            --json lane/report.json > lane/conformance.log 2>&1
          echo "$?" > lane/runner-exit.txt
          if kill -0 "$(cat lane/rustfs.pid)" 2>/dev/null; then echo alive; else echo exited; fi > lane/alive-after-conformance.txt
          kill "$(cat lane/rustfs.pid)" 2>/dev/null || true
          tail -n 20 lane/conformance.log

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      # Toolchains for the matrix's SDK driver programs, as the gateway's own
      # client-matrix.yml sets them up; the client versions come from
      # gateway/compat/versions.toml.
      - uses: actions/setup-go@41dfa10bad2bb2ae585af6ee5bb4d7d973ad74ed # v5.1.0
        with:
          go-version: "1.26"
          cache: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4.3.1
        with:
          dotnet-version: "8.0.x"
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        with:
          distribution: temurin
          java-version: "21"
      - name: Install Maven
        env:
          MAVEN_VERSION: "3.9.16"
          MAVEN_SHA512: "831a8591fe20c8243b1dbe7d71e3244f31d1665b0804b2e825e38cbbe5ce0cafb8338851f90780735568773e0a6cd07bbec107cda0b896b008b861075358b6f6"
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/apache-maven.tar.gz"
          curl -sSfL -o "$archive" "https://archive.apache.org/dist/maven/maven-3/${MAVEN_VERSION}/binaries/apache-maven-${MAVEN_VERSION}-bin.tar.gz"
          echo "${MAVEN_SHA512}  ${archive}" | sha512sum -c -
          tar -xzf "$archive" -C "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/apache-maven-${MAVEN_VERSION}/bin" >> "$GITHUB_PATH"

      # One client at a time, so a client that cannot be installed is reported
      # as skipped with its reason instead of stopping the others.
      - name: Install pinned clients
        working-directory: gateway
        run: |
          set -uo pipefail
          python3 -m pip install --disable-pip-version-check "pyyaml==6.0.2"
          installed=()
          for client in $(python3 -c 'import tomllib; print(" ".join(sorted(tomllib.load(open("compat/versions.toml", "rb"))["clients"])))'); do
            if bash ci/compat/install_clients.sh --clients "$client" > "../lane/install-${client}.log" 2>&1; then
              installed+=("$client")
            else
              echo "${client}: skipped: $(tail -n 1 "../lane/install-${client}.log")" >> ../lane/skipped-clients.txt
            fi
          done
          echo "COMPAT_CLIENTS=$(IFS=,; echo "${installed[*]}")" >> "$GITHUB_ENV"
          cat ../lane/skipped-clients.txt 2>/dev/null || echo "every pinned client installed"

      - name: Start client matrix candidate with default protocol settings
        env:
          HOST_DIR: lane/matrix-host
        run: *start-candidate

      # The exit code is data for the judge step, not this step's result.
      - name: Run client matrix (external)
        working-directory: gateway
        env:
          GATEWAY_COMPAT_SUT_BIN: ${{ github.workspace }}/tools/compat-sut
          GATEWAY_COMPAT_RUN_DIR: ${{ github.workspace }}/lane/compat
          GATEWAY_COMPAT_MATRIX_OUT: ${{ github.workspace }}/lane/compat/matrix.json
        run: |
          set +e
          export GATEWAY_COMPAT_ACCESS_KEY="$ACCESS_KEY" GATEWAY_COMPAT_SECRET_KEY="$SECRET_KEY"
          PATH="$(go env GOPATH)/bin:$PATH"
          if [[ -f ../lane/skipped-clients.txt ]]; then
            bash ci/compat/run_matrix.sh --external "$ENDPOINT" --product rustfs --clients "$COMPAT_CLIENTS"
          else
            bash ci/compat/run_matrix.sh --external "$ENDPOINT" --product rustfs
          fi
          echo "$?" > ../lane/matrix-exit.txt

      - name: Judge and summarize
        if: always()
        run: |
          set -uo pipefail
          status=0
          python3 scripts/check_conformance_rulings.py --run-dir lane --case-dir gateway/conformance/cases | tee -a "$GITHUB_STEP_SUMMARY" || status=1
          python3 scripts/compat_matrix_report.py check --run-dir lane --server-dir lane/matrix-host | tee -a "$GITHUB_STEP_SUMMARY" || status=1
          exit "$status"

      - name: Upload lane results
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: gateway-acceptance-lane
          overwrite: true
          path: |
            lane/*.txt
            lane/*.log
            lane/matrix-host/*.txt
            lane/matrix-host/*.log
            lane/report.json
            lane/compat/matrix.json
            lane/compat/probe.jsonl
            lane/compat/sut.log
            lane/compat/results/**
          if-no-files-found: error
          retention-days: 14

  capture-corpus:
    name: Capture wire samples (selected E2E and Ceph tests)
    needs: [ plan, build-gateway-tools ]
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Checkout repository
        uses: actions/checkout@f548e57e544e1ff5a4c46bf1e1b8685f8e4a348a # v7
        with:
          persist-credentials: false

      - name: Setup Rust environment
        uses: ./.github/actions/setup
        with:
          # Reuse the hosted server and e2e harness dependencies. Capture jobs never save caches.
          cache-shared-key: ci-e2e-distributed-hosted
          cache-save-if: 'false'
          install-build-packaging-tools: 'false'

      # Keep external source and tools outside the verified server's source inventory.
      - name: Checkout gateway's independent secret scanner
        uses: actions/checkout@f548e57e544e1ff5a4c46bf1e1b8685f8e4a348a # v7
        with:
          repository: rustfs/gateway
          ref: ${{ needs.plan.outputs.gateway-rev }}
          path: target/wire/gateway
          persist-credentials: false

      - name: Checkout pinned Ceph tests
        uses: actions/checkout@f548e57e544e1ff5a4c46bf1e1b8685f8e4a348a # v7
        with:
          repository: ceph/s3-tests
          ref: ${{ needs.plan.outputs.ceph-rev }}
          path: target/wire/ceph
          persist-credentials: false

      - name: Download matching corpus tools
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: gateway-acceptance-tools
          path: target/wire/tools

      - name: Install Ceph's test dependencies
        run: |
          python3 -m venv "$RUNNER_TEMP/ceph-venv"
          "$RUNNER_TEMP/ceph-venv/bin/python" -m pip install -r target/wire/ceph/requirements.txt

      - name: Build the debug-only recording server
        id: wire_server
        run: python3 scripts/e2e_binary.py build --features corpus-record

      - name: Record and verify selected scenarios from both sources
        id: capture
        run: |
          chmod +x target/wire/tools/corpus
          python3 scripts/e2e_binary.py run --features corpus-record -- \
            "$RUNNER_TEMP/ceph-venv/bin/python" scripts/gateway_corpus_capture.py record --suite nightly \
            --gateway target/wire/gateway --ceph target/wire/ceph --tool target/wire/tools/corpus \
            --summary "$RUNNER_TEMP/gateway-capture-summary.json"

      - name: Require 1000–2000 retained entries
        run: python3 scripts/gateway_corpus_capture.py check-size "$RUNNER_TEMP/gateway-capture-summary.json"

      # Only publish after the enclosing binary verifier also succeeds. A size shortfall still has valid counts.
      - name: Upload validated counts
        if: ${{ !cancelled() && steps.capture.outcome == 'success' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: gateway-capture-summary
          path: ${{ runner.temp }}/gateway-capture-summary.json
          if-no-files-found: error
          retention-days: 14

      # The capture size and release parity are independent verdicts.
      - name: Fetch the verified release reference
        id: wire_reference
        if: ${{ !cancelled() && steps.wire_server.outcome == 'success' }}
        uses: ./.github/actions/reference-binary

      - name: Install a child-process clock for the wire comparison
        id: wire_clock
        if: ${{ !cancelled() && steps.wire_reference.outcome == 'success' }}
        run: |
          sudo apt-get update -qq
          sudo apt-get install --no-install-recommends -y libfaketime
          lib="$(dpkg-query -L libfaketime | sed -n '/\/libfaketime\.so\.1$/p')"
          test -f "$lib"
          echo "path=$lib" >> "$GITHUB_OUTPUT"

      - name: Compare the same signed Ceph requests against the release
        id: wire_compare
        if: ${{ !cancelled() && steps.wire_clock.outcome == 'success' }}
        env:
          REF_BINARY: ${{ steps.wire_reference.outputs.path }}
          REF_SHA256: ${{ steps.wire_reference.outputs.executable-sha256 }}
          REF_VERSION: ${{ steps.wire_reference.outputs.version }}
          CLOCK_LIBRARY: ${{ steps.wire_clock.outputs.path }}
        run: |
          python3 scripts/e2e_binary.py run --features corpus-record -- \
            "$RUNNER_TEMP/ceph-venv/bin/python" scripts/gateway_wire_replay.py compare \
            --ceph target/wire/ceph --gateway target/wire/gateway --reference "$REF_BINARY" \
            --reference-sha256 "$REF_SHA256" --reference-version "$REF_VERSION" --clock-library "$CLOCK_LIBRARY" \
            --summary "$RUNNER_TEMP/gateway-wire-differences.json"

      - name: Require zero response differences on replayed cases
        if: ${{ !cancelled() && steps.wire_compare.outcome == 'success' }}
        run: python3 scripts/gateway_wire_replay.py check "$RUNNER_TEMP/gateway-wire-differences.json"

      - name: Upload validated difference counts and case IDs
        if: ${{ !cancelled() && steps.wire_compare.outcome == 'success' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: gateway-wire-differences
          path: ${{ runner.temp }}/gateway-wire-differences.json
          if-no-files-found: error
          retention-days: 14
