# Nightly development artifacts and reusable immutable-candidate builds.
# Public release writes live exclusively in release-publish.yml. Candidate callers
# select Linux or desktop and pin release inputs before any matrix starts.

name: Build and Release

on:
  workflow_call:
    inputs:
      candidate_manifest:
        description: Frozen candidate inputs; candidates never publish from this workflow
        required: true
        type: string
      platforms:
        description: linux, desktop, all, or an explicit platform list
        required: true
        type: string
  schedule:
    - cron: "13 1 * * *" # Nightly 01:13 UTC
  workflow_dispatch:
    inputs:
      publish:
        description: "Publish the development download channel (never a release)"
        required: false
        default: false
        type: boolean
      platforms:
        description: "Comma-separated targets or 'all' (e.g. linux-x86_64-musl,macos-aarch64)"
        required: false
        default: "all"
        type: string

permissions:
  contents: read
  actions: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'push' && github.ref || github.run_id }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1
  # Optimize build performance
  CARGO_INCREMENTAL: 0

jobs:
  # Build strategy check - determine build type based on trigger
  build-check:
    name: Build Strategy Check
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      should_build: ${{ steps.check.outputs.should_build }}
      should_publish: ${{ inputs.candidate_manifest == '' && github.ref == 'refs/heads/main' && (github.event_name == 'schedule' || inputs.publish == true) }}
      build_type: ${{ steps.check.outputs.build_type }}
      version: ${{ steps.check.outputs.version }}
      short_sha: ${{ steps.check.outputs.short_sha }}
      is_prerelease: ${{ steps.check.outputs.is_prerelease }}
      candidate_id: ${{ steps.candidate.outputs.candidate_id }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@f548e57e544e1ff5a4c46bf1e1b8685f8e4a348a # v7
        with:
          persist-credentials: false
          ref: ${{ inputs.candidate_manifest != '' && fromJson(inputs.candidate_manifest).source_sha || github.sha }}

      - name: Validate frozen candidate
        if: inputs.candidate_manifest != ''
        id: candidate
        env:
          CANDIDATE_MANIFEST: ${{ inputs.candidate_manifest }}
        run: |
          python3 - <<'PYINPUT'
          import json, os, sys
          sys.path.insert(0, 'scripts/release')
          import candidate
          value = candidate.validate_inputs(json.loads(os.environ['CANDIDATE_MANIFEST']))
          candidate.write_json('candidate-inputs.json', value)
          candidate.emit_output('candidate_id', value['candidate_id'])
          PYINPUT
          python3 scripts/release/candidate.py validate-inputs --inputs candidate-inputs.json --check-checkout

      - name: Determine build strategy
        id: check
        env:
          CANDIDATE_MANIFEST: ${{ inputs.candidate_manifest }}
        run: |
          should_build=false
          build_type="none"
          version=""
          short_sha=""
          is_prerelease=false

          # Get short SHA for all builds
          short_sha=$(git rev-parse --short HEAD)

          # Candidates contain the final product version but have no release
          # authority. Their only publication is immutable workflow artifacts.
          if [[ -n "$CANDIDATE_MANIFEST" ]]; then
            should_build=true
            build_type="candidate"
            version=$(python3 -c 'import json; print(json.load(open("candidate-inputs.json"))["version"])')
          # Determine build type based on trigger
          elif [[ "${{ startsWith(github.ref, 'refs/tags/') }}" == "true" ]]; then
            # Tag push - preview, release, or prerelease
            should_build=true
            tag_name="${GITHUB_REF#refs/tags/}"
            version="${tag_name}"

            # Preview tags publish a GitHub prerelease for validation, but
            # must not update any latest channel.
            if [[ "$tag_name" =~ -preview\.[0-9]+$ ]]; then
              build_type="preview"
              is_prerelease=true
              echo "🔍 Preview build detected: $tag_name"
            elif [[ "$tag_name" == *"-preview"* ]]; then
              echo "❌ Invalid preview tag: $tag_name (expected suffix: -preview.<number>)" >&2
              exit 1
            elif [[ "$tag_name" == *"alpha"* ]] || [[ "$tag_name" == *"beta"* ]] || [[ "$tag_name" == *"rc"* ]]; then
              build_type="prerelease"
              is_prerelease=true
              echo "🚀 Prerelease build detected: $tag_name"
            else
              build_type="release"
              echo "📦 Release build detected: $tag_name"
            fi
          elif [[ "${{ github.event_name }}" == "schedule" ]] || \
               [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            # Scheduled or manual build
            should_build=true
            build_type="development"
            version="dev-${short_sha}"
            echo "⚡ Manual/scheduled build detected"
          fi

          {
            echo "should_build=$should_build"
            echo "build_type=$build_type"
            echo "version=$version"
            echo "short_sha=$short_sha"
            echo "is_prerelease=$is_prerelease"
          } >> "$GITHUB_OUTPUT"

          echo "📊 Build Summary:"
          echo "  - Should build: $should_build"
          echo "  - Build type: $build_type"
          echo "  - Version: $version"
          echo "  - Short SHA: $short_sha"
          echo "  - Is prerelease: $is_prerelease"

  prepare-build-inputs:
    needs: build-check
    if: needs.build-check.outputs.should_build == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      console: ${{ steps.inputs.outputs.console }}
      toolchain: ${{ steps.inputs.outputs.toolchain }}
    steps:
      - uses: actions/checkout@f548e57e544e1ff5a4c46bf1e1b8685f8e4a348a # v7
        with:
          persist-credentials: false
          ref: ${{ inputs.candidate_manifest != '' && fromJson(inputs.candidate_manifest).source_sha || github.sha }}
      - name: Resolve one Console and toolchain identity
        id: inputs
        env:
          GH_TOKEN: ${{ github.token }}
          CANDIDATE_MANIFEST: ${{ inputs.candidate_manifest }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "$CANDIDATE_MANIFEST" ]]; then
            gh api repos/rustfs/console/releases/latest > console-release.json
            rustup update stable --no-self-update
          fi
          python3 - <<'PYINPUT'
          import json, os, subprocess, sys
          sys.path.insert(0, 'scripts/release')
          import candidate
          raw = os.environ['CANDIDATE_MANIFEST']
          if raw:
              frozen = candidate.validate_inputs(json.loads(raw))
              console, toolchain = frozen['console'], frozen['toolchain']
          else:
              console = candidate.console_asset(candidate.read_json('console-release.json'))
              toolchain = subprocess.check_output(['rustc', '+stable', '--version'], text=True).split()[1]
          candidate.emit_output('console', json.dumps(console, separators=(',', ':')))
          candidate.emit_output('toolchain', toolchain)
          PYINPUT

  # Build RustFS binaries
  prepare-platform-matrix:
    name: Prepare Platform Matrix
    needs: build-check
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      matrix: ${{ steps.select.outputs.matrix }}
      selected: ${{ steps.select.outputs.selected }}
    steps:
      - name: Select target platforms
        id: select
        shell: bash
        env:
          # via env, not interpolation: a dispatch input is free-form text and
          # would otherwise be pasted into the script for bash to evaluate.
          # Daily development builds cover Linux. Desktop remains available on
          # manual dispatch and is required after candidate field acceptance.
          RAW_PLATFORMS: ${{ inputs.platforms || 'linux' }}
        run: |
          set -euo pipefail

          selected="$RAW_PLATFORMS"
          selected="$(echo "${selected}" | tr -d '[:space:]')"
          if [[ -z "${selected}" ]]; then
            selected="all"
          fi

          # linux-aarch64-* need a real aarch64 host (placement rule: hardware)
          # so the packaged binary and console smoke execute the artifact.
          # ubicloud-standard-16-arm is that host: Ubuntu 24.04 arm64, alias of
          # ubicloud-standard-16-arm-ubuntu-2404 (16 vCPU, 48 GB). linux-x86_64-* stay on the
          # ARC sm-standard-4 pool. GNU rows keep cross=true so cargo-zigbuild
          # pins the glibc 2.31 floor on the same architecture; musl stays a
          # native cargo build.
          all='{"include":[
            {"target_id":"linux-x86_64-musl","os":"sm-standard-4","target":"x86_64-unknown-linux-musl","cross":false,"platform":"linux","rustflags":"","features":"","glibc":""},
            {"target_id":"linux-aarch64-musl","os":"ubicloud-standard-16-arm","target":"aarch64-unknown-linux-musl","cross":false,"platform":"linux","rustflags":"","features":"","glibc":""},
            {"target_id":"linux-x86_64-gnu","os":"sm-standard-4","target":"x86_64-unknown-linux-gnu","cross":true,"platform":"linux","rustflags":"","features":"pyroscope","glibc":"2.31"},
            {"target_id":"linux-aarch64-gnu","os":"ubicloud-standard-16-arm","target":"aarch64-unknown-linux-gnu","cross":true,"platform":"linux","rustflags":"","features":"pyroscope","glibc":"2.31"},
            {"target_id":"macos-aarch64","os":"macos-latest-xlarge","target":"aarch64-apple-darwin","cross":false,"platform":"macos","rustflags":"","features":"pyroscope","glibc":""},
            {"target_id":"windows-x86_64","os":"windows-latest","target":"x86_64-pc-windows-msvc","cross":false,"platform":"windows","rustflags":"","features":"","glibc":""}
          ]}'

          if [[ "$selected" == "linux" || "$selected" == "desktop" ]]; then
            selected=$(jq -r --arg group "$selected" '.include[] | select(if $group == "linux" then .platform == "linux" else .platform != "linux" end) | .target_id' <<<"$all" | paste -sd ',' -)
          fi

          if [[ "${selected}" == "all" ]]; then
            matrix="$(jq -c . <<<"${all}")"
          else
            unknown="$(jq -rn --arg selected "${selected}" --argjson all "${all}" '
              ($selected | split(",") | map(select(length > 0))) as $req
              | ($all.include | map(.target_id)) as $known
              | [$req[] | select(( $known | index(.) ) == null)]
            ')"
            if [[ "$(jq 'length' <<<"${unknown}")" -gt 0 ]]; then
              echo "Unknown platforms: $(jq -r 'join(\",\")' <<<"${unknown}")" >&2
              echo "Allowed: $(jq -r '.include[].target_id' <<<"${all}" | paste -sd ',' -)" >&2
              exit 1
            fi

            matrix="$(jq -c --arg selected "${selected}" '
              ($selected | split(",") | map(select(length > 0))) as $req
              | .include |= map(select(.target_id as $id | ($req | index($id))))
            ' <<<"${all}")"
          fi

          echo "selected=${selected}" >> "$GITHUB_OUTPUT"
          echo "matrix=${matrix}" >> "$GITHUB_OUTPUT"
          echo "Selected platforms: ${selected}"

  build-rustfs:
    # Acceptance workflows select artifacts by this stable platform name.
    name: Build RustFS (${{ matrix.target_id }})
    needs: [ build-check, prepare-platform-matrix, prepare-build-inputs ]
    if: needs.build-check.outputs.should_build == 'true' && needs.prepare-platform-matrix.result == 'success'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 180
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
      RUSTUP_TOOLCHAIN: ${{ needs.prepare-build-inputs.outputs.toolchain }}
      # Release binaries ship without dial9 telemetry and therefore do not need
      # --cfg tokio_unstable. Telemetry builds opt in explicitly (see
      # `make build-profiling`); crates/obs/build.rs fails the compile if the
      # `dial9` feature is enabled without the flag.
      RUSTFLAGS: "${{ matrix.rustflags }}"
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.prepare-platform-matrix.outputs.matrix) }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@f548e57e544e1ff5a4c46bf1e1b8685f8e4a348a # v7
        with:
          persist-credentials: false
          fetch-depth: 0
          ref: ${{ inputs.candidate_manifest != '' && fromJson(inputs.candidate_manifest).source_sha || github.sha }}

      - name: Ensure Python for artifact verification
        if: runner.os == 'Linux'
        shell: bash
        run: |
          if ! command -v python3 >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install -y python3
          fi

      - name: Reuse completed candidate platform
        id: reuse
        if: needs.build-check.outputs.build_type == 'candidate'
        env:
          GH_TOKEN: ${{ github.token }}
          CANDIDATE_MANIFEST: ${{ inputs.candidate_manifest }}
          TARGET: ${{ matrix.target_id }}
        shell: bash
        run: |
          python3 scripts/release/pipeline.py reuse-platform --target "$TARGET"

      - name: Setup Rust environment
        if: steps.reuse.outputs.reused != 'true'
        uses: ./.github/actions/setup
        with:
          rust-version: ${{ needs.prepare-build-inputs.outputs.toolchain }}
          target: ${{ matrix.target }}
          # rust-cache keys include OS and architecture but not the runner image.
          # The Ubicloud aarch64 legs therefore use their own suffix so they
          # cannot restore a cache written on a different arm64 image.
          # x86_64, macOS, and Windows keys stay unsuffixed.
          cache-shared-key: build-${{ matrix.target }}${{ matrix.glibc && format('-glibc-{0}', matrix.glibc) || '' }}${{ matrix.os == 'ubicloud-standard-16-arm' && '-ubicloud-arm' || '' }}
          # main only. A cache saved on refs/tags/X is scoped to that tag: no
          # other tag, no main run and no PR can restore it, so every release
          # cycle wrote up to 12 entries of 1-2GB (preview tag plus final tag,
          # six legs each) that nobody could read, evicting the hot lanes from
          # the repo-wide 10GB quota. Tag builds still restore the main-scoped
          # cache, since default-branch caches are readable from every ref.
          # The one real cost: re-running a failed leg of the same tag no longer
          # finds that tag's own warm cache and falls back to main's.
          cache-save-if: ${{ github.ref == 'refs/heads/main' }}
          install-cross-tools: ${{ matrix.cross }}
          install-test-tools: 'false'

      - name: Download static console assets
        if: steps.reuse.outputs.reused != 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          CONSOLE_IDENTITY: ${{ needs.prepare-build-inputs.outputs.console }}
        run: |
          python3 - <<'PYCONSOLE'
          import json, os, pathlib, subprocess, zipfile
          value = json.loads(os.environ['CONSOLE_IDENTITY'])
          subprocess.run(['python3', '.github/actions/setup/download_release_asset.py',
              '--repository', 'rustfs/console', '--tag', value['tag'], '--asset', value['name'],
              '--sha256', value['sha256'], '--output', 'console.zip'], check=True)
          destination = pathlib.Path('rustfs/static')
          destination.mkdir(parents=True, exist_ok=True)
          with zipfile.ZipFile('console.zip') as archive:
              for member in archive.infolist():
                  path = pathlib.PurePosixPath(member.filename)
                  if path.is_absolute() or '..' in path.parts or '\\' in member.filename:
                      raise SystemExit('unsafe Console archive member')
              archive.extractall(destination)
          if not (destination / 'index.html').is_file():
              raise SystemExit('Console archive has no index.html')
          PYCONSOLE

      - name: Build RustFS
        if: steps.reuse.outputs.reused != 'true'
        shell: bash
        env:
          RUSTFS_BUILD_VERSION: ${{ needs.build-check.outputs.build_type == 'candidate' && needs.build-check.outputs.version || '' }}
          BUILD_TARGET: ${{ matrix.target }}
          BUILD_OS: ${{ matrix.platform }}-${{ startsWith(matrix.target, 'aarch64-') && 'aarch64' || 'x86_64' }}
        run: |
          # Force rebuild by touching build.rs
          touch rustfs/build.rs

          FEATURE_ARGS=()
          if [[ -n "${{ matrix.features }}" ]]; then
            FEATURE_ARGS=(--features "${{ matrix.features }}")
          fi

          # gnu targets pin an explicit glibc baseline (`<target>.<glibc>` for
          # cargo-zigbuild) so release binaries link no symbols newer than it
          # and run on older distros such as RHEL/Rocky 9 (glibc 2.34); #8062.
          TARGET_ARG="$BUILD_TARGET"
          if [[ -n "${{ matrix.glibc }}" ]]; then
            TARGET_ARG="${TARGET_ARG}.${{ matrix.glibc }}"
          fi

          PROFILE_ARGS=()
          if [[ "$BUILD_TARGET" == *-linux-gnu && "${{ matrix.features }}" == "pyroscope" ]]; then
            # The in-process profiler resolves names from the final executable.
            # Retain function symbols without enabling DWARF source information.
            PROFILE_ARGS=(--config 'profile.release.strip="none"')
          fi
          if [[ "${{ matrix.cross }}" == "true" ]]; then
            cargo zigbuild --release --locked --target "$TARGET_ARG" "${FEATURE_ARGS[@]}" "${PROFILE_ARGS[@]}" -p rustfs --bin rustfs
          else
            cargo build --release --locked --target "$TARGET_ARG" "${FEATURE_ARGS[@]}" "${PROFILE_ARGS[@]}" -p rustfs --bin rustfs
          fi

          # All release targets use same-architecture runners, including GNU
          # builds that use Zig only to select the glibc ABI floor.
          bin="target/${{ matrix.target }}/release/rustfs"
          if [[ -f "${bin}.exe" ]]; then
            bin="${bin}.exe"
          fi
          version_output=$("$bin" --version)
          if ! grep -Fxq "build target : ${BUILD_TARGET}" <<< "$version_output" || \
             ! grep -Fxq "build os     : ${BUILD_OS}" <<< "$version_output" || \
             ! grep -Fxq "rust channel : stable-${BUILD_TARGET}" <<< "$version_output"; then
            echo "release binary reports an unexpected compile target" >&2
            exit 1
          fi
          if [[ -n "${{ matrix.glibc }}" ]]; then
            python3 scripts/release/check_glibc.py "${{ matrix.glibc }}" \
              "target/${{ matrix.target }}/release/rustfs"
          fi

      - name: Verify macOS binary has no dynamic liblzma dependency
        if: steps.reuse.outputs.reused != 'true' && (matrix.platform == 'macos')
        shell: bash
        run: |
          binary="target/${{ matrix.target }}/release/rustfs"
          if otool -L "$binary" | grep -E 'liblzma.*\.dylib'; then
            echo "macOS release binary must not depend on a dynamic liblzma library" >&2
            exit 1
          fi
          "$binary" --version

      - name: Generate the CPU symbol catalog
        if: steps.reuse.outputs.reused != 'true' && (endsWith(matrix.target, '-linux-gnu') && matrix.features == 'pyroscope')
        shell: bash
        run: |
          cargo metadata --locked --format-version 1 --filter-platform '${{ matrix.target }}' \
            --features rustfs/pyroscope > "$RUNNER_TEMP/cpu-catalog-metadata.json"
          features=$(jq -ce '
            (.packages[] | select(.name == "rustfs") | .id) as $id |
            .resolve.nodes[] | select(.id == $id) | .features | map(select(. != "default")) | sort
          ' "$RUNNER_TEMP/cpu-catalog-metadata.json")
          release_dir="target/${{ matrix.target }}/release"
          # These task-owned outputs may remain in a restored target cache.
          rm -f "$release_dir/rustfs.cpu-symbol-catalog.json" "$release_dir/rustfs.cpu-symbol-catalog.sha256"
          cargo run --locked -p rustfs-connect-symbol-catalog -- \
            "$release_dir/rustfs" "$(git rev-parse HEAD)" '${{ matrix.target }}' "$features" \
            "$release_dir/rustfs.cpu-symbol-catalog.json" > "$release_dir/rustfs.cpu-symbol-catalog.sha256"

      - name: Create release package
        if: steps.reuse.outputs.reused != 'true'
        id: package
        shell: bash
        run: |
          BUILD_TYPE="${{ needs.build-check.outputs.build_type }}"
          VERSION="${{ needs.build-check.outputs.version }}"
          SHORT_SHA="${{ needs.build-check.outputs.short_sha }}"

          # Extract platform and arch from target
          TARGET="${{ matrix.target }}"
          PLATFORM="${{ matrix.platform }}"
          # Map target to architecture and variant
          case "$TARGET" in
            *x86_64*musl*)
              ARCH="x86_64"
              VARIANT="musl"
              ;;
            *x86_64*gnu*)
              ARCH="x86_64"
              VARIANT="gnu"
              ;;
            *x86_64*)
              ARCH="x86_64"
              VARIANT=""
              ;;
            *aarch64*musl*|*arm64*musl*)
              ARCH="aarch64"
              VARIANT="musl"
              ;;
            *aarch64*gnu*|*arm64*gnu*)
              ARCH="aarch64"
              VARIANT="gnu"
              ;;
            *aarch64*|*arm64*)
              ARCH="aarch64"
              VARIANT=""
              ;;
            *armv7*)
              ARCH="armv7"
              VARIANT=""
              ;;
            *)
              ARCH="unknown"
              VARIANT=""
              ;;
          esac

          # Normalize version used for package filenames
          PACKAGE_VERSION="${VERSION}"
          if [[ "$PACKAGE_VERSION" == v* ]]; then
            PACKAGE_VERSION="${PACKAGE_VERSION#v}"
          fi

          # Generate package name based on build type
          if [[ -n "$VARIANT" ]]; then
            ARCH_WITH_VARIANT="${ARCH}-${VARIANT}"
          else
            ARCH_WITH_VARIANT="${ARCH}"
          fi
          PACKAGE_BASENAME="rustfs-${PLATFORM}-${ARCH_WITH_VARIANT}"

          if [[ "$BUILD_TYPE" == "development" ]]; then
            # Development build: rustfs-${platform}-${arch}-${variant}-dev-${short_sha}.zip
            PACKAGE_NAME="rustfs-${PLATFORM}-${ARCH_WITH_VARIANT}-dev-${SHORT_SHA}"
          else
            # Release/Prerelease build: rustfs-${platform}-${arch}-${variant}-v${version}.zip
            PACKAGE_NAME="${PACKAGE_BASENAME}-v${PACKAGE_VERSION}"
          fi
          
          # Create zip packages for all platforms
          # Ensure zip is available
          if ! command -v zip &> /dev/null; then
            if [[ "${{ matrix.os }}" == "ubuntu-latest" || "${{ matrix.platform }}" == "linux" ]]; then
              sudo apt-get update && sudo apt-get install -y zip
            fi
          fi

          cd target/${{ matrix.target }}/release
          # Determine the binary name based on platform
          if [[ "${{ matrix.platform }}" == "windows" ]]; then
            BINARY_NAME="rustfs.exe"
          else
            BINARY_NAME="rustfs"
          fi

          BINARY_FILES=("$BINARY_NAME")

          if [[ "$TARGET" == *-linux-gnu && "${{ matrix.features }}" == "pyroscope" ]]; then
            BINARY_FILES+=(rustfs.cpu-symbol-catalog.json rustfs.cpu-symbol-catalog.sha256)
          fi

          # Verify the binaries exist before packaging
          for binary in "${BINARY_FILES[@]}"; do
            if [[ ! -f "$binary" ]]; then
              echo "❌ Binary $binary not found in $(pwd)"
              if [[ "${{ matrix.platform }}" == "windows" ]]; then
                dir
              else
                ls -la
              fi
              exit 1
            fi
          done

          # Universal packaging function
          package_zip() {
            local src=$1
            local dst=$2
            if [[ "${{ matrix.platform }}" == "windows" ]]; then
              # Windows uses PowerShell Compress-Archive
              powershell -Command "Compress-Archive -Path '$src' -DestinationPath '$dst' -Force"
            elif command -v zip &> /dev/null; then
              # Unix systems use zip command
              zip "$dst" "$src"
            else
              echo "❌ No zip utility available"
              exit 1
            fi
          }

          # Create the zip package
          echo "Start packaging: ${BINARY_FILES[*]} -> ../../../${PACKAGE_NAME}.zip"
          if [[ "${{ matrix.platform }}" == "linux" ]]; then
            zip "../../../${PACKAGE_NAME}.zip" "${BINARY_FILES[@]}"
          else
            package_zip "$BINARY_NAME" "../../../${PACKAGE_NAME}.zip"
          fi

          cd ../../..

          # Verify the package was created
          if [[ -f "${PACKAGE_NAME}.zip" ]]; then
            echo "✅ Package created successfully: ${PACKAGE_NAME}.zip"
            if [[ "${{ matrix.platform }}" == "windows" ]]; then
              dir
            else
              ls -lh "${PACKAGE_NAME}.zip"
            fi
          else
            echo "❌ Failed to create package: ${PACKAGE_NAME}.zip"
            exit 1
          fi

          # Create latest version files right after the main package
          LATEST_FILES=""
          if [[ "$BUILD_TYPE" == "release" ]] || [[ "$BUILD_TYPE" == "prerelease" ]]; then
            # Create latest version filename
            # Convert from rustfs-linux-x86_64-musl-v1.0.0 to rustfs-linux-x86_64-musl-latest
            LATEST_FILE="${PACKAGE_BASENAME}-latest.zip"

            echo "🔄 Creating latest version: ${PACKAGE_NAME}.zip -> $LATEST_FILE"
            cp "${PACKAGE_NAME}.zip" "$LATEST_FILE"

            if [[ -f "$LATEST_FILE" ]]; then
              echo "✅ Latest version created: $LATEST_FILE"
              LATEST_FILES="$LATEST_FILE"
            fi
          elif [[ "$BUILD_TYPE" == "development" ]]; then
            # Development builds (nightly schedule and manual dispatch)
            # Create main-latest version filename
            # Convert from rustfs-linux-x86_64-dev-abc123 to rustfs-linux-x86_64-main-latest
            MAIN_LATEST_FILE="${PACKAGE_BASENAME}-main-latest.zip"

            echo "🔄 Creating main-latest version: ${PACKAGE_NAME}.zip -> $MAIN_LATEST_FILE"
            cp "${PACKAGE_NAME}.zip" "$MAIN_LATEST_FILE"

            if [[ -f "$MAIN_LATEST_FILE" ]]; then
              echo "✅ Main-latest version created: $MAIN_LATEST_FILE"
              LATEST_FILES="$MAIN_LATEST_FILE"

              # Also create a generic main-latest for Docker builds (Linux only)
              if [[ "${{ matrix.platform }}" == "linux" ]]; then
                DOCKER_MAIN_LATEST_FILE="rustfs-linux-${ARCH_WITH_VARIANT}-main-latest.zip"

                echo "🔄 Creating Docker main-latest version: ${PACKAGE_NAME}.zip -> $DOCKER_MAIN_LATEST_FILE"
                cp "${PACKAGE_NAME}.zip" "$DOCKER_MAIN_LATEST_FILE"

                if [[ -f "$DOCKER_MAIN_LATEST_FILE" ]]; then
                  echo "✅ Docker main-latest version created: $DOCKER_MAIN_LATEST_FILE"
                  LATEST_FILES="$LATEST_FILES $DOCKER_MAIN_LATEST_FILE"
                fi
              fi
            fi
          fi

          {
            echo "package_name=${PACKAGE_NAME}"
            echo "package_file=${PACKAGE_NAME}.zip"
            echo "latest_files=${LATEST_FILES}"
            echo "build_type=${BUILD_TYPE}"
            echo "version=${VERSION}"
          } >> "$GITHUB_OUTPUT"

          echo "📦 Package created: ${PACKAGE_NAME}.zip"
          if [[ -n "$LATEST_FILES" ]]; then
            echo "📦 Latest files created: $LATEST_FILES"
          fi
          echo "🔧 Build type: ${BUILD_TYPE}"
          echo "📊 Version: ${VERSION}"

      - name: Verify packaged Linux binary
        if: steps.reuse.outputs.reused != 'true' && (matrix.platform == 'linux')
        shell: bash
        run: |
          set -euo pipefail

          package_file="${{ steps.package.outputs.package_file }}"
          archive_members="$(unzip -Z1 "$package_file" | sort)"
          expected_members='rustfs'
          target="${{ matrix.target }}"
          features="${{ matrix.features }}"
          if [[ "$target" == *-linux-gnu && "$features" == "pyroscope" ]]; then
            expected_members+=$'\nrustfs.cpu-symbol-catalog.json\nrustfs.cpu-symbol-catalog.sha256'
          fi
          if [[ "$archive_members" != "$expected_members" ]]; then
            echo "Linux package does not contain the expected files" >&2
            printf '%s\n' "$archive_members" >&2
            exit 1
          fi

          # musl targets build natively; the gnu legs are same-arch
          # cargo-zigbuild builds pinned to the release glibc baseline. Either
          # way the binaries run on their runner, so executing them here
          # proves each artifact matches its runner architecture.
          binary_dir="$(mktemp -d)"
          trap 'rm -rf "$binary_dir"' EXIT
          unzip -q "$package_file" rustfs -d "$binary_dir"
          "$binary_dir/rustfs" --version

      - name: Verify packaged console
        if: steps.reuse.outputs.reused != 'true' && (matrix.target == 'x86_64-unknown-linux-gnu' || matrix.target == 'aarch64-unknown-linux-gnu')
        shell: bash
        run: |
          set -euo pipefail

          find_free_port() {
            python3 - <<'PY'
          import socket

          with socket.socket() as sock:
              sock.bind(("127.0.0.1", 0))
              print(sock.getsockname()[1])
          PY
          }

          package_dir="$(mktemp -d)"
          data_dir="$(mktemp -d)"
          log_file="${RUNNER_TEMP}/rustfs-console-smoke.log"
          server_pid=""
          trap '
            if [[ -n "${server_pid:-}" ]]; then
              kill "$server_pid" 2>/dev/null || true
              wait "$server_pid" 2>/dev/null || true
            fi
            rm -rf "$package_dir" "$data_dir"
          ' EXIT

          unzip -q "${{ steps.package.outputs.package_file }}" -d "$package_dir"
          api_port="$(find_free_port)"
          console_port="$(find_free_port)"
          console_url="http://127.0.0.1:${console_port}/rustfs/console/"

          "$package_dir/rustfs" server \
            --address "127.0.0.1:${api_port}" \
            --console-enable \
            --console-address "127.0.0.1:${console_port}" \
            --access-key console-smoke \
            --secret-key console-smoke-secret \
            "$data_dir" >"$log_file" 2>&1 &
          server_pid=$!

          for _ in {1..40}; do
            response="$(curl --silent --output /dev/null --write-out '%{http_code} %{content_type}' "$console_url" || true)"
            if [[ "$response" == 200\ text/html* ]]; then
              exit 0
            fi
            sleep 0.25
          done

          echo "Console endpoint did not return 200 text/html: $response" >&2
          cat "$log_file"
          exit 1

      - name: Verify native candidate and retain receipts
        if: needs.build-check.outputs.build_type == 'candidate' && steps.reuse.outputs.reused != 'true'
        env:
          CANDIDATE_MANIFEST: ${{ inputs.candidate_manifest }}
          TARGET: ${{ matrix.target_id }}
          ARCHIVE: ${{ steps.package.outputs.package_file }}
        shell: bash
        run: |
          python3 -c 'import os; from pathlib import Path; Path("inputs.json").write_text(os.environ["CANDIDATE_MANIFEST"])'
          python3 scripts/release/verify.py native --inputs inputs.json --archive "$ARCHIVE" --target "$TARGET" --output .

      - name: Record candidate artifact identity
        if: steps.reuse.outputs.reused != 'true' && (needs.build-check.outputs.build_type == 'candidate')
        env:
          CANDIDATE_MANIFEST: ${{ inputs.candidate_manifest }}
          TARGET_ID: ${{ matrix.target_id }}
          PACKAGE_FILE: ${{ steps.package.outputs.package_file }}
        shell: bash
        run: |
          python3 - <<'PYRECORD'
          import json, os, sys
          sys.path.insert(0, 'scripts/release')
          import candidate
          value = candidate.validate_inputs(json.loads(os.environ['CANDIDATE_MANIFEST']))
          record = candidate.archive_record(os.environ['PACKAGE_FILE'], os.environ['TARGET_ID'], value)
          candidate.write_json('record-' + os.environ['TARGET_ID'] + '.json', record)
          PYRECORD

      - name: Upload to GitHub artifacts
        if: steps.reuse.outputs.reused != 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ needs.build-check.outputs.build_type == 'candidate' && format('candidate-{0}-{1}', needs.build-check.outputs.candidate_id, matrix.target_id) || steps.package.outputs.package_name }}
          path: |
            rustfs-*.zip
            record-${{ matrix.target_id }}.json
            identity-${{ matrix.target_id }}*
            startup-${{ matrix.target_id }}.log
          if-no-files-found: error
          retention-days: ${{ (startsWith(github.ref, 'refs/tags/') || needs.build-check.outputs.build_type == 'candidate') && 30 || 7 }}

      - name: Upload to Cloudflare R2
        if: steps.reuse.outputs.reused != 'true' && (needs.build-check.outputs.should_publish == 'true' && env.R2_ACCESS_KEY_ID != '' && (needs.build-check.outputs.build_type == 'release' || needs.build-check.outputs.build_type == 'prerelease' || needs.build-check.outputs.build_type == 'development'))
        env:
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
          AWS_EC2_METADATA_DISABLED: true
        shell: bash
        run: |
          BUILD_TYPE="${{ needs.build-check.outputs.build_type }}"

          if [[ -z "$R2_ACCESS_KEY_ID" || -z "$R2_SECRET_ACCESS_KEY" || -z "$R2_ENDPOINT" || -z "$R2_BUCKET" ]]; then
            echo "⚠️ R2 credentials or endpoint missing, skipping artifact upload"
            exit 0
          fi

          # ARC pods (the x86_64 legs) do not ship the aws CLI. Ubicloud arm64
          # images follow the GitHub runner image and often do. Install the
          # official CLI bundle when it is missing so R2 uploads work on either.
          if ! command -v aws >/dev/null 2>&1; then
            echo "aws CLI not found on runner; installing..."
            if command -v apt-get >/dev/null 2>&1; then
              aws_arch="$(uname -m)"
              case "$aws_arch" in
                x86_64) aws_arch="x86_64" ;;
                aarch64|arm64) aws_arch="aarch64" ;;
                *)
                  echo "❌ Unsupported Linux architecture for AWS CLI: $aws_arch"
                  exit 1
                  ;;
              esac

              aws_install_root="${RUNNER_TEMP:-$PWD}/aws-cli"
              rm -rf "$aws_install_root"
              mkdir -p "$aws_install_root"
              curl --fail --location --retry 3 \
                "https://awscli.amazonaws.com/awscli-exe-linux-${aws_arch}.zip" \
                --output "$aws_install_root/awscliv2.zip"
              unzip -q "$aws_install_root/awscliv2.zip" -d "$aws_install_root"
              "$aws_install_root/aws/install" \
                --install-dir "$aws_install_root/aws-cli" \
                --bin-dir "$aws_install_root/bin"
              export PATH="$aws_install_root/bin:$PATH"
              aws --version
            elif command -v brew >/dev/null 2>&1; then
              brew install awscli
            else
              echo "❌ aws CLI missing and no apt-get/brew to install it; cannot upload to R2"
              exit 1
            fi
          fi

          export AWS_ACCESS_KEY_ID="$R2_ACCESS_KEY_ID"
          export AWS_SECRET_ACCESS_KEY="$R2_SECRET_ACCESS_KEY"
          export AWS_DEFAULT_REGION="auto"

          # Determine upload path based on build type. Release and prerelease
          # builds only stage their bytes here: the official
          # artifacts/rustfs/release/ path is written solely by the
          # certification-gated promote-release-artifacts job, from these same
          # staged objects. Development builds keep the uncertified dev channel
          # and never touch official or latest channels.
          if [[ "$BUILD_TYPE" == "development" ]]; then
            R2_PATH="s3://${R2_BUCKET}/artifacts/rustfs/dev/"
            echo "📤 Uploading development build to R2 dev directory"
          else
            R2_PATH="s3://${R2_BUCKET}/artifacts/rustfs/staging/${GITHUB_RUN_ID}/${GITHUB_RUN_ATTEMPT}/"
            echo "📤 Staging release build for certification-gated promotion"
          fi

          # Upload all rustfs zip files to R2 using S3-compatible API
          echo "📤 Uploading all rustfs-*.zip files to $R2_PATH..."
          for zip_file in rustfs-*.zip; do
            if [[ -f "$zip_file" ]]; then
              echo "Uploading: $zip_file to $R2_PATH..."
              aws s3 cp "$zip_file" "$R2_PATH" --endpoint-url "$R2_ENDPOINT" --only-show-errors
              echo "✅ Uploaded: $zip_file"
            fi
          done

          echo "✅ Upload completed successfully"


  # Build summary
  build-summary:
    name: Build Summary
    needs: [ build-check, build-rustfs ]
    if: always() && needs.build-check.outputs.should_build == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Build completion summary
        shell: bash
        env:
          SHOULD_PUBLISH: ${{ needs.build-check.outputs.should_publish }}
          BUILD_TYPE: ${{ needs.build-check.outputs.build_type }}
          VERSION: ${{ needs.build-check.outputs.version }}
          BUILD_STATUS: ${{ needs.build-rustfs.result }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          echo "Build type: $BUILD_TYPE"
          echo "Version: $VERSION"
          echo "Build result: $BUILD_STATUS"
          if [[ "$SHOULD_PUBLISH" != "true" ]]; then
            echo "Artifact-only run: no download channels or GitHub Releases are updated."
            echo "Successful platform packages are available as workflow artifacts."
          elif [[ "$BUILD_STATUS" == "success" ]]; then
            echo "Publishing enabled; check the upload and release jobs for their results."
          else
            echo "Build incomplete; check individual platform jobs for any completed uploads."
          fi
          if [[ "$EVENT_NAME" == "push" && "$GITHUB_REF" == refs/tags/* && "$BUILD_STATUS" == "success" ]]; then
            echo "Docker publishing is eligible through the downstream workflow."
          else
            echo "This run does not trigger Docker publishing."
          fi

  alert-on-failure:
    name: Alert on scheduled failure
    needs: [build-check, prepare-build-inputs, prepare-platform-matrix, build-rustfs, build-summary]
    if: >-
      always() && github.event_name == 'schedule' &&
      (contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled'))
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@f548e57e544e1ff5a4c46bf1e1b8685f8e4a348a # v7
        with:
          persist-credentials: false
      - name: Open or update failure-tracking issue
        uses: ./.github/actions/schedule-failure-issue
        with:
          github-token: ${{ secrets.BACKLOG_ISSUE_TOKEN }}
