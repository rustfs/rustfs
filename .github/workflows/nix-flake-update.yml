name: Update Nix Flake

on:
  workflow_dispatch:
  schedule:
    - cron: '0 5 * * 0' # Weekly on Sunday 05:00 UTC (staggered after the midnight ci/build crons)

# GITHUB_TOKEN only needs to read the repository here: the branch push and the
# pull request are both created by update-flake-lock using the
# FLAKE_UPDATE_TOKEN PAT below, not by this token. Leaving write on it hands a
# repo-write credential to an unattended weekly job that does not use it.
permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  update-flake:
    name: Update flake.lock
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
    steps:
      - name: Checkout repository
        uses: actions/checkout@f548e57e544e1ff5a4c46bf1e1b8685f8e4a348a # v7
        # persist-credentials-exempt: update-flake-lock pushes the branch and opens
        # the PR. It passes FLAKE_UPDATE_TOKEN to create-pull-request itself rather
        # than reusing .git/config, but that is unverified — exempt until a
        # workflow_dispatch run confirms it (rustfs/backlog#1602).

      - name: Install Nix
        uses: DeterminateSystems/determinate-nix-action@8d87e8d5e5b8a8309d4281094560f127d9a265f1 # v3.22.5

      - name: Cache Nix
        uses: DeterminateSystems/flakehub-cache-action@83282a8aef353db1d659d3bacf4a28b6683de0b3 # v3.22.5

      - name: Check Nix flake inputs
        uses: DeterminateSystems/flake-checker-action@786422608c7bded2bbc9741ad9f91356842bf520 # v14

      - name: Update flake.lock
        id: update
        uses: DeterminateSystems/update-flake-lock@da03c0f078bc4b2c37ee4f7e072d34bf8f188bb3 # v29
        with:
          git-author-name: houseme
          git-author-email: housemecn@gmail.com
          git-committer-name: houseme
          git-committer-email: housemecn@gmail.com
          pr-title: "chore(deps): update flake.lock"
          pr-labels: |
            dependencies
            nix
            automated
          commit-msg: "chore(deps): update flake.lock"
          pr-reviewers: overtrue, majinghe
          token: ${{ secrets.FLAKE_UPDATE_TOKEN }}

      - name: Log PR details
        if: steps.update.outputs.pull-request-number
        run: |
          echo "Pull Request created: ${{ steps.update.outputs.pull-request-number }}"
