# Reusable workflows run from this driver's commit in one Actions run. Each
# suite still runs after an earlier suite fails; the final job requires all twelve.
name: RustFS Functional Chain

on:
  workflow_dispatch:
    inputs:
      build_run_id:
        description: Successful nightly or validation package run; empty for package-only build
        type: string
        required: false
        default: ''
      build_run_attempt:
        description: Exact successful build attempt
        type: string
        required: false
        default: ''
      validation_package_sha:
        description: Exact source SHA for an isolated package-only build
        type: string
        required: false
        default: ''
      validation_case:
        description: Canonical case ID, environment.inspect for read-only resources, or empty for functional chain
        type: string
        required: false
        default: ''
      auto_testing_sha:
        description: Exact auto-testing commit for a validation case
        type: string
        required: false
        default: ''
      validation_tools_only:
        description: Build candidate-bound validation tools without running a fleet case
        type: boolean
        required: false
        default: false
      validation_native_tools:
        description: Include exact-source native regressions in a tools-only build
        type: boolean
        required: false
        default: false
      validation_shared_tools:
        description: Include the controlled C10 shared-reference encoder in a tools-only build
        type: boolean
        required: false
        default: false
      validation_manager_tools:
        description: Include exact checkpoint/MRF/incarnation regressions in a tools-only build
        type: boolean
        required: false
        default: false
      validation_cleanup_run_id:
        description: Failed validation run whose supported retained environment needs evidence-based finalization
        type: string
        required: false
        default: ''
      validation_tools_run_id:
        description: Successful tool build run; required by Heal physical metadata checks
        type: string
        required: false
        default: ''
      validation_tools_run_attempt:
        description: Exact tool build attempt
        type: string
        required: false
        default: '1'
  workflow_run:
    workflows: ["Nightly GNU Build"]
    types: [completed]

permissions:
  contents: read
  actions: read

concurrency:
  group: ${{ github.event_name == 'workflow_dispatch' && inputs.validation_package_sha != '' && format('rustfs-functional-validation-package-{0}', inputs.validation_package_sha) || github.event_name == 'workflow_dispatch' && inputs.validation_tools_only && 'rustfs-functional-validation-tools' || 'rustfs-functional-chain-runs' }}
  cancel-in-progress: false

jobs:
  validation-package-request:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.validation_package_sha != '' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Validate exclusive package-only request
        env:
          PACKAGE_INPUTS: ${{ toJSON(inputs) }}
        run: |
          python3 - <<'PY'
          import json
          import os
          import re
          value = json.loads(os.environ["PACKAGE_INPUTS"])
          if re.fullmatch(r"[0-9a-f]{40}", value["validation_package_sha"]) is None:
              raise ValueError("package build requires an exact source SHA")
          exclusive = ("build_run_id", "build_run_attempt", "validation_case", "auto_testing_sha",
                       "validation_tools_only", "validation_native_tools", "validation_shared_tools",
                       "validation_manager_tools", "validation_cleanup_run_id", "validation_tools_run_id")
          if any(value.get(name) for name in exclusive):
              raise ValueError("package-only build cannot select existing candidate, tools, fleet or recovery execution")
          PY

  validation-package:
    needs: validation-package-request
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.validation_package_sha != '' }}
    uses: ./.github/workflows/rustfs-validation-package.yml
    with:
      source_sha: ${{ inputs.validation_package_sha }}
    secrets:
      R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
      R2_BUCKET: ${{ secrets.R2_BUCKET }}

  prepare:
    if: ${{ (github.event_name == 'workflow_dispatch' && inputs.validation_package_sha == '' && inputs.validation_case == '' && !inputs.validation_tools_only && !inputs.validation_native_tools && !inputs.validation_shared_tools && !inputs.validation_manager_tools && inputs.validation_cleanup_run_id == '') || github.event.workflow_run.event == 'schedule' }}
    runs-on: smoke-testing
    timeout-minutes: 10
    outputs:
      manifest: ${{ steps.candidate.outputs.manifest }}
      performance_ready: ${{ steps.perf_probe.outputs.performance_ready }}
    steps:
      - uses: actions/checkout@f548e57e544e1ff5a4c46bf1e1b8685f8e4a348a # v7
        with:
          persist-credentials: false
      - name: Resolve published candidate
        id: candidate
        env:
          # The staleness probe in resolve_functional_candidate.py reads the
          # private rustfs/auto-testing repo; github.token cannot, and a probe
          # failure silently keeps a stale testing_sha pinned for the chain.
          GH_TOKEN: ${{ secrets.PF_TESTING_GH_TOKEN }}
          BUILD_RUN_ID: ${{ inputs.build_run_id }}
          BUILD_RUN_ATTEMPT: ${{ inputs.build_run_attempt }}
          CHAIN_OUTPUT: ${{ runner.temp }}/chain-candidate.json
        run: python3 scripts/resolve_functional_candidate.py
      - name: Retain candidate identity
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: functional-candidate-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/chain-candidate.json
          if-no-files-found: error

      - name: Check shared functional fleet runner before scheduling suites
        # The eleven functional suites run on the smoke-testing fleet; a hard
        # requirement. The performance lane runs on pf-testing, which is a
        # separate fleet - probe it without failing the whole chain so an
        # offline performance runner skips only the performance lane.
        env:
          GH_TOKEN: ${{ secrets.PF_TESTING_GH_TOKEN }}
        run: python3 scripts/check_functional_runners.py smoke-testing

      - name: Probe performance fleet runner
        id: perf_probe
        env:
          GH_TOKEN: ${{ secrets.PF_TESTING_GH_TOKEN }}
        run: |
          if python3 scripts/check_functional_runners.py pf-testing; then
            echo "performance_ready=online" >> "$GITHUB_OUTPUT"
          else
            echo "performance_ready=offline" >> "$GITHUB_OUTPUT"
          fi

  validation:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.validation_package_sha == '' && (inputs.validation_case != '' || inputs.validation_tools_only || inputs.validation_native_tools || inputs.validation_shared_tools || inputs.validation_manager_tools || inputs.validation_cleanup_run_id != '') }}
    runs-on: ${{ inputs.validation_tools_only && 'ubuntu-latest' || 'smoke-testing' }}
    timeout-minutes: 90
    outputs:
      source_sha: ${{ steps.candidate.outputs.source_sha }}
    concurrency:
      group: ${{ inputs.validation_tools_only && 'rustfs-validation-tools-resolver' || 'rustfs-shared-functional-tests-v2' }}
      cancel-in-progress: false
    env:
      RUSTFS_ACCESS_KEY: ${{ !inputs.validation_tools_only && secrets.RUSTFS_ACCESS_KEY || '' }}
      RUSTFS_SECRET_KEY: ${{ !inputs.validation_tools_only && secrets.RUSTFS_SECRET_KEY || '' }}
      RUSTFS_API_ENDPOINT: ${{ !inputs.validation_tools_only && (secrets.RUSTFS_API_ENDPOINT || vars.RUSTFS_API_ENDPOINT || vars.RUSTFS_RC_ENDPOINT) || '' }}
      RUSTFS_NODES: ${{ !inputs.validation_tools_only && (secrets.RUSTFS_NODES || vars.RUSTFS_NODES) || '' }}
      RUSTFS_SSH_USER: ${{ !inputs.validation_tools_only && (secrets.RUSTFS_SSH_USER || vars.RUSTFS_SSH_USER) || '' }}
    steps:
      - name: Checkout candidate resolver
        uses: actions/checkout@f548e57e544e1ff5a4c46bf1e1b8685f8e4a348a # v7
        with:
          persist-credentials: false

      - name: Initialize validation evidence
        run: |
          set -euo pipefail
          umask 077
          VALIDATION_ROOT="${RUNNER_TEMP}/rustfs-validation-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          mkdir -- "${VALIDATION_ROOT}"
          printf 'VALIDATION_ROOT=%s\n' "${VALIDATION_ROOT}" >> "${GITHUB_ENV}"

      - name: Resolve immutable candidate
        id: candidate
        env:
          GH_TOKEN: ${{ secrets.PF_TESTING_GH_TOKEN }}
          BUILD_RUN_ID: ${{ inputs.build_run_id }}
          BUILD_RUN_ATTEMPT: ${{ inputs.build_run_attempt }}
          AUTO_TESTING_SHA: ${{ inputs.auto_testing_sha }}
          CLEANUP_RUN_ID: ${{ inputs.validation_cleanup_run_id }}
          SELECTED_CASE: ${{ inputs.validation_case }}
          TOOLS_ONLY: ${{ inputs.validation_tools_only }}
          NATIVE_TOOLS: ${{ inputs.validation_native_tools }}
          SHARED_TOOLS: ${{ inputs.validation_shared_tools }}
          MANAGER_TOOLS: ${{ inputs.validation_manager_tools }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path
          import re
          from scripts.resolve_functional_candidate import resolve

          revision = os.environ["AUTO_TESTING_SHA"]
          cleanup = os.environ["CLEANUP_RUN_ID"]
          if os.environ["TOOLS_ONLY"] == "true" and (cleanup or os.environ["SELECTED_CASE"]):
              raise ValueError("tools-only execution cannot select a fleet case or cleanup")
          if os.environ["NATIVE_TOOLS"] == "true" and (os.environ["TOOLS_ONLY"] != "true" or cleanup or os.environ["SELECTED_CASE"]):
              raise ValueError("native regressions require tools-only execution, without a fleet case or cleanup")
          if os.environ["SHARED_TOOLS"] == "true" and (os.environ["TOOLS_ONLY"] != "true" or cleanup or os.environ["SELECTED_CASE"]):
              raise ValueError("shared fixture builds require tools-only execution, without a fleet case or cleanup")
          if os.environ["MANAGER_TOOLS"] == "true" and (os.environ["TOOLS_ONLY"] != "true" or cleanup or os.environ["SELECTED_CASE"]):
              raise ValueError("manager regressions require tools-only execution, without a fleet case or cleanup")
          if cleanup and (not cleanup.isdigit() or int(cleanup) <= 0 or os.environ["SELECTED_CASE"] or os.environ["TOOLS_ONLY"] == "true"):
              raise ValueError("cleanup requires one exact failed run and is exclusive with case/tool execution")
          if re.fullmatch(r"[0-9a-f]{40}", revision) is None:
              raise ValueError("validation requires an exact auto-testing commit SHA")
          candidate = resolve(int(os.environ["BUILD_RUN_ID"]), int(os.environ["BUILD_RUN_ATTEMPT"]), allow_validation=True)
          manifest = candidate["manifest"]
          root = Path(os.environ["VALIDATION_ROOT"])
          (root / "candidate-source.json").write_text(json.dumps(candidate, sort_keys=True) + "\n")
          (root / "candidate.json").write_text(json.dumps({
              "package_url": manifest["package_url"],
              "package_sha256": manifest["package_sha256"],
              "source_sha": manifest["source_sha"],
          }, sort_keys=True) + "\n")
          with open(os.environ["GITHUB_OUTPUT"], "a") as output:
              output.write("source_sha=" + manifest["source_sha"] + "\n")
          PY

      - name: Checkout exact auto-testing revision
        uses: actions/checkout@f548e57e544e1ff5a4c46bf1e1b8685f8e4a348a # v7
        with:
          repository: rustfs/auto-testing
          ref: ${{ inputs.auto_testing_sha }}
          token: ${{ secrets.PF_TESTING_GH_TOKEN }}
          path: auto-testing
          persist-credentials: false

      - name: Install validation Python client
        if: ${{ !inputs.validation_tools_only && (startsWith(inputs.validation_case, 'ilm.') || startsWith(inputs.validation_case, 'pool.') || startsWith(inputs.validation_case, 'bucket-replication.') || startsWith(inputs.validation_case, 'site-replication.') || startsWith(inputs.validation_case, 'heal.')) }}
        run: |
          set -euo pipefail
          python3 -m venv "${RUNNER_TEMP}/rustfs-validation-python"
          "${RUNNER_TEMP}/rustfs-validation-python/bin/python" -m pip install \
            -r auto-testing/scripts/validation_ilm/requirements.txt
          printf '%s\n' "${RUNNER_TEMP}/rustfs-validation-python/bin" >> "${GITHUB_PATH}"

      - name: Validate Heal tool build identity
        if: ${{ !inputs.validation_tools_only && startsWith(inputs.validation_case, 'heal.') }}
        env:
          GH_TOKEN: ${{ github.token }}
          TOOL_RUN_ID: ${{ inputs.validation_tools_run_id }}
          TOOL_RUN_ATTEMPT: ${{ inputs.validation_tools_run_attempt }}
        run: |
          set -euo pipefail
          [[ "${TOOL_RUN_ID}" =~ ^[1-9][0-9]*$ ]]
          [[ "${TOOL_RUN_ATTEMPT}" =~ ^[1-9][0-9]*$ ]]
          gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${TOOL_RUN_ID}/attempts/${TOOL_RUN_ATTEMPT}" \
            > "${VALIDATION_ROOT}/tool-run.json"
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path
          value = json.loads((Path(os.environ["VALIDATION_ROOT"]) / "tool-run.json").read_text())
          if (value.get("conclusion") != "success" or value.get("status") != "completed"
                  or value.get("run_attempt") != int(os.environ["TOOL_RUN_ATTEMPT"])
                  or value.get("path") not in {".github/workflows/rustfs-functional-chain.yml", ".github/workflows/rustfs-validation-tools.yml"}):
              raise ValueError("Heal tool run is not an exact successful validation build attempt")
          PY

      - name: Download pinned Heal metadata inspector
        if: ${{ !inputs.validation_tools_only && startsWith(inputs.validation_case, 'heal.') }}
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          github-token: ${{ github.token }}
          run-id: ${{ inputs.validation_tools_run_id }}
          name: rustfs-validation-tools-${{ inputs.validation_tools_run_id }}-${{ inputs.validation_tools_run_attempt }}
          path: ${{ runner.temp }}/rustfs-validation-tools-${{ github.run_id }}-${{ github.run_attempt }}

      - name: Verify Heal metadata inspector
        if: ${{ !inputs.validation_tools_only && startsWith(inputs.validation_case, 'heal.') }}
        run: |
          set -euo pipefail
          TOOL_DIRECTORY="${RUNNER_TEMP}/rustfs-validation-tools-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          python3 -B auto-testing/scripts/validation_heal/inspector.py \
            --directory "${TOOL_DIRECTORY}" --candidate "${VALIDATION_ROOT}/candidate.json" \
            > "${VALIDATION_ROOT}/tool-manifest.json"
          printf 'VALIDATION_HEAL_TOOL_DIRECTORY=%s\n' "${TOOL_DIRECTORY}" >> "${GITHUB_ENV}"

      - name: Select exact-source G01 native evidence
        id: race_native
        if: ${{ inputs.validation_case == 'heal.race-unversioned-overwrite' }}
        env:
          CANDIDATE_SHA: ${{ steps.candidate.outputs.source_sha }}
        run: |
          set -euo pipefail
          required=false
          if [ -f auto-testing/scripts/validation_heal/race_native.py ]; then
            status=0
            python3 -B auto-testing/scripts/validation_heal/race_native.py supports \
              --commit "${CANDIDATE_SHA}" --case-id heal.race-unversioned-overwrite || status=$?
            if [ "${status}" -eq 0 ]; then
              required=true
            elif [ "${status}" -ne 2 ]; then
              exit "${status}"
            fi
          fi
          if [ "${CANDIDATE_SHA}" = 6afdec9fe1b0b88007f2e5b445c19bf73d51d3ca ] && [ "${required}" != true ]; then
            printf 'G01 candidate requires its reviewed native collector before fleet execution\n' >&2
            exit 1
          fi
          printf 'required=%s\n' "${required}" >> "${GITHUB_OUTPUT}"

      - name: Download pinned native storage evidence
        if: ${{ inputs.validation_case == 'heal.conflicting-subquorum-authority' || inputs.validation_case == 'heal.bucket-incarnation-recreation' || steps.race_native.outputs.required == 'true' }}
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          github-token: ${{ github.token }}
          run-id: ${{ inputs.validation_tools_run_id }}
          name: rustfs-validation-native-${{ inputs.validation_tools_run_id }}-${{ inputs.validation_tools_run_attempt }}
          path: ${{ runner.temp }}/rustfs-validation-native-${{ github.run_id }}-${{ github.run_attempt }}

      - name: Verify C07 native source and exact test evidence
        if: ${{ inputs.validation_case == 'heal.conflicting-subquorum-authority' }}
        run: |
          set -euo pipefail
          NATIVE_DIRECTORY="${RUNNER_TEMP}/rustfs-validation-native-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          cp "${VALIDATION_ROOT}/tool-run.json" "${NATIVE_DIRECTORY}/tool-run.json"
          python3 -B auto-testing/scripts/validation_heal/authority.py \
            --directory "${NATIVE_DIRECTORY}" --candidate "${VALIDATION_ROOT}/candidate.json" \
            > "${VALIDATION_ROOT}/native-authority-manifest.json"
          printf 'VALIDATION_HEAL_NATIVE_DIRECTORY=%s\n' "${NATIVE_DIRECTORY}" >> "${GITHUB_ENV}"

      - name: Verify C11 physical storage and exact final-rename barrier
        if: ${{ inputs.validation_case == 'heal.bucket-incarnation-recreation' }}
        run: |
          set -euo pipefail
          NATIVE_DIRECTORY="${RUNNER_TEMP}/rustfs-validation-native-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          cp "${VALIDATION_ROOT}/tool-run.json" "${NATIVE_DIRECTORY}/tool-run.json"
          python3 -B auto-testing/scripts/validation_heal/incarnation_native.py \
            --directory "${NATIVE_DIRECTORY}" --candidate "${VALIDATION_ROOT}/candidate.json" \
            --testing-commit "${{ inputs.auto_testing_sha }}" \
            > "${VALIDATION_ROOT}/native-incarnation-manifest.json"
          printf 'VALIDATION_HEAL_NATIVE_DIRECTORY=%s\n' "${NATIVE_DIRECTORY}" >> "${GITHUB_ENV}"

      - name: Verify G01 exact-source native commit and cleanup evidence
        if: ${{ steps.race_native.outputs.required == 'true' }}
        env:
          AUTO_TESTING_SHA: ${{ inputs.auto_testing_sha }}
        run: |
          set -euo pipefail
          NATIVE_DIRECTORY="${RUNNER_TEMP}/rustfs-validation-native-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          cp "${VALIDATION_ROOT}/tool-run.json" "${NATIVE_DIRECTORY}/tool-run.json"
          python3 -B auto-testing/scripts/validation_heal/race_native_evidence.py \
            --directory "${NATIVE_DIRECTORY}" --candidate "${VALIDATION_ROOT}/candidate.json" \
            --testing-commit "${AUTO_TESTING_SHA}" --case-id heal.race-unversioned-overwrite \
            > "${VALIDATION_ROOT}/native-race-manifest.json"
          printf 'VALIDATION_HEAL_NATIVE_DIRECTORY=%s\n' "${NATIVE_DIRECTORY}" >> "${GITHUB_ENV}"

      - name: Download pinned manager persistence and incarnation evidence
        if: ${{ inputs.validation_case == 'heal.checkpoint-and-mrf-corruption' || inputs.validation_case == 'heal.bucket-incarnation-recreation' || inputs.validation_case == 'heal.outcome-counters-and-error-truth' }}
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          github-token: ${{ github.token }}
          run-id: ${{ inputs.validation_tools_run_id }}
          name: rustfs-validation-manager-native-${{ inputs.validation_tools_run_id }}-${{ inputs.validation_tools_run_attempt }}
          path: ${{ runner.temp }}/rustfs-validation-manager-native-${{ github.run_id }}-${{ github.run_attempt }}

      - name: Verify exact manager native prerequisites before fleet mutation
        if: ${{ inputs.validation_case == 'heal.checkpoint-and-mrf-corruption' || inputs.validation_case == 'heal.bucket-incarnation-recreation' || inputs.validation_case == 'heal.outcome-counters-and-error-truth' }}
        env:
          VALIDATION_CASE: ${{ inputs.validation_case }}
        run: |
          set -euo pipefail
          MANAGER_DIRECTORY="${RUNNER_TEMP}/rustfs-validation-manager-native-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          cp "${VALIDATION_ROOT}/tool-run.json" "${MANAGER_DIRECTORY}/tool-run.json"
          python3 -B auto-testing/scripts/validation_heal/manager_fixture.py \
            --directory "${MANAGER_DIRECTORY}" --candidate "${VALIDATION_ROOT}/candidate.json" \
            --case-id "${VALIDATION_CASE}" > "${VALIDATION_ROOT}/manager-prerequisite-manifest.json"
          printf 'VALIDATION_HEAL_MANAGER_DIRECTORY=%s\n' "${MANAGER_DIRECTORY}" >> "${GITHUB_ENV}"

      - name: Download pinned C10 shared-reference encoder
        if: ${{ inputs.validation_case == 'heal.dangling-and-orphan-safety' }}
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          github-token: ${{ github.token }}
          run-id: ${{ inputs.validation_tools_run_id }}
          name: rustfs-validation-shared-${{ inputs.validation_tools_run_id }}-${{ inputs.validation_tools_run_attempt }}
          path: ${{ runner.temp }}/rustfs-validation-shared-${{ github.run_id }}-${{ github.run_attempt }}

      - name: Verify C10 exact-source codec and original tests
        if: ${{ inputs.validation_case == 'heal.dangling-and-orphan-safety' }}
        run: |
          set -euo pipefail
          SHARED_DIRECTORY="${RUNNER_TEMP}/rustfs-validation-shared-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          cp "${VALIDATION_ROOT}/tool-run.json" "${SHARED_DIRECTORY}/tool-run.json"
          python3 -B auto-testing/scripts/validation_heal/shared_fixture.py \
            --directory "${SHARED_DIRECTORY}" --candidate "${VALIDATION_ROOT}/candidate.json" \
            > "${VALIDATION_ROOT}/shared-fixture-manifest.json"
          printf 'VALIDATION_HEAL_SHARED_DIRECTORY=%s\n' "${SHARED_DIRECTORY}" >> "${GITHUB_ENV}"

      - name: Run selected canonical validation case
        if: ${{ !inputs.validation_tools_only && inputs.validation_cleanup_run_id == '' && inputs.validation_case != 'environment.inspect' }}
        env:
          VALIDATION_CASE: ${{ inputs.validation_case }}
          AUTO_TESTING_SHA: ${{ inputs.auto_testing_sha }}
        run: |
          set -euo pipefail
          test "$(git -C auto-testing rev-parse HEAD)" = "${AUTO_TESTING_SHA}"
          ./auto-testing/scripts/run_validation_case.sh \
            "${VALIDATION_CASE}" "${VALIDATION_ROOT}/candidate.json" \
            "${AUTO_TESTING_SHA}" "${VALIDATION_ROOT}/run"

      - name: Inspect current Heal fleet resources without mutation
        if: ${{ !inputs.validation_tools_only && inputs.validation_case == 'environment.inspect' }}
        env:
          AUTO_TESTING_SHA: ${{ inputs.auto_testing_sha }}
        run: |
          set -euo pipefail
          test "$(git -C auto-testing rev-parse HEAD)" = "${AUTO_TESTING_SHA}"
          python3 -B auto-testing/scripts/validation_heal/environment.py \
            --candidate "${VALIDATION_ROOT}/candidate.json" \
            --testing-commit "${AUTO_TESTING_SHA}" --evidence "${VALIDATION_ROOT}/environment"

      - name: Audit and finalize retained validation environment
        if: ${{ inputs.validation_cleanup_run_id != '' }}
        env:
          GH_TOKEN: ${{ github.token }}
          FAILED_RUN_ID: ${{ inputs.validation_cleanup_run_id }}
          AUTO_TESTING_SHA: ${{ inputs.auto_testing_sha }}
        run: |
          set -euo pipefail
          test "$(git -C auto-testing rev-parse HEAD)" = "${AUTO_TESTING_SHA}"
          gh run view "${FAILED_RUN_ID}" --repo "${GITHUB_REPOSITORY}" \
            --json status,conclusion,headBranch,workflowName > "${VALIDATION_ROOT}/failed-run.json"
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path
          run = json.loads((Path(os.environ["VALIDATION_ROOT"]) / "failed-run.json").read_text())
          if (run["status"] != "completed" or run["conclusion"] not in {"failure", "cancelled"}
              or run["workflowName"] != "RustFS Functional Chain" or run["headBranch"] != os.environ["GITHUB_REF_NAME"]):
              raise ValueError("cleanup source must be a completed failed or cancelled Functional Chain run")
          PY
          gh run download "${FAILED_RUN_ID}" --repo "${GITHUB_REPOSITORY}" \
            --pattern "rustfs-validation-${FAILED_RUN_ID}-*" --dir "${VALIDATION_ROOT}/failed-artifact"
          python3 -B auto-testing/scripts/validation_heal/recover_environment.py \
            --failed-run-id "${FAILED_RUN_ID}" --artifact "${VALIDATION_ROOT}/failed-artifact" \
            --candidate "${VALIDATION_ROOT}/candidate.json" --evidence "${VALIDATION_ROOT}/recovery"

      - name: Show validation report
        if: ${{ always() }}
        run: |
          if [ -f "${VALIDATION_ROOT}/run/report.md" ]; then
            cat "${VALIDATION_ROOT}/run/report.md" >> "${GITHUB_STEP_SUMMARY}"
          fi

      - name: Upload validation evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: rustfs-validation-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/rustfs-validation-${{ github.run_id }}-${{ github.run_attempt }}
          if-no-files-found: error

  validation-tools:
    needs: [validation]
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.validation_package_sha == '' && inputs.validation_tools_only }}
    uses: ./.github/workflows/rustfs-validation-tools.yml
    with:
      candidate_sha: ${{ needs.validation.outputs.source_sha }}
      auto_testing_sha: ${{ inputs.auto_testing_sha }}
      build_native_heal: ${{ inputs.validation_native_tools }}
      build_shared_heal: ${{ inputs.validation_shared_tools }}
      build_manager_native: ${{ inputs.validation_manager_tools }}
    secrets: inherit

  upgrade:
    needs: [prepare]
    if: ${{ always() && needs.prepare.result == 'success' }}
    uses: ./.github/workflows/rustfs-upgrade-test.yml
    with:
      chain_manifest: ${{ needs.prepare.outputs.manifest }}
    secrets: inherit

  s3:
    needs: [prepare, upgrade]
    if: ${{ always() && needs.prepare.result == 'success' }}
    uses: ./.github/workflows/rustfs-s3-compat-test.yml
    with:
      chain_manifest: ${{ needs.prepare.outputs.manifest }}
    secrets: inherit

  kms:
    needs: [prepare, s3]
    if: ${{ always() && needs.prepare.result == 'success' }}
    uses: ./.github/workflows/rustfs-kms-test.yml
    with:
      chain_manifest: ${{ needs.prepare.outputs.manifest }}
    secrets: inherit

  tier:
    needs: [prepare, kms]
    if: ${{ always() && needs.prepare.result == 'success' }}
    uses: ./.github/workflows/rustfs-tier-test.yml
    with:
      chain_manifest: ${{ needs.prepare.outputs.manifest }}
    secrets: inherit

  storage:
    needs: [prepare, tier]
    if: ${{ always() && needs.prepare.result == 'success' }}
    uses: ./.github/workflows/rustfs-storage-test.yml
    with:
      chain_manifest: ${{ needs.prepare.outputs.manifest }}
    secrets: inherit

  heal:
    needs: [prepare, storage]
    if: ${{ always() && needs.prepare.result == 'success' }}
    uses: ./.github/workflows/rustfs-heal-test.yml
    with:
      chain_manifest: ${{ needs.prepare.outputs.manifest }}
    secrets: inherit

  pool:
    needs: [prepare, heal]
    if: ${{ always() && needs.prepare.result == 'success' }}
    uses: ./.github/workflows/rustfs-pool-expand-test.yml
    with:
      chain_manifest: ${{ needs.prepare.outputs.manifest }}
    secrets: inherit

  security:
    needs: [prepare, pool]
    if: ${{ always() && needs.prepare.result == 'success' }}
    uses: ./.github/workflows/rustfs-security-test.yml
    with:
      chain_manifest: ${{ needs.prepare.outputs.manifest }}
    secrets: inherit

  replication:
    needs: [prepare, security]
    if: ${{ always() && needs.prepare.result == 'success' }}
    uses: ./.github/workflows/rustfs-replication-test.yml
    with:
      chain_manifest: ${{ needs.prepare.outputs.manifest }}
    secrets: inherit

  fault-tolerance:
    needs: [prepare, replication]
    if: ${{ always() && needs.prepare.result == 'success' }}
    uses: ./.github/workflows/rustfs-fault-tolerance-test.yml
    with:
      chain_manifest: ${{ needs.prepare.outputs.manifest }}
    secrets: inherit

  table:
    needs: [prepare, fault-tolerance]
    if: ${{ always() && needs.prepare.result == 'success' }}
    uses: ./.github/workflows/rustfs-table-test.yml
    with:
      chain_manifest: ${{ needs.prepare.outputs.manifest }}
    secrets: inherit

  performance:
    needs: [prepare, table]
    if: ${{ always() && needs.prepare.result == 'success' && needs.prepare.outputs.performance_ready == 'online' }}
    uses: ./.github/workflows/rustfs-performance-test.yml
    with:
      chain_manifest: ${{ needs.prepare.outputs.manifest }}
    secrets: inherit

  complete-chain:
    needs: [prepare, upgrade, s3, kms, tier, storage, heal, pool, security, replication, fault-tolerance, table, performance]
    if: ${{ always() && needs.prepare.result != 'skipped' }}
    runs-on: smoke-testing
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@f548e57e544e1ff5a4c46bf1e1b8685f8e4a348a # v7
        with:
          persist-credentials: false
      - name: Download suite evidence
        id: download
        continue-on-error: true
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: functional-chain-*-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/chain-evidence
          merge-multiple: true
      - name: Summarize every suite including failures and missing evidence
        if: always()
        env:
          CHAIN_MANIFEST: ${{ needs.prepare.outputs.manifest }}
          CHAIN_NEEDS: ${{ toJSON(needs) }}
        run: >-
          python3 scripts/functional_chain_evidence.py summarize
          --directory "${RUNNER_TEMP}/chain-evidence"
          --output "${RUNNER_TEMP}/chain-report.json"
      - name: Retain chain report regardless of test verdict
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: functional-chain-report-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/chain-report.json
            ${{ runner.temp }}/chain-report.md
          if-no-files-found: error
      - name: Verify every required suite
        if: always()
        env:
          CHAIN_MANIFEST: ${{ needs.prepare.outputs.manifest }}
          CHAIN_NEEDS: ${{ toJSON(needs) }}
        run: >-
          python3 scripts/functional_chain_evidence.py aggregate
          --allow-skipped "${{ needs.prepare.outputs.performance_ready == 'online' && '' || 'performance' }}"
          --directory "${RUNNER_TEMP}/chain-evidence"
          --output "${RUNNER_TEMP}/chain-complete.json"
      - name: Upload complete-chain evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: functional-chain-complete-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/chain-complete.json
          if-no-files-found: error
