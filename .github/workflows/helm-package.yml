name: Publish helm chart to artifacthub

on:
  workflow_run:
    workflows: [ "Build and Release" ]
    types: [ completed ]
  workflow_dispatch:
    inputs:
      version:
        description: "Release version to publish, e.g. 1.0.0-beta.1 or v1.0.0-beta.1"
        required: true
        default: "1.0.0-beta.1"
        type: string

permissions:
  contents: read

jobs:
  # Consume the same trusted release certification as every other publication
  # exit and verify the image promotion record of the Docker workflow. The
  # chart wraps no binary of its own, so it may only reference an image whose
  # platform verification already passed; it must not inherit an unverified
  # package's conclusion. A run without that evidence fails closed here and
  # never reaches the chart repository.
  release-certification:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      actions: read
    outputs:
      version: ${{ steps.version.outputs.raw_tag }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@f548e57e544e1ff5a4c46bf1e1b8685f8e4a348a # v7
        with:
          persist-credentials: false

      - name: Normalize release version
        id: version
        env:
          RAW_INPUT: ${{ github.event.inputs.version }}
          RAW_BRANCH: ${{ github.event.workflow_run.head_branch }}
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            RAW="$RAW_INPUT"
          else
            RAW="$RAW_BRANCH"
          fi
          case "$RAW" in
            refs/tags/*) RAW_TAG="${RAW#refs/tags/}" ;;
            *) RAW_TAG="$RAW" ;;
          esac
          echo "raw_tag=$RAW_TAG" >> "$GITHUB_OUTPUT"

      - name: Download and verify release certification and image record
        env:
          GH_TOKEN: ${{ secrets.RELEASE_VALIDATION_TOKEN || github.token }}
          TRIGGERING_RUN_ID: ${{ github.event.workflow_run.id }}
          RAW_TAG: ${{ steps.version.outputs.raw_tag }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p certification image-record

          build_run="$TRIGGERING_RUN_ID"
          if [[ -z "$build_run" ]]; then
            build_run="$(gh api --method GET \
              "repos/${GITHUB_REPOSITORY}/actions/workflows/build.yml/runs" \
              -f branch="$RAW_TAG" -f status=success -F per_page=1 \
              --jq '.workflow_runs[0].id // empty' || true)"
          fi
          if [[ -z "$build_run" ]]; then
            echo "No certified Build and Release run found for ${RAW_TAG}; failing closed" >&2
            exit 1
          fi
          if ! gh run download "$build_run" -n release-certification -D certification; then
            echo "Build run ${build_run} published no release-certification artifact; failing closed" >&2
            exit 1
          fi
          python3 scripts/release/release_gate.py verify-promotion \
            --plan .config/release-validation-plan.json \
            --candidate certification/candidate.json \
            --summary certification/release-gate-output \
            --artifact-sha256 "$(jq -r '.deliverables[0].sha256' certification/candidate.json)" \
            --artifact-name "$(jq -r '.deliverables[0].name' certification/candidate.json)"

          docker_run="$(gh api --method GET \
            "repos/${GITHUB_REPOSITORY}/actions/workflows/docker.yml/runs" \
            -f branch="$RAW_TAG" -f status=success -F per_page=1 \
            --jq '.workflow_runs[0].id // empty' || true)"
          if [[ -z "$docker_run" ]] || ! gh run download "$docker_run" -n image-promotion-record -D image-record; then
            echo "No image promotion record for ${RAW_TAG}; a chart may not wrap an unverified image" >&2
            exit 1
          fi
          candidate_sha="$(python3 -c "import json,hashlib,sys; sys.path.insert(0,'scripts/release'); import release_gate; print(release_gate.canonical_sha256(json.load(open('certification/candidate.json'))))")"
          record_sha="$(jq -r '.candidate_sha256 // empty' image-record/image-promotion-record.json)"
          if [[ "$record_sha" != "$candidate_sha" ]]; then
            echo "Image promotion record does not belong to this certification" >&2
            exit 1
          fi
          overlap="$(jq -r --slurpfile candidate certification/candidate.json \
            '[.binary_sha256s[]] - ($candidate[0].deliverables | map(.binary_sha256)) | length' \
            image-record/image-promotion-record.json)"
          if [[ "$overlap" -ne 0 ]]; then
            echo "Image promotion record carries binary digests outside the certification" >&2
            exit 1
          fi

  build-helm-package:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: [ release-certification ]
    if: |
      (github.event_name == 'workflow_dispatch' && !contains(github.event.inputs.version, '-preview')) ||
      (
        github.event.workflow_run.conclusion == 'success' &&
        github.event.workflow_run.event == 'push' &&
        contains(github.event.workflow_run.head_branch, '.') &&
        !contains(github.event.workflow_run.head_branch, '-preview')
      )

    outputs:
      raw_tag: ${{ steps.version.outputs.raw_tag }}
      app_version: ${{ steps.version.outputs.app_version }}
      chart_version: ${{ steps.version.outputs.chart_version }}

    steps:
      - name: Checkout release source
        uses: actions/checkout@f548e57e544e1ff5a4c46bf1e1b8685f8e4a348a # v7
        with:
          ref: ${{ github.event.workflow_run.head_sha || (startsWith(inputs.version, 'refs/tags/') && inputs.version || format('refs/tags/{0}', inputs.version)) }}
          persist-credentials: false

      # Both inputs reach the shell through env rather than `${{ }}`
      # interpolation. A git ref name may contain `$(...)` — anything without a
      # space is a legal tag — and interpolation pastes it into the script
      # verbatim, where bash would run it. Reading "$RAW_INPUT" instead makes it
      # data.
      - name: Normalize release version
        id: version
        env:
          RAW_INPUT: ${{ github.event.inputs.version }}
          RAW_BRANCH: ${{ github.event.workflow_run.head_branch }}
        run: |
          set -eux

          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            RAW="$RAW_INPUT"
          else
            RAW="$RAW_BRANCH"
          fi

          case "$RAW" in
            refs/tags/*)
              RAW_TAG="${RAW#refs/tags/}"
              ;;
            *)
              RAW_TAG="$RAW"
              ;;
          esac

          ./scripts/helm_chart_version.sh "$RAW_TAG"

      # Docker and Helm share the binary-build trigger. Do not publish a chart
      # until the image selected by its default appVersion is pullable.
      - name: Wait for release image
        timeout-minutes: 20
        env:
          APP_VERSION: ${{ steps.version.outputs.app_version }}
        run: |
          set -euo pipefail
          if [[ ! "$APP_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]] ||
             [[ "$APP_VERSION" == *-preview* ]]; then
            echo "Invalid deliverable image version: $APP_VERSION" >&2
            exit 1
          fi

          for attempt in {1..60}; do
            if token=$(curl --fail --silent --show-error --connect-timeout 10 --max-time 20 \
              'https://auth.docker.io/token?service=registry.docker.io&scope=repository:rustfs/rustfs:pull' \
              | jq -er '.token // empty') &&
              curl --fail --silent --show-error --head --connect-timeout 10 --max-time 20 \
                --header "Authorization: Bearer $token" \
                --header 'Accept: application/vnd.oci.image.index.v1+json, application/vnd.docker.distribution.manifest.list.v2+json' \
                "https://registry-1.docker.io/v2/rustfs/rustfs/manifests/$APP_VERSION" > /dev/null; then
              echo "Release image is available: rustfs/rustfs:$APP_VERSION"
              exit 0
            fi
            echo "Waiting for rustfs/rustfs:$APP_VERSION ($attempt/60)"
            if (( attempt < 60 )); then
              sleep 15
            fi
          done

          echo "Release image is unavailable; refusing to publish Helm chart" >&2
          exit 1

      - name: Replace chart version and app version
        env:
          CHART_VERSION: ${{ steps.version.outputs.chart_version }}
          APP_VERSION: ${{ steps.version.outputs.app_version }}
        run: |
          set -eux
          sed -i -E "s/^version:.*/version: \"${CHART_VERSION}\"/" helm/rustfs/Chart.yaml
          sed -i -E "s/^appVersion:.*/appVersion: \"${APP_VERSION}\"/" helm/rustfs/Chart.yaml

      - name: Set up Helm
        uses: azure/setup-helm@b9e51907a09c216f16ebe8536097933489208112 # v4.3.0

      - name: Install yq
        run: |
          set -euo pipefail
          yq_version="4.54.1"
          yq_sha256="8e34fc298390875de416e6a4afcb8cabeceb25d9aa8506c1a2f9353cf702ea5f"
          tools_dir="$RUNNER_TEMP/rustfs-helm-tools"
          mkdir -p "$tools_dir"
          curl --fail --silent --show-error --location --retry 3 \
            "https://github.com/mikefarah/yq/releases/download/v${yq_version}/yq_linux_amd64" \
            --output "$tools_dir/yq"
          printf '%s  %s\n' "$yq_sha256" "$tools_dir/yq" | sha256sum --check -
          chmod +x "$tools_dir/yq"
          echo "$tools_dir" >> "$GITHUB_PATH"
          "$tools_dir/yq" --version

      - name: Test Helm Chart Templates
        run: ./scripts/test_helm_templates.sh

      - name: Package Helm Chart
        run: |
          set -eux
          cp helm/README.md helm/rustfs/
          helm package ./helm/rustfs \
            --destination helm/rustfs/ \
            --version "${{ steps.version.outputs.chart_version }}"

      - name: Upload helm package as artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: helm-package
          path: |
            helm/rustfs/*.tgz
            helm/rustfs/README.md
          retention-days: 1

  publish-helm-package:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: [ build-helm-package ]
    if: needs.build-helm-package.result == 'success'

    steps:
      - name: Checkout helm package repo
        uses: actions/checkout@f548e57e544e1ff5a4c46bf1e1b8685f8e4a348a # v7
        with:
          # persist-credentials-exempt: this checkout's token IS the push credential —
          # the job git-pushes to rustfs/helm below. Clearing it breaks chart publishing.
          repository: rustfs/helm
          token: ${{ secrets.RUSTFS_HELM_PACKAGE }}

      - name: Download helm package
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: helm-package
          path: ./

      - name: Set up helm
        uses: azure/setup-helm@b9e51907a09c216f16ebe8536097933489208112 # v4.3.0

      - name: Generate index
        run: helm repo index . --url https://charts.rustfs.com

      # app_version is derived from the triggering tag name, and this job holds
      # the cross-repository push token with rustfs/helm already checked out —
      # the worst place in the repo to paste an attacker-influenced string into
      # a shell line. Passed through env so bash treats it as data.
      - name: Push helm package and index file
        env:
          GIT_USERNAME: ${{ secrets.USERNAME }}
          GIT_EMAIL: ${{ secrets.EMAIL_ADDRESS }}
          APP_VERSION: ${{ needs.build-helm-package.outputs.app_version }}
        run: |
          set -eux
          git config --global user.name "${GIT_USERNAME}"
          git config --global user.email "${GIT_EMAIL}"
          git add .
          git commit -m "Update rustfs helm package with ${APP_VERSION}." || echo "No changes to commit"
          git push origin main
