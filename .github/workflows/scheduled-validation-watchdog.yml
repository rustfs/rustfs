name: Scheduled Validation Watchdog

on:
  workflow_run:
    # The registry filters this broad subscription; names are not duplicated here.
    workflows: ["*"]
    types: [completed]

permissions:
  contents: read

jobs:
  alert-on-incomplete-run:
    name: Alert on incomplete scheduled run
    if: github.repository == 'rustfs/rustfs'
    # Stay on GitHub-hosted runners: this monitor must keep running when the
    # self-hosted sm-standard-* pool is down, which is exactly when the
    # scheduled validations it watches stall.
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      actions: read
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@f548e57e544e1ff5a4c46bf1e1b8685f8e4a348a # v7
        with:
          persist-credentials: false
      - name: Select expected completion from registry
        id: registry
        run: python3 scripts/validation_registry.py watchdog
      - name: Open or update incomplete-run issue
        if: steps.registry.outputs.selected == 'true'
        uses: ./.github/actions/schedule-failure-issue
        with:
          github-token: ${{ secrets.BACKLOG_ISSUE_TOKEN }}
          workflow-name: ${{ github.event.workflow_run.name }}
          source-run-id: ${{ github.event.workflow_run.id }}
          source-run-attempt: ${{ github.event.workflow_run.run_attempt }}
          source-event: ${{ github.event.workflow_run.event }}
          source-ref-name: ${{ github.event.workflow_run.head_branch }}
          source-sha: ${{ github.event.workflow_run.head_sha }}
