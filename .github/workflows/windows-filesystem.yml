name: Heal Combined Observation UUID Preflight

on:
  workflow_dispatch:
    inputs:
      expected_head:
        description: Full SHA of this workflow commit
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: heal-combined-observation-uuid-${{ github.ref }}
  cancel-in-progress: false

# This scoped run does not prove complete CI, final integration, distributed G,
# MRF behavior, or resolution of the observed active-owner race.
# The selected ordinary cancellation tests visit notice cleanup with an empty
# registry; they do not create MRF intents or exercise MRF responsibility release.
jobs:
  scoped:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    strategy:
      fail-fast: false
      matrix:
        scope: [contracts-standalone, production, contracts, heal, scanner]
    env:
      CARGO_TERM_COLOR: never
      CARGO_BUILD_JOBS: '2'
      CARGO_INCREMENTAL: '0'
      CARGO_PROFILE_DEV_DEBUG: '0'
      CARGO_PROFILE_TEST_DEBUG: '0'
      RUST_BACKTRACE: '1'
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'
      NO_PROXY: 127.0.0.1,localhost
    steps:
      - name: Checkout candidate
        uses: actions/checkout@f548e57e544e1ff5a4c46bf1e1b8685f8e4a348a # v7
        with:
          fetch-depth: 6
          persist-credentials: false

      - name: Verify candidate snapshot
        shell: bash
        env:
          EXPECTED_HEAD: ${{ inputs.expected_head }}
        run: |
          set -euo pipefail
          head=$(git rev-parse HEAD)
          source=$(git rev-parse '8605f3d3d183e2d98a4b31fe87d39f8439d1b0f4^{commit}')
          parent=$(git rev-parse "${source}^")
          base=$(git rev-parse "${source}~3")
          tree=$(git rev-parse "${source}^{tree}")
          source_diff=$(git diff --full-index --binary "$parent" "$source" | sha256sum | cut -d' ' -f1)
          combined_diff=$(git diff --full-index --binary "$base" "$source" | sha256sum | cut -d' ' -f1)
          workflow_files=$(git diff --name-only "$source" "$head")
          printf 'head=%s source=%s parent=%s base=%s tree=%s source_diff=%s combined_diff=%s workflow_files=%s\n' \
            "$head" "$source" "$parent" "$base" "$tree" "$source_diff" "$combined_diff" "$workflow_files"
          [[ "$EXPECTED_HEAD" =~ ^[0-9a-f]{40}$ ]]
          [[ "$head" == "$EXPECTED_HEAD" && "$head" == "$GITHUB_SHA" ]]
          git merge-base --is-ancestor "$source" "$head"
          [[ "$source" == 8605f3d3d183e2d98a4b31fe87d39f8439d1b0f4 ]]
          [[ "$parent" == 6e6777c6fde24bcdbace8b8cea784f579aefec3e ]]
          [[ "$base" == 7a3bf8cdbd781116a0970585b995ade668c0e662 ]]
          [[ "$tree" == ebca0f1f6ee3a947f944a710f0e1967a676f976a ]]
          [[ "$source_diff" == c44a7ecd99ccf98f5e39af1301d1fbb4c5f7177cc5e3d006b607ebf52a5c4b4c ]]
          [[ "$combined_diff" == 712abc9aefac5ea9d880d67c96704a8481b2830aa899bf952cbd7e8e1b6c501d ]]
          [[ "$workflow_files" == .github/workflows/windows-filesystem.yml ]]
          [[ -z "$(git status --porcelain)" ]]

      - name: Setup Rust
        uses: ./.github/actions/setup
        with:
          rust-version: stable
          cache-shared-key: heal-owner-observation-uuid-${{ matrix.scope }}-hosted
          cache-save-if: 'false'
          install-build-packaging-tools: 'false'
          install-test-tools: 'false'

      - name: Install standalone Clippy
        if: ${{ matrix.scope == 'contracts-standalone' }}
        shell: bash
        run: rustup component add clippy --toolchain stable

      - name: Record stable toolchain versions
        shell: bash
        env:
          LOG_DIR: ${{ runner.temp }}/heal-owner-observation-${{ matrix.scope }}
        run: |
          set -euo pipefail
          [[ ! -e "$LOG_DIR" ]]
          mkdir "$LOG_DIR"
          rustc --version --verbose | tee "$LOG_DIR/rustc-version.log"
          cargo --version --verbose | tee "$LOG_DIR/cargo-version.log"
          toolchain=$(rustup show active-toolchain)
          printf '%s\n' "$toolchain" | tee "$LOG_DIR/rustup-version.log"
          [[ "$toolchain" == stable-* ]]

      # These commands run in their own job without selecting other workspace packages.
      - name: Check and lint contracts standalone
        if: ${{ matrix.scope == 'contracts-standalone' }}
        shell: bash
        env:
          LOG_DIR: ${{ runner.temp }}/heal-owner-observation-${{ matrix.scope }}
        run: |
          set -euo pipefail
          run_check() {
            local label="$1"
            shift
            local available status
            df -h . | tee -a "$LOG_DIR/disk.log"
            available=$(df -Pk . | awk 'NR == 2 {print $4}')
            [[ "$available" =~ ^[0-9]+$ ]]
            if (( available < 4194304 )); then
              printf 'not_started: insufficient disk before %s\n' "$label" | tee -a "$LOG_DIR/disk.log"
              return 1
            fi
            set +e
            "$@" >"$LOG_DIR/$label.log" 2>&1
            status=$?
            set -e
            printf '%s\n' "$status" >"$LOG_DIR/$label.exit"
            cat "$LOG_DIR/$label.log"
            return "$status"
          }
          run_check contracts-check cargo check --locked -p rustfs-heal-contracts --lib
          run_check contracts-clippy cargo clippy --locked -p rustfs-heal-contracts --lib -- -D warnings

      - name: Check production libraries
        if: ${{ matrix.scope == 'production' }}
        shell: bash
        env:
          LOG_DIR: ${{ runner.temp }}/heal-owner-observation-${{ matrix.scope }}
        run: |
          set -euo pipefail
          df -h . | tee "$LOG_DIR/disk.log"
          available=$(df -Pk . | awk 'NR == 2 {print $4}')
          [[ "$available" =~ ^[0-9]+$ ]]
          if (( available < 4194304 )); then
            echo 'not_started: insufficient disk before cargo check' | tee -a "$LOG_DIR/disk.log"
            exit 1
          fi
          set +e
          cargo check --locked -p rustfs-heal-contracts -p rustfs-heal -p rustfs-scanner --lib >"$LOG_DIR/production.log" 2>&1
          status=$?
          set -e
          printf '%s\n' "$status" >"$LOG_DIR/production.exit"
          cat "$LOG_DIR/production.log"
          exit "$status"

      - name: Run selected exact unit tests
        if: ${{ matrix.scope == 'contracts' || matrix.scope == 'heal' || matrix.scope == 'scanner' }}
        shell: bash
        env:
          SCOPE: ${{ matrix.scope }}
          LOG_DIR: ${{ runner.temp }}/heal-owner-observation-${{ matrix.scope }}
        run: |
          set -euo pipefail
          case "$SCOPE" in
            contracts)
              package=rustfs-heal-contracts
              expected=8
              tests=(
                completion::tests::public_completion_facades_share_receipts_and_preserve_missing_tokens
                completion::tests::legacy_and_observed_subscribers_receive_the_same_completion_in_each_channel_order
                completion::tests::legacy_and_observed_channels_report_lag_independently
                completion::tests::completion_delivery_is_bounded_and_does_not_require_a_consumer
                heal_channel::tests::observed_receipt_falls_back_only_when_no_observed_command_was_accepted
                heal_channel::tests::lost_observed_reply_never_resends_the_request
                heal_channel::tests::fallback_reports_a_typed_error_if_legacy_channel_is_closed
                heal_channel::tests::observed_receipt_keeps_the_owner_token_from_the_processor
              )
              ;;
            heal)
              package=rustfs-heal
              expected=24
              tests=(
                heal::manager::tests::queued_representative::scanner_receipt_tracks_scoped_read_repair_forced_holders
                heal::manager::tests::queued_representative::scanner_receipt_does_not_merge_read_repair_with_a_different_scope_or_version
                heal::manager::tests::queued_representative::scanner_receipt_tracks_queued_owner_after_normal_dequeue
                heal::manager::tests::queued_representative::scanner_receipt_tracks_queued_owner_after_fair_dequeue
                heal::manager::tests::queued_representative::scanner_receipt_keeps_queued_owner_when_a_different_forced_task_runs
                heal::manager::tests::queued_representative::scanner_receipt_reselects_after_the_queued_owner_is_cancelled
                heal::manager::tests::queued_representative::scanner_receipt_reselects_after_multiple_forced_dequeues
                heal::manager::tests::queued_representative::scanner_owner_index_survives_a_single_remaining_holder_and_new_forced_work
                heal::manager::tests::queued_representative::scanner_owner_index_distinguishes_holders_with_the_same_request_id
                heal::manager::tests::queued_representative::scanner_owner_index_tracks_bulk_removal_and_key_release
                heal::manager::tests::queued_representative::scanner_owner_index_tracks_displacement_without_changing_legacy_reselection
                heal::manager::tests::queued_representative::scanner_receipt_rejects_a_missing_or_empty_holder_index
                heal::manager::tests::queued_representative::scanner_and_legacy_owners_keep_their_distinct_reselection_orders
                heal::manager::tests::queued_representative::scanner_owner_index_tracks_a_series_of_forced_holders
                heal::manager::tests::queued_representative::observed_scanner_and_legacy_receipts_pair_their_own_reselected_holders
                heal::manager::tests::queued_representative::observed_same_id_holders_use_the_selected_sequence_not_the_id
                heal::manager::tests::queued_representative::displaced_holder_reselects_the_remaining_id_and_observation_together
                heal::manager::tests::queued_representative::missing_selected_token_or_inconsistent_index_stays_unknown
                heal::manager::tests::queued_observation_tracks_the_holder_sequence_when_ids_repeat
                heal::manager::tests::completion::queued_same_id_replay_is_unknown_but_canonical_merge_retains_owner_identity
                heal::manager::tests::completion::merged_receipt_uses_live_active_or_retrying_owner_identity
                heal::manager::tests::completion::cancelled_or_displaced_queue_owner_does_not_reuse_its_observation_identity
                heal::manager::tests::admin_overlap::admin_force_start_rechecks_request_id_after_cancelling_overlaps
                heal::manager::tests::admin_overlap::forced_id_conflict_preserves_scanner_queued_owner
              )
              ;;
            scanner)
              package=rustfs-scanner
              expected=5
              tests=(
                heal_completion::tests::status_and_pending_metric_count_each_owner_generation
                heal_completion::tests::explicit_rejections_are_reported_not_admitted
                heal_completion::tests::admission_errors_without_decisions_are_reported_unknown
                heal_completion::tests::reused_task_id_keeps_terminal_observations_on_their_owner_generation
                heal_completion::tests::removed_owner_remains_pending_then_expires_unknown_after_id_reuse
              )
              ;;
            *) echo "unexpected scope: $SCOPE" >&2; exit 1 ;;
          esac
          printf '%s\n' "${tests[@]}" >"$LOG_DIR/selected.txt"
          unique=$(printf '%s\n' "${tests[@]}" | sort -u | wc -l | tr -d '[:space:]')
          unique_short=$(printf '%s\n' "${tests[@]}" | sed 's/.*:://' | sort -u | wc -l | tr -d '[:space:]')
          [[ "${#tests[@]}" -eq "$expected" && "$unique" -eq "$expected" && "$unique_short" -eq "$expected" ]]
          validate_test_log() {
            local status="$1" log="$2" name="$3"
            if (( status != 0 )); then return "$status"; fi
            awk -v name="$name" '
              $0 == "running 1 test" { runs++ }
              index($0, "test " name " ...") == 1 {
                suffix = substr($0, length("test " name " ...") + 1)
                if (suffix == "" || suffix ~ /^[[:space:]]/) names++
              }
              /^test result: ok[.] 1 passed; 0 failed; 0 ignored; [0-9]+ measured; [0-9]+ filtered out; finished in / { passed++ }
              END {
                printf "Harness markers: running=%d named=%d passed=%d\n", runs, names, passed
                if (runs != 1 || names != 1 || passed != 1) exit 1
              }
            ' "$log"
          }
          failures=0
          completed=0
          for name in "${tests[@]}"; do
            short="${name##*::}"
            df -h . | tee -a "$LOG_DIR/disk.log"
            available=$(df -Pk . | awk 'NR == 2 {print $4}')
            [[ "$available" =~ ^[0-9]+$ ]]
            if (( available < 4194304 )); then
              printf 'not_started: insufficient disk before %s\n' "$name" | tee -a "$LOG_DIR/disk.log"
              exit 1
            fi
            set +e
            cargo test --locked -p "$package" --lib -- "$name" --exact --test-threads=1 >"$LOG_DIR/$short.log" 2>&1
            status=$?
            set -e
            printf '%s\n' "$status" >"$LOG_DIR/$short.exit"
            cat "$LOG_DIR/$short.log"
            if validate_test_log "$status" "$LOG_DIR/$short.log" "$name" >"$LOG_DIR/$short.validation"; then
              completed=$((completed + 1))
            else
              failures=$((failures + 1))
              if ! grep -Eq '^running [0-9]+ tests?$' "$LOG_DIR/$short.log"; then
                echo "Stopping this scope: test execution did not start for $name" >&2
                break
              fi
            fi
            cat "$LOG_DIR/$short.validation"
          done
          printf 'scope=%s expected=%s passed=%s failed=%s\n' "$SCOPE" "$expected" "$completed" "$failures"
          [[ "$completed" -eq "$expected" && "$failures" -eq 0 ]]

      - name: Upload raw logs and exit codes
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: heal-owner-observation-${{ matrix.scope }}-${{ github.run_id }}
          path: ${{ runner.temp }}/heal-owner-observation-${{ matrix.scope }}/
          retention-days: 7
          if-no-files-found: warn
