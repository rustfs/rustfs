name: Heal Observation Identity Preflight

on:
  workflow_dispatch:
    inputs:
      expected_head:
        description: Full SHA of this workflow commit
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: heal-observation-preflight-${{ github.ref }}
  cancel-in-progress: false

# Scoped evidence only: this does not prove complete CI, final integration, or MRF.
jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    env:
      CARGO_TERM_COLOR: never
      CARGO_BUILD_JOBS: '2'
      CARGO_INCREMENTAL: '0'
      CARGO_PROFILE_DEV_DEBUG: '0'
      CARGO_PROFILE_TEST_DEBUG: '0'
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'
      NO_PROXY: 127.0.0.1,localhost
    steps:
      - name: Checkout candidate
        uses: actions/checkout@f548e57e544e1ff5a4c46bf1e1b8685f8e4a348a # v7
        with:
          fetch-depth: 6
          persist-credentials: false

      - name: Verify candidate snapshot
        shell: bash
        env:
          EXPECTED_HEAD: ${{ inputs.expected_head }}
        run: |
          set -euo pipefail
          head=$(git rev-parse HEAD)
          source=$(git rev-parse '839467a01b122fb84f1e0bea8f305616207ae45c^{commit}')
          base=$(git rev-parse "${source}^")
          tree=$(git rev-parse "${source}^{tree}")
          diff=$(git diff --full-index --binary "$base" "$source" | sha256sum | cut -d' ' -f1)
          workflow_files=$(git diff --name-only "$source" "$head")
          printf 'head=%s source=%s base=%s tree=%s diff=%s workflow_files=%s\n' "$head" "$source" "$base" "$tree" "$diff" "$workflow_files"
          [[ "$EXPECTED_HEAD" =~ ^[0-9a-f]{40}$ ]]
          [[ "$head" == "$EXPECTED_HEAD" && "$head" == "$GITHUB_SHA" ]]
          git merge-base --is-ancestor "$source" "$head"
          [[ "$source" == 839467a01b122fb84f1e0bea8f305616207ae45c ]]
          [[ "$base" == 7a3bf8cdbd781116a0970585b995ade668c0e662 ]]
          [[ "$tree" == 55536349419e0e51c30da08949f08f2408d271d0 ]]
          [[ "$diff" == 2977256f37e375423ab55c9e247601708f70e40df2e07489fe6c6e2588a4ba51 ]]
          [[ "$workflow_files" == .github/workflows/windows-filesystem.yml ]]
          [[ -z "$(git status --porcelain)" ]]

      - name: Setup Rust
        uses: ./.github/actions/setup
        with:
          rust-version: stable
          cache-shared-key: heal-observation-compat-7a3-hosted
          cache-save-if: 'false'
          install-build-packaging-tools: 'false'
          install-test-tools: 'false'

      - name: Check production targets
        shell: bash
        env:
          LOG_DIR: ${{ runner.temp }}/heal-observation-checks
        run: |
          set -euo pipefail
          [[ ! -e "$LOG_DIR" ]]
          mkdir "$LOG_DIR"
          run_check() {
            local label="$1"
            shift
            local available status
            df -h . | tee -a "$LOG_DIR/disk.log"
            available=$(df -Pk . | awk 'NR == 2 {print $4}')
            [[ "$available" =~ ^[0-9]+$ ]]
            if (( available < 4194304 )); then
              printf 'not_started: insufficient disk before %s\n' "$label" | tee -a "$LOG_DIR/disk.log"
              return 1
            fi
            set +e
            "$@" >"$LOG_DIR/$label.log" 2>&1
            status=$?
            set -e
            printf '%s\n' "$status" >"$LOG_DIR/$label.exit"
            cat "$LOG_DIR/$label.log"
            return "$status"
          }
          run_check contracts-heal-scanner cargo check --locked -p rustfs-heal-contracts -p rustfs-heal -p rustfs-scanner --lib
          run_check rustfs cargo check --locked -p rustfs --lib --bin rustfs

      - name: Upload check logs and exit codes
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: heal-observation-checks-${{ github.run_id }}
          path: ${{ runner.temp }}/heal-observation-checks/
          retention-days: 7
          if-no-files-found: warn

  unit-tests:
    needs: checks
    runs-on: ubuntu-latest
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        package: [rustfs-heal-contracts, rustfs-scanner, rustfs-heal]
    env:
      CARGO_TERM_COLOR: never
      CARGO_BUILD_JOBS: '2'
      CARGO_INCREMENTAL: '0'
      CARGO_PROFILE_DEV_DEBUG: '0'
      CARGO_PROFILE_TEST_DEBUG: '0'
      RUST_BACKTRACE: '1'
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'
      NO_PROXY: 127.0.0.1,localhost
    steps:
      - name: Checkout candidate
        uses: actions/checkout@f548e57e544e1ff5a4c46bf1e1b8685f8e4a348a # v7
        with:
          fetch-depth: 6
          persist-credentials: false

      - name: Verify candidate snapshot
        shell: bash
        env:
          EXPECTED_HEAD: ${{ inputs.expected_head }}
        run: |
          set -euo pipefail
          head=$(git rev-parse HEAD)
          source=$(git rev-parse '839467a01b122fb84f1e0bea8f305616207ae45c^{commit}')
          base=$(git rev-parse "${source}^")
          tree=$(git rev-parse "${source}^{tree}")
          diff=$(git diff --full-index --binary "$base" "$source" | sha256sum | cut -d' ' -f1)
          workflow_files=$(git diff --name-only "$source" "$head")
          printf 'head=%s source=%s base=%s tree=%s diff=%s workflow_files=%s\n' "$head" "$source" "$base" "$tree" "$diff" "$workflow_files"
          [[ "$EXPECTED_HEAD" =~ ^[0-9a-f]{40}$ ]]
          [[ "$head" == "$EXPECTED_HEAD" && "$head" == "$GITHUB_SHA" ]]
          git merge-base --is-ancestor "$source" "$head"
          [[ "$source" == 839467a01b122fb84f1e0bea8f305616207ae45c ]]
          [[ "$base" == 7a3bf8cdbd781116a0970585b995ade668c0e662 ]]
          [[ "$tree" == 55536349419e0e51c30da08949f08f2408d271d0 ]]
          [[ "$diff" == 2977256f37e375423ab55c9e247601708f70e40df2e07489fe6c6e2588a4ba51 ]]
          [[ "$workflow_files" == .github/workflows/windows-filesystem.yml ]]
          [[ -z "$(git status --porcelain)" ]]

      - name: Setup Rust
        uses: ./.github/actions/setup
        with:
          rust-version: stable
          cache-shared-key: heal-observation-compat-7a3-hosted
          cache-save-if: 'false'
          install-build-packaging-tools: 'false'
          install-test-tools: 'false'

      - name: Run only the selected unit tests
        shell: bash
        env:
          PACKAGE: ${{ matrix.package }}
          LOG_DIR: ${{ runner.temp }}/heal-observation-tests
        run: |
          set -euo pipefail
          [[ ! -e "$LOG_DIR" ]]
          mkdir "$LOG_DIR"
          case "$PACKAGE" in
            rustfs-heal-contracts)
              expected=8
              tests=(
                completion::tests::public_completion_facades_share_receipts_and_preserve_missing_tokens
                completion::tests::legacy_and_observed_subscribers_receive_the_same_completion_in_each_channel_order
                completion::tests::legacy_and_observed_channels_report_lag_independently
                completion::tests::completion_delivery_is_bounded_and_does_not_require_a_consumer
                heal_channel::tests::observed_receipt_falls_back_only_when_no_observed_command_was_accepted
                heal_channel::tests::lost_observed_reply_never_resends_the_request
                heal_channel::tests::fallback_reports_a_typed_error_if_legacy_channel_is_closed
                heal_channel::tests::observed_receipt_keeps_the_owner_token_from_the_processor
              )
              ;;
            rustfs-scanner)
              expected=5
              tests=(
                heal_completion::tests::status_and_pending_metric_count_each_owner_generation
                heal_completion::tests::explicit_rejections_are_reported_not_admitted
                heal_completion::tests::admission_errors_without_decisions_are_reported_unknown
                heal_completion::tests::reused_task_id_keeps_terminal_observations_on_their_owner_generation
                heal_completion::tests::removed_owner_remains_pending_then_expires_unknown_after_id_reuse
              )
              ;;
            rustfs-heal)
              expected=6
              tests=(
                heal::manager::tests::completion::observation_requires_the_current_task_or_retry_object
                heal::manager::tests::completion::queued_same_id_replay_is_unknown_but_canonical_merge_retains_owner_identity
                heal::manager::tests::completion::merged_receipt_uses_live_active_or_retrying_owner_identity
                heal::manager::tests::queued_observation_tracks_the_holder_sequence_when_ids_repeat
                heal::channel::tests::observed_and_legacy_channels_share_the_real_admission_owner
                heal::manager::tests::root_recovery::root_recovery_replayed_queue_owner_gets_a_fresh_in_process_observation_identity
              )
              ;;
            *) echo "unexpected package: $PACKAGE" >&2; exit 1 ;;
          esac
          printf '%s\n' "${tests[@]}" >"$LOG_DIR/selected.txt"
          unique=$(printf '%s\n' "${tests[@]}" | sort -u | wc -l | tr -d '[:space:]')
          [[ "${#tests[@]}" -eq "$expected" && "$unique" -eq "$expected" ]]
          validate_test_log() {
            local status="$1" log="$2" name="$3"
            if (( status != 0 )); then return "$status"; fi
            awk -v name="$name" '
              $0 == "running 1 test" { runs++ }
              index($0, "test " name " ...") == 1 {
                suffix = substr($0, length("test " name " ...") + 1)
                if (suffix == "" || suffix ~ /^[[:space:]]/) names++
              }
              /^test result: ok[.] 1 passed; 0 failed; 0 ignored; [0-9]+ measured; [0-9]+ filtered out; finished in / { passed++ }
              END {
                printf "Harness markers: running=%d named=%d passed=%d\n", runs, names, passed
                if (runs != 1 || names != 1 || passed != 1) exit 1
              }
            ' "$log"
          }
          failures=0
          completed=0
          for name in "${tests[@]}"; do
            short="${name##*::}"
            df -h . | tee -a "$LOG_DIR/disk.log"
            available=$(df -Pk . | awk 'NR == 2 {print $4}')
            [[ "$available" =~ ^[0-9]+$ ]]
            if (( available < 4194304 )); then
              printf 'not_started: insufficient disk before %s\n' "$name" | tee -a "$LOG_DIR/disk.log"
              exit 1
            fi
            set +e
            cargo test --locked -p "$PACKAGE" --lib -- "$name" --exact --test-threads=1 >"$LOG_DIR/$short.log" 2>&1
            status=$?
            set -e
            printf '%s\n' "$status" >"$LOG_DIR/$short.exit"
            cat "$LOG_DIR/$short.log"
            if validate_test_log "$status" "$LOG_DIR/$short.log" "$name" >"$LOG_DIR/$short.validation"; then
              completed=$((completed + 1))
            else
              failures=$((failures + 1))
              if ! grep -Eq '^running [0-9]+ tests?$' "$LOG_DIR/$short.log"; then
                echo "Stopping this package: test execution did not start for $name" >&2
                break
              fi
            fi
            cat "$LOG_DIR/$short.validation"
          done
          printf 'package=%s expected=%s passed=%s failed=%s\n' "$PACKAGE" "$expected" "$completed" "$failures"
          [[ "$completed" -eq "$expected" && "$failures" -eq 0 ]]

      - name: Upload raw test logs and exit codes
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: heal-observation-${{ matrix.package }}-${{ github.run_id }}
          path: ${{ runner.temp }}/heal-observation-tests/
          retention-days: 7
          if-no-files-found: warn
