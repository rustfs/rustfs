name: Multipart Lock Windows Preflight
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: multipart-lock-windows-${{ github.ref }}
  cancel-in-progress: false
env:
  CARGO_TERM_COLOR: never
  RUST_BACKTRACE: 1
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'
  NO_PROXY: 127.0.0.1,localhost
jobs:
  scoped-tests:
    runs-on: windows-latest
    timeout-minutes: 90
    steps:
      - name: Checkout candidate
        uses: actions/checkout@f548e57e544e1ff5a4c46bf1e1b8685f8e4a348a
        with:
          persist-credentials: false
      - name: Setup Rust
        uses: ./.github/actions/setup
        with:
          rust-version: stable
          cache-shared-key: build-x86_64-pc-windows-msvc
          cache-save-if: 'false'
          install-build-packaging-tools: 'false'
          install-test-tools: 'false'
      - name: Run only the named diagnostic unit tests
        shell: bash
        run: |
          set -euo pipefail
          run_one() {
            local package="$1"
            local test_name="$2"
            cargo test --locked -p "$package" --lib -- --exact "$test_name" --nocapture 2>&1 | tee scanner-proof-test.log
            grep -F 'test result: ok. 1 passed; 0 failed;' scanner-proof-test.log
          }
          run_one rustfs-obs telemetry::local::tests::multipart_timeout_event_does_not_inherit_verbose_span_fields
          run_one rustfs-obs telemetry::local::tests::multipart_timeout_target_keeps_the_existing_error_module_filter
          run_one rustfs-obs telemetry::local::tests::multipart_timeout_root_event_does_not_inherit_otlp_span_fields
          run_one rustfs error::tests::multipart_create_timeout_classifies_only_the_exact_known_resources
          run_one rustfs error::tests::multipart_create_timeout_keeps_nested_and_untrusted_sources_distinct
          run_one rustfs error::tests::multipart_create_timeout_event_is_visible_at_warn_and_does_not_expose_source
          run_one rustfs storage::access::tests::multipart_timeout_observes_only_the_authorized_final_error
          run_one rustfs app::multipart_usecase::tests::create_multipart_observes_the_actual_object_lock_timeout
