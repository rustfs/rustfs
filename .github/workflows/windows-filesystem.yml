# Temporary, manual-only verification of the test-only isolation fixture.
# The exporter is in memory; no OTLP wire serialization is exercised.
name: TLS diagnostic panic isolation classification

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  isolation:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
      CARGO_INCREMENTAL: "0"
      CARGO_BUILD_JOBS: "2"
      CARGO_PROFILE_DEV_DEBUG: "0"
      CARGO_PROFILE_TEST_DEBUG: "0"
      CARGO_TERM_COLOR: never
      RUST_BACKTRACE: "0"
      CARGO_TARGET_DIR: ${{ github.workspace }}/target
      EXPECTED_REVISION: 6ff4ad77aeb87b9cc0821f4f6a9c08a7ffff0991
      EXPECTED_TREE: 9c45286d0c056ec0ae70db09ae6953e1bdda95e6
    steps:
      - name: Checkout fixed source
        id: source
        uses: actions/checkout@f548e57e544e1ff5a4c46bf1e1b8685f8e4a348a # v7
        with:
          ref: 6ff4ad77aeb87b9cc0821f4f6a9c08a7ffff0991
          clean: false
          persist-credentials: false

      - name: Verify source and prepare private output
        id: identity
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_REVISION"
          test "$(git rev-parse 'HEAD^{tree}')" = "$EXPECTED_TREE"
          test -z "$(git status --porcelain=v1 --untracked-files=all)"
          umask 077
          mkdir "$RUNNER_TEMP/tls-async-private"
          mkdir "$RUNNER_TEMP/tls-async-evidence"

      - name: Install system dependencies
        id: dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential pkg-config libssl-dev ripgrep

      - name: Install protoc
        id: protoc
        uses: rustfs/setup-protoc@a3705324d8f9bf5b6c3573fb6cf8ae421db55dd6 # v3.0.1
        with:
          version: "35.1"
          repo-token: ${{ github.token }}

      - name: Install flatc
        id: flatc
        uses: Nugine/setup-flatc@698800de72a96bfb22cf60431dc21a2ff9a7e07b # v1
        with:
          version: "25.12.19"

      - name: Install Rust
        id: rust
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
        with:
          toolchain: stable

      - name: Compile the library test binary
        id: compile
        run: |
          set -euo pipefail
          if ! cargo test --locked -p rustfs-obs --lib --no-run --message-format=json >"$RUNNER_TEMP/tls-async-private/build.jsonl" 2>"$RUNNER_TEMP/tls-async-private/build.log"; then
            echo "The library test binary did not compile; raw output withheld."
            exit 1
          fi

      - name: Run the named panic classification
        id: assertions
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_REVISION"
          test "$(git rev-parse 'HEAD^{tree}')" = "$EXPECTED_TREE"
          test -z "$(git status --porcelain=v1 --untracked-files=all)"
          python3 - <<'PYCODE'
          import hashlib
          import json
          import os
          import subprocess
          import sys
          from pathlib import Path

          sys.excepthook = lambda *_: print('Diagnostic unavailable; raw output withheld.', file=sys.stderr)
          name = 'telemetry::isolation_probe_tests::async_isolation::classify_panic_writer_isolation_without_raw_output'
          allowed_classes = {
              'outer_span_missing', 'writer_not_reached', 'writer_panic_not_caught',
              'dispatcher_not_restored', 'tracing_not_restored', 'trace_not_restored',
              'span_id_not_restored', 'baggage_not_restored', 'outer_json_unknown',
              'stale_isolated_json', 'outer_json_unexpected', 'outer_otel_unexpected',
              'diagnostic_internal_panic', 'clean',
          }
          root = Path(os.environ['RUNNER_TEMP'])
          private = root / 'tls-async-private'
          evidence = root / 'tls-async-evidence'
          build = private / 'build.jsonl'
          if not build.is_file() or build.stat().st_size > 256 * 1024 * 1024:
              raise SystemExit('Build identity unavailable; raw output withheld.')
          binaries = set()
          with build.open(encoding='utf-8') as lines:
              for line in lines:
                  if len(line) > 2 * 1024 * 1024:
                      raise SystemExit('Build identity unavailable; raw output withheld.')
                  value = json.loads(line)
                  if value.get('reason') != 'compiler-artifact':
                      continue
                  target = value.get('target', {})
                  profile = value.get('profile', {})
                  executable = value.get('executable')
                  if (target.get('name') == 'rustfs_obs' and 'lib' in target.get('kind', [])
                          and profile.get('test') is True and isinstance(executable, str)):
                      binaries.add(executable)
          if len(binaries) != 1:
              raise SystemExit('Build identity unavailable; raw output withheld.')
          binary = Path(next(iter(binaries))).resolve(strict=True)
          target_root = Path(os.environ['CARGO_TARGET_DIR']).resolve(strict=True)
          if not binary.is_file() or not binary.is_relative_to(target_root):
              raise SystemExit('Build identity unavailable; raw output withheld.')

          def digest(path):
              hasher = hashlib.sha256()
              with path.open('rb') as handle:
                  for block in iter(lambda: handle.read(1024 * 1024), b''):
                      hasher.update(block)
              return hasher.digest()

          original_digest = digest(binary)
          original_size = binary.stat().st_size
          output = private / 'panic-diagnostic.log'
          command = ['cargo', 'test', '--offline', '--locked', '-p', 'rustfs-obs', '--lib', name,
                     '--', '--exact', '--nocapture', '--color', 'never']
          state = 'available'
          return_code = None
          try:
              with output.open('wb') as handle:
                  completed = subprocess.run(command, stdout=handle, stderr=subprocess.STDOUT, timeout=120, check=False)
              return_code = completed.returncode
          except subprocess.TimeoutExpired:
              state = 'timeout'

          classification = 'missing_or_invalid'
          selected = False
          passed = False
          hook_count = 0
          hook_markers_valid = False
          if state == 'available':
              if not output.is_file():
                  state = 'missing'
              elif output.stat().st_size > 16 * 1024 * 1024:
                  state = 'truncated'
              else:
                  lines = output.read_text(encoding='utf-8', errors='replace').splitlines()
                  selected = lines.count('running 1 test') == 1
                  passed = any(line.startswith('test result: ok. 1 passed; 0 failed;') for line in lines)
                  prefix = 'RUSTFS_PANIC_DIAGNOSTIC='
                  classes = [line[len(prefix):] for line in lines if line.startswith(prefix)]
                  if len(classes) == 1 and classes[0] in allowed_classes:
                      classification = classes[0]
                  hook_prefix = 'RUSTFS_PANIC_HOOK='
                  hooks = [line for line in lines if line.startswith(hook_prefix)]
                  hook_count = min(len(hooks), 3)
                  hook_markers_valid = len(hooks) <= 2 and all(line == hook_prefix + 'redacted' for line in hooks)

          binary_unchanged = binary.is_file() and binary.stat().st_size == original_size and digest(binary) == original_digest
          accepted = (state == 'available' and return_code == 0 and selected and passed
                      and classification == 'clean' and binary_unchanged
                      and hook_markers_valid and hook_count == 1)
          report = {'state': state, 'exit_code': return_code, 'selected': selected, 'passed': passed,
                    'classification': classification, 'binary_unchanged': binary_unchanged,
                    'hook_count': hook_count, 'hook_markers_valid': hook_markers_valid,
                    'expected_cases': 1, 'expectation_met': accepted}
          (evidence / 'results.json').write_text(json.dumps(report, sort_keys=True) + '\n')
          if not accepted:
              raise SystemExit('Diagnostic did not pass; raw output withheld.')
          print('Diagnostic passed.')
          PYCODE
          test "$(git rev-parse HEAD)" = "$EXPECTED_REVISION"
          test "$(git rev-parse 'HEAD^{tree}')" = "$EXPECTED_TREE"
          test -z "$(git status --porcelain=v1 --untracked-files=all)"

      - name: Record stage outcomes
        if: always()
        env:
          SOURCE: ${{ steps.source.outcome }}
          IDENTITY: ${{ steps.identity.outcome }}
          DEPENDENCIES: ${{ steps.dependencies.outcome }}
          PROTOC: ${{ steps.protoc.outcome }}
          FLATC: ${{ steps.flatc.outcome }}
          RUST: ${{ steps.rust.outcome }}
          COMPILE: ${{ steps.compile.outcome }}
          ASSERTIONS: ${{ steps.assertions.outcome }}
        run: |
          umask 077
          mkdir -p "$RUNNER_TEMP/tls-async-evidence"
          python3 - <<'PY'
          import json
          import os
          import sys
          from pathlib import Path

          sys.excepthook = lambda *_: print('Stage evidence unavailable; raw output withheld.', file=sys.stderr)
          names = ('SOURCE', 'IDENTITY', 'DEPENDENCIES', 'PROTOC', 'FLATC', 'RUST', 'COMPILE', 'ASSERTIONS')
          allowed = {'success', 'failure', 'cancelled', 'skipped'}
          stages = {name.lower(): os.environ.get(name) if os.environ.get(name) in allowed else 'missing' for name in names}
          output = Path(os.environ['RUNNER_TEMP'], 'tls-async-evidence', 'stages.json')
          output.write_text(json.dumps(stages, sort_keys=True) + '\n')
          PY

      - name: Upload sanitized evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: tls-async-isolation-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/tls-async-evidence/
          retention-days: 7
          if-no-files-found: error
