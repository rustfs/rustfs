name: Heal scheduler owner regression
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: heal-scheduler-owner-red-${{ github.ref }}
  cancel-in-progress: false
env:
  CARGO_TERM_COLOR: never
  CARGO_INCREMENTAL: '0'
  CARGO_BUILD_JOBS: '1'
  RUST_BACKTRACE: '0'
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'
  NO_PROXY: 127.0.0.1,localhost
jobs:
  scoped-red-test:
    runs-on: ubuntu-latest
    timeout-minutes: 100
    steps:
      - name: Prepare evidence
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/heal-scheduler-owner-red"
          printf 'not-started\n' > "$RUNNER_TEMP/heal-scheduler-owner-red/cargo-exit-code.txt"
      - name: Checkout
        uses: actions/checkout@f548e57e544e1ff5a4c46bf1e1b8685f8e4a348a
        with:
          fetch-depth: 3
          persist-credentials: false
          clean: false
      - name: Verify source snapshot
        shell: bash
        run: |
          set -euo pipefail
          workflow_sha=$(git rev-parse HEAD)
          source_sha=$(git rev-parse HEAD^)
          base_sha=$(git rev-parse HEAD^^)
          source_tree=$(git rev-parse "$source_sha^{tree}")
          source_diff=$(git diff --full-index --binary "$base_sha" "$source_sha" | sha256sum | cut -d' ' -f1)
          source_files=$(git diff --name-only "$base_sha" "$source_sha")
          workflow_files=$(git diff --name-only "$source_sha" "$workflow_sha")
          expected_source_files=$(printf '%s\n' 'crates/heal/src/heal/manager/scheduler.rs' 'crates/heal/src/heal/manager/tests.rs')
          printf 'head=%s source=%s base=%s tree=%s diff=%s\n' "$workflow_sha" "$source_sha" "$base_sha" "$source_tree" "$source_diff" | tee "$RUNNER_TEMP/heal-scheduler-owner-red/source-proof.txt"
          [[ "$workflow_sha" == "$GITHUB_SHA" ]]
          [[ "$source_sha" == '68a35fc82fe46a896e83a760ff08b03c16a8bfc9' ]]
          [[ "$base_sha" == '7a3bf8cdbd781116a0970585b995ade668c0e662' ]]
          [[ "$source_tree" == 'a1a341ff1c1644ed68c727a5f689200c6631f0a8' ]]
          [[ "$source_diff" == 'e0ed22ea4cd54477ee9ed0ffaa6a94a8a5cb7deb39c878de87a0464a282477a6' ]]
          [[ "$source_files" == "$expected_source_files" ]]
          [[ "$workflow_files" == '.github/workflows/windows-filesystem.yml' ]]
          [[ -z "$(git status --porcelain)" ]]
      - name: Install system dependencies
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential pkg-config libssl-dev ripgrep
      - name: Install protoc
        uses: rustfs/setup-protoc@a3705324d8f9bf5b6c3573fb6cf8ae421db55dd6
        with:
          version: '35.1'
          repo-token: ${{ github.token }}
      - name: Install flatc
        uses: Nugine/setup-flatc@698800de72a96bfb22cf60431dc21a2ff9a7e07b
        with:
          version: '25.12.19'
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8
        with:
          toolchain: stable
      - name: Run the named regression
        shell: bash
        timeout-minutes: 75
        run: |
          set -euo pipefail
          df -h .
          test_name=heal::manager::tests::cancelled_worker_does_not_remove_a_same_id_successor
          evidence="$RUNNER_TEMP/heal-scheduler-owner-red"
          log="$evidence/cargo.log"
          set +e
          timeout --signal=TERM --kill-after=30s 70m cargo test --locked -p rustfs-heal --lib -- --exact "$test_name" >"$log" 2>&1
          test_status=$?
          set -e
          printf '%s\n' "$test_status" > "$evidence/cargo-exit-code.txt"
          tail -n 160 "$log"
          if [[ "$test_status" -ne 101 ]]; then
            printf 'Expected test exit 101, received %s\n' "$test_status"
            exit 1
          fi
          grep -Fq -- "Finished \`test\` profile" "$log"
          grep -Fq -- 'Running unittests src/lib.rs ' "$log"
          grep -Fxq -- 'running 1 test' "$log"
          grep -Fxq -- "test $test_name ... FAILED" "$log"
          grep -Fq -- 'same_id_successor admission=Accepted successor_is_active=false' "$log"
          grep -Eq -- "^thread '$test_name' \\([0-9]+\\) panicked at crates/heal/src/heal/manager/tests\\.rs:636:[0-9]+:$" "$log"
          [[ $(grep -Ec "^thread '.*' \\([0-9]+\\) panicked at " "$log") -eq 1 ]]
          grep -Fxq -- 'the old worker must not remove the active successor' "$log"
          grep -Fq -- 'test result: FAILED. 0 passed; 1 failed;' "$log"
          if grep -E '^error(\[E[0-9]+\])?: ' "$log" | grep -Fv 'error: test failed,'; then
            printf 'Unexpected compiler or Cargo error in test output\n'
            exit 1
          fi
          printf 'Confirmed the expected failure of the one selected test\n' | tee "$evidence/classification.txt"
      - name: Preserve test output
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: heal-scheduler-owner-red-${{ github.run_id }}
          path: ${{ runner.temp }}/heal-scheduler-owner-red/
          if-no-files-found: error
