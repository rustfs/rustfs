name: Scanner Group Identity Green Preflight

on:
  workflow_dispatch:
    inputs:
      expected_head:
        description: Full SHA of this workflow commit
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: scanner-group-identity-green-${{ github.ref }}
  cancel-in-progress: false

# Fixed in-memory observation fixtures only. This does not replace full CI,
# distributed G, or validate previously rejected RPC or MRF scenarios.
jobs:
  scoped:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      CARGO_TERM_COLOR: never
      CARGO_BUILD_JOBS: '2'
      CARGO_INCREMENTAL: '0'
      CARGO_PROFILE_DEV_DEBUG: '0'
      CARGO_PROFILE_TEST_DEBUG: '0'
      RUST_BACKTRACE: '0'
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'
      NO_PROXY: 127.0.0.1,localhost
    steps:
      - name: Checkout candidate
        uses: actions/checkout@f548e57e544e1ff5a4c46bf1e1b8685f8e4a348a # v7
        with:
          fetch-depth: 10
          persist-credentials: false

      - name: Verify exact source and test snapshot
        shell: bash
        env:
          EXPECTED_HEAD: ${{ inputs.expected_head }}
          LOG_DIR: ${{ runner.temp }}/scanner-group-identity-green
        run: |
          set -euo pipefail
          [[ ! -e "$LOG_DIR" ]]
          mkdir "$LOG_DIR"
          head=$(git rev-parse HEAD)
          workflow_parent=$(git rev-parse "${head}^")
          source=$(git rev-parse '1f94f5cef40bf95732d665e0bf2cd6e7e37810ae^{commit}')
          parent=$(git rev-parse "${source}^")
          tree=$(git rev-parse "${source}^{tree}")
          parent_tree=$(git rev-parse "${parent}^{tree}")
          test_blob=$(git rev-parse "${source}:crates/scanner/src/heal_completion/tests.rs")
          production_blob=$(git rev-parse "${source}:crates/scanner/src/heal_completion.rs")
          parent_production_blob=$(git rev-parse "${parent}:crates/scanner/src/heal_completion.rs")
          source_diff=$(git diff --full-index --binary "$parent" "$source" | sha256sum | cut -d' ' -f1)
          workflow_diff=$(git diff --full-index --binary "$source" "$head" | sha256sum | cut -d' ' -f1)
          source_files=$(git diff --name-only "$parent" "$source")
          workflow_files=$(git diff --name-only "$source" "$head")
          printf 'expected_head=%s head=%s workflow_parent=%s source=%s parent=%s tree=%s parent_tree=%s test_blob=%s production_blob=%s source_diff=%s workflow_diff=%s\n' \
            "$EXPECTED_HEAD" "$head" "$workflow_parent" "$source" "$parent" "$tree" "$parent_tree" "$test_blob" "$production_blob" "$source_diff" "$workflow_diff" | tee "$LOG_DIR/snapshot.txt"
          printf 'source_files=%s workflow_files=%s\n' "$source_files" "$workflow_files" | tee -a "$LOG_DIR/snapshot.txt"
          [[ "$EXPECTED_HEAD" =~ ^[0-9a-f]{40}$ ]]
          [[ "$head" == "$EXPECTED_HEAD" && "$head" == "$GITHUB_SHA" && "$workflow_parent" == "$source" ]]
          [[ "$source" == 1f94f5cef40bf95732d665e0bf2cd6e7e37810ae ]]
          [[ "$parent" == e2c7624359f013bfe976b17d4c161b7923e27467 ]]
          [[ "$tree" == 5e8eebb7fa8821823cffa5a4b6512fb74b4b9b56 && "$parent_tree" == 61aae16b94b6dcdcb3698050682afe81fbd71dfe ]]
          [[ "$test_blob" == d6eaf77762b3cb00a3da6055ce601915055d51b5 ]]
          [[ "$production_blob" == 23a6ff93622652d1878b6f5ba4e7f4fc5845492d && "$production_blob" == "$parent_production_blob" ]]
          [[ "$source_diff" == ddbc0c4170f0c0fcf86dcb84842cf5367400ae0cc4a31064e8b2dad44c0cf35c ]]
          [[ "$source_files" == crates/scanner/src/heal_completion/tests.rs ]]
          [[ "$workflow_files" == .github/workflows/windows-filesystem.yml ]]
          [[ -z "$(git status --porcelain)" ]]

      - name: Setup Rust
        uses: ./.github/actions/setup
        with:
          rust-version: stable
          cache-shared-key: scanner-group-identity-green-hosted
          cache-save-if: 'false'
          install-build-packaging-tools: 'false'
          install-test-tools: 'false'

      - name: Run fifteen exact passing tests
        shell: bash
        env:
          LOG_DIR: ${{ runner.temp }}/scanner-group-identity-green
        run: |
          set -euo pipefail
          [[ -d "$LOG_DIR" && -f "$LOG_DIR/snapshot.txt" ]]
          rustc --version --verbose | tee "$LOG_DIR/rustc-version.log"
          cargo --version --verbose | tee "$LOG_DIR/cargo-version.log"
          toolchain=$(rustup show active-toolchain)
          printf '%s\n' "$toolchain" | tee "$LOG_DIR/rustup-version.log"
          [[ "$toolchain" == stable-* ]]
          tests=(
            'heal_completion::tests::mixed_candidate_semantics_settle_independently_in_either_order'
            'heal_completion::tests::candidate_group_capacity_is_global_and_released_by_completion'
            'heal_completion::tests::candidate_group_expiry_and_notification_loss_are_independent'
            'heal_completion::tests::candidate_group_expiry_uses_earliest_discovery_not_admission_order'
            'heal_completion::tests::later_candidate_group_also_expires_from_earliest_discovery'
            'heal_completion::tests::candidate_expiry_is_enforced_when_terminal_arrives_between_ticks'
            'heal_completion::tests::expired_candidate_is_unknown_even_if_terminal_was_seen_first'
            'heal_completion::tests::grouped_pending_status_counts_candidates_after_partial_expiry'
            'heal_completion::tests::observation_id_keeps_grouped_owner_generations_separate'
            'heal_completion::tests::scanner_candidate_without_scope_does_not_claim_identity_mismatch'
            'heal_completion::tests::missing_identity_fields_are_unknown_on_either_side'
            'heal_completion::tests::nil_version_is_unknown_on_either_side'
            'heal_completion::tests::nil_incarnation_is_unknown_on_either_side'
            'heal_completion::tests::equivalent_uuid_version_formats_do_not_claim_identity_mismatch'
            'heal_completion::tests::known_identity_conflicts_remain_mismatches_with_other_fields_unknown'
          )
          printf '%s\n' "${tests[@]}" >"$LOG_DIR/selected-tests.txt"
          unique_names=$(printf '%s\n' "${tests[@]}" | sort -u | wc -l | tr -d '[:space:]')
          [[ "${#tests[@]}" -eq 15 && "$unique_names" -eq 15 ]]
          python3 - "$LOG_DIR/selected-tests.txt" <<'PYSEL'
          from pathlib import Path
          import re
          import sys

          source = Path('crates/scanner/src/heal_completion/tests.rs').read_text()
          for name in Path(sys.argv[1]).read_text().splitlines():
              assert name.startswith('heal_completion::tests::'), name
              symbol = name.rsplit('::', 1)[-1]
              assert len(re.findall(rf'#\[test\]\s*fn\s+{re.escape(symbol)}\s*\(', source)) == 1, name
          PYSEL
          validate_control() {
            local status="$1" log="$2" name="$3"
            if (( status != 0 )); then return "$status"; fi
            awk -v name="$name" '
              $0 == "running 1 test" { runs++ }
              index($0, "test " name " ...") == 1 {
                suffix = substr($0, length("test " name " ...") + 1)
                if (suffix == "" || suffix ~ /^[[:space:]]/) names++
              }
              /^test result: ok[.] 1 passed; 0 failed; 0 ignored; [0-9]+ measured; [0-9]+ filtered out; finished in / { passed++ }
              END {
                printf "Control markers: running=%d named=%d passed=%d\n", runs, names, passed
                if (runs != 1 || names != 1 || passed != 1) exit 1
              }
            ' "$log"
          }
          check_disk() {
            local available
            df -h . | tee -a "$LOG_DIR/disk.log"
            available=$(df -Pk . | awk 'NR == 2 {print $4}')
            [[ "$available" =~ ^[0-9]+$ ]]
            if (( available < 4194304 )); then
              echo 'not_started: insufficient disk' | tee -a "$LOG_DIR/disk.log"
              return 1
            fi
          }
          run_one() {
            local name="$1" short status
            short="${name##*::}"
            check_disk
            set +e
            cargo test --locked -p rustfs-scanner --lib -- "$name" --exact --test-threads=1 >"$LOG_DIR/$short.log" 2>&1
            status=$?
            set -e
            printf '%s\n' "$status" >"$LOG_DIR/$short.exit"
            cat "$LOG_DIR/$short.log"
          }
          passed=0
          failed=0
          for name in "${tests[@]}"; do
            short="${name##*::}"
            run_one "$name"
            status=$(cat "$LOG_DIR/$short.exit")
            if validate_control "$status" "$LOG_DIR/$short.log" "$name" >"$LOG_DIR/$short.validation"; then
              passed=$((passed + 1))
            else
              failed=$((failed + 1))
              if ! grep -Fxq 'running 1 test' "$LOG_DIR/$short.log"; then
                echo "Stopping: test execution did not start for $name" >&2
                cat "$LOG_DIR/$short.validation"
                break
              fi
            fi
            cat "$LOG_DIR/$short.validation"
          done
          printf 'expected=15 passed=%s failed=%s\n' "$passed" "$failed"
          [[ "$passed" -eq 15 && "$failed" -eq 0 ]]

      - name: Upload raw logs, status codes and selection
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: scanner-group-identity-green-${{ github.run_id }}
          path: ${{ runner.temp }}/scanner-group-identity-green/
          retention-days: 7
          if-no-files-found: warn
