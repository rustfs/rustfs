name: Scanner lease no-deadline red preflight

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: scanner-lease-no-deadline-red-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: never
  CARGO_INCREMENTAL: '0'
  CARGO_BUILD_JOBS: '1'
  RUST_BACKTRACE: '0'
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'
  NO_PROXY: 127.0.0.1,localhost

jobs:
  scoped-red:
    name: Verify the named regression fails for the expected reason
    runs-on: ubuntu-latest
    timeout-minutes: 110
    steps:
      - name: Checkout
        uses: actions/checkout@f548e57e544e1ff5a4c46bf1e1b8685f8e4a348a
        with:
          fetch-depth: 5
          persist-credentials: false
          clean: false

      - name: Verify source and scope
        shell: bash
        run: |
          set -euo pipefail
          output_dir="$RUNNER_TEMP/scanner-lease-no-deadline-red"
          mkdir -p "$output_dir"
          workflow_sha=$(git rev-parse HEAD)
          source_sha=$(git rev-parse HEAD^)
          previous_source_sha=$(git rev-parse HEAD^^)
          base_sha=$(git rev-parse HEAD^^^)
          source_tree=$(git rev-parse "$source_sha^{tree}")
          base_tree=$(git rev-parse "$base_sha^{tree}")
          source_diff=$(git diff --binary --full-index "$base_sha" "$source_sha" | sha256sum | cut -d' ' -f1)
          test_diff=$(git diff --binary --full-index "$base_sha" "$source_sha" -- crates/scanner/src/scanner/tests/cycle_budget_publication.rs | sha256sum | cut -d' ' -f1)
          test_blob=$(git rev-parse "$source_sha:crates/scanner/src/scanner/tests/cycle_budget_publication.rs")
          source_files=$(git diff --name-only "$base_sha" "$source_sha")
          revision_files=$(git diff --name-only "$previous_source_sha" "$source_sha")
          workflow_files=$(git diff --name-only "$source_sha" "$workflow_sha")
          printf 'workflow=%s\nsource=%s\nprevious_source=%s\nbase=%s\nsource_tree=%s\nbase_tree=%s\nsource_diff=%s\ntest_diff=%s\ntest_blob=%s\nsource_files=%s\nrevision_files=%s\nworkflow_files=%s\n' \
            "$workflow_sha" "$source_sha" "$previous_source_sha" "$base_sha" "$source_tree" "$base_tree" "$source_diff" "$test_diff" "$test_blob" "$source_files" "$revision_files" "$workflow_files" \
            | tee "$output_dir/source.txt"
          [[ "$workflow_sha" == "$GITHUB_SHA" ]]
          [[ "$source_sha" == 'a97d23dc54d5078432459babbc8103e7b2fdbd61' ]]
          [[ "$previous_source_sha" == '2560cc44be5f9bd15d65390d8a6e04fb054e74cf' ]]
          [[ "$base_sha" == 'bf2be16d1ef7a47b4930641a8182b188c7fff90a' ]]
          [[ "$source_tree" == '836df5777904d542125683b9724bf73be510f4e4' ]]
          [[ "$base_tree" == 'b30c0a5b24bceea595bfa555d583072ce38425f3' ]]
          [[ "$source_diff" == 'a05dd8f9c974256fe63fd86d5b0bf6cd9ff7d7e0d6628811733238c8184cdab2' ]]
          [[ "$test_diff" == 'd1bd34202d95fdd99cb98fc8808bfdc185cffef5cf58c14b186b7ed1a14e3628' ]]
          [[ "$test_blob" == 'c27daec6df71c2b70213b0e12af24856665b349a' ]]
          [[ "$source_files" == $'crates/scanner/src/scanner.rs\ncrates/scanner/src/scanner/tests/cycle_budget_publication.rs' ]]
          [[ "$revision_files" == 'crates/scanner/src/scanner/tests/cycle_budget_publication.rs' ]]
          [[ "$workflow_files" == '.github/workflows/windows-filesystem.yml' ]]
          [[ -z "$(git status --porcelain=v1 --untracked-files=all)" ]]
          printf '%s\n' 'One exact scanner unit test; its real local cache-lock timeout does not send the rejected old coordinator RPC or run MRF tests. A red result is not a fix or complete CI.' \
            | tee "$output_dir/scope.txt"

      - name: Setup Rust
        uses: ./.github/actions/setup
        with:
          rust-version: stable
          cache-shared-key: ci-e2e-distributed-hosted
          cache-save-if: 'false'
          install-build-packaging-tools: 'false'
          install-test-tools: 'false'

      - name: Run and verify the expected failure
        shell: bash
        run: |
          set -euo pipefail
          output_dir="$RUNNER_TEMP/scanner-lease-no-deadline-red"
          test_name='scanner::tests::cycle_budget_publication::publication_lease_retries_local_channel_deadline_and_stops_on_cancel'
          log="$output_dir/parent.log"
          if [[ -v RUSTFS_TEST_SCANNER_LEASE_DIAL_RETRY_CHILD ]]; then
            printf '%s\n' 'The parent child-marker must be unset' | tee "$output_dir/environment.txt"
            exit 1
          fi
          printf '%s\n' 'parent_child_marker=unset' | tee "$output_dir/environment.txt"
          set +e
          cargo test --locked -p rustfs-scanner --lib -- --exact "$test_name" --nocapture >"$log" 2>&1
          test_status=$?
          set -e
          printf '%s\n' "$test_status" | tee "$output_dir/exit-code.txt"
          tail -n 120 "$log" || true
          set +e
          python3 - "$log" "$test_status" "$test_name" >"$output_dir/verification.txt" 2>&1 <<'PY'
          import re
          import sys
          from pathlib import Path

          def require(condition, message):
              if not condition:
                  print(message)
                  raise SystemExit(1)

          log_path, status, name = sys.argv[1:]
          text = Path(log_path).read_text(encoding="utf-8", errors="replace")
          text = re.sub(r"\x1b\[[0-?]*[ -/]*[@-~]", "", text)
          require(status == "101", f"expected cargo exit 101, got {status}")
          require("SCANNER_NO_DEADLINE_ACQUISITION_STALLED" not in text, "acquisition stalled before enough returns")
          require(text.count("channel deadline subprocess failed:") == 1, "missing or repeated parent wrapper failure")
          runs = list(re.finditer(r"(?m)^running 1 test[ \t]*\r?$", text))
          tests = list(re.finditer(r"(?m)^test " + re.escape(name) + r" \.\.\. FAILED[ \t]*\r?$", text))
          summaries = list(re.finditer(r"(?m)^test result: FAILED\. 0 passed; 1 failed; 0 ignored;", text))
          markers = list(re.finditer(r"(?m)^SCANNER_NO_DEADLINE_TIMEOUT_MUST_DEFER: attempts=(\d+) returned=(\d+)[ \t]*\r?$", text))
          require(len(runs) == 2 and len(tests) == 2 and len(summaries) == 2, "parent and child must each select and fail exactly one named test")
          require(len(markers) == 1 and int(markers[0].group(1)) == int(markers[0].group(2)) and int(markers[0].group(2)) >= 3, "expected child sentinel with equal attempts and at least three returned typed timeouts")
          source = Path("crates/scanner/src/scanner/tests/cycle_budget_publication.rs").read_text().splitlines()
          wrapper_lines = [i + 1 for i, line in enumerate(source[:-1]) if line.strip() == "assert!(" and source[i + 1].strip().startswith("output.status.success() &&")]
          marker_lines = [i + 1 for i, line in enumerate(source) if 'panic!("SCANNER_NO_DEADLINE_TIMEOUT_MUST_DEFER:' in line]
          require(len(wrapper_lines) == 1 and len(marker_lines) == 1, "source panic locations are ambiguous")
          headers = list(re.finditer(r"(?m)^thread '([^']+)'(?: \(\d+\))? panicked at ([^:\r\n]+):(\d+):\d+:[ \t]*\r?$", text))
          path = "crates/scanner/src/scanner/tests/cycle_budget_publication.rs"
          require(len(headers) == 2, "unexpected number of panic headers")
          require([(h.group(1), h.group(2), int(h.group(3))) for h in headers] == [(name, path, wrapper_lines[0]), (name, path, marker_lines[0])], "unexpected parent or child panic location")
          wrapper = text.index("channel deadline subprocess failed:")
          require(runs[0].start() < headers[0].start() < wrapper < runs[1].start() < tests[0].start() < summaries[0].start() < headers[1].start() < markers[0].start() < tests[1].start() < summaries[1].start(), "sentinel was not inside the actual child failure")
          print(f"Expected red: parent and child each ran one named test; attempts={markers[0].group(1)}, returned={markers[0].group(2)}.")
          PY
          verify_status=$?
          set -e
          cat "$output_dir/verification.txt"
          exit "$verify_status"

      - name: Preserve preflight output
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: scanner-lease-no-deadline-red-${{ github.run_id }}
          path: ${{ runner.temp }}/scanner-lease-no-deadline-red/
          if-no-files-found: warn
