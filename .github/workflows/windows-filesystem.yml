name: Scanner stale backup regression
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: scanner-stale-backup-red-${{ github.ref }}
  cancel-in-progress: false
env:
  CARGO_TERM_COLOR: never
  CARGO_INCREMENTAL: '0'
  CARGO_BUILD_JOBS: '1'
  RUST_BACKTRACE: '0'
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'
  NO_PROXY: 127.0.0.1,localhost
jobs:
  scoped-red-test:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout
        uses: actions/checkout@f548e57e544e1ff5a4c46bf1e1b8685f8e4a348a
        with:
          fetch-depth: 3
          persist-credentials: false
          clean: false
      - name: Verify source snapshot
        shell: bash
        run: |
          set -euo pipefail
          workflow_sha=$(git rev-parse HEAD)
          source_sha=$(git rev-parse HEAD^)
          base_sha=$(git rev-parse HEAD^^)
          source_tree=$(git rev-parse "$source_sha^{tree}")
          source_diff=$(git diff --full-index --binary "$base_sha" "$source_sha" | sha256sum | cut -d' ' -f1)
          source_files=$(git diff --name-only "$base_sha" "$source_sha")
          workflow_files=$(git diff --name-only "$source_sha" "$workflow_sha")
          expected_files=$(printf '%s\n' 'crates/scanner/src/scanner_folder/tests/checkpoint_fixture.rs' 'crates/scanner/src/scanner_folder/tests/erasure_probe.rs')
          printf 'head=%s source=%s base=%s tree=%s diff=%s\n' "$workflow_sha" "$source_sha" "$base_sha" "$source_tree" "$source_diff"
          [[ "$workflow_sha" == "$GITHUB_SHA" ]]
          [[ "$source_sha" == '980a6b9770db6d5a10fbf52abbbd8c66db887ae9' ]]
          [[ "$base_sha" == 'b4026b43b215a5d1f91c3e079e2be2f1bb8967f9' ]]
          [[ "$source_tree" == '3879c0e6cefda7b9d48a7769ddd33774ab4bf6ec' ]]
          [[ "$source_diff" == 'eac18e2b3901a750985f6165c68400bd5c9026404e1520f9dd489c3bc94483a9' ]]
          [[ "$source_files" == "$expected_files" ]]
          [[ "$workflow_files" == '.github/workflows/windows-filesystem.yml' ]]
          [[ -z "$(git status --porcelain)" ]]
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential pkg-config libssl-dev ripgrep
      - name: Install protoc
        uses: rustfs/setup-protoc@a3705324d8f9bf5b6c3573fb6cf8ae421db55dd6
        with:
          version: '35.1'
          repo-token: ${{ github.token }}
      - name: Install flatc
        uses: Nugine/setup-flatc@698800de72a96bfb22cf60431dc21a2ff9a7e07b
        with:
          version: '25.12.19'
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8
        with:
          toolchain: stable
      - name: Run the named regression
        shell: bash
        run: |
          set -euo pipefail
          df -h .
          test_name=scanner_folder::tests::checkpoint_fixture::corrupt_primary_cannot_promote_older_complete_backup_after_partial
          log="$RUNNER_TEMP/scanner-stale-backup-red.log"
          set +e
          cargo test --locked -p rustfs-scanner --lib -- --exact "$test_name" >"$log" 2>&1
          test_status=$?
          set -e
          tail -n 120 "$log"
          [[ "$test_status" -eq 101 ]]
          grep -Fxq -- 'running 1 test' "$log"
          grep -Fxq -- "test $test_name ... FAILED" "$log"
          grep -Fq -- 'checkpoint_fixture.rs:1167:' "$log"
          grep -Fq -- 'an older backup must not certify an unverified failed subtree: snapshot_complete=true, failed_prefix_observed=false' "$log"
          grep -Fq -- 'test result: FAILED. 0 passed; 1 failed;' "$log"
          printf 'Confirmed the expected failure of the named test\n'
      - name: Preserve test output
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: scanner-stale-backup-red-${{ github.run_id }}
          path: ${{ runner.temp }}/scanner-stale-backup-red.log
          if-no-files-found: warn
