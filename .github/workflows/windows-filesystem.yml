name: Scanner reused heal ID regression fixed probe
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: scanner-heal-id-reuse-fixed-red-${{ github.ref }}
  cancel-in-progress: false
env:
  CARGO_TERM_COLOR: never
  CARGO_INCREMENTAL: '0'
  CARGO_BUILD_JOBS: '1'
  RUST_BACKTRACE: '0'
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'
  NO_PROXY: 127.0.0.1,localhost
jobs:
  scoped-red-test:
    runs-on: ubuntu-latest
    timeout-minutes: 110
    steps:
      - name: Checkout
        uses: actions/checkout@f548e57e544e1ff5a4c46bf1e1b8685f8e4a348a
        with:
          fetch-depth: 5
          persist-credentials: false
          clean: false
      - name: Verify source snapshots
        shell: bash
        run: |
          set -euo pipefail
          workflow_sha=$(git rev-parse HEAD)
          fix_sha=$(git rev-parse HEAD^)
          test_sha=$(git rev-parse HEAD^^)
          candidate_sha=$(git rev-parse HEAD^^^)
          base_sha=$(git rev-parse HEAD^^^^)
          fix_tree=$(git rev-parse "$fix_sha^{tree}")
          candidate_diff=$(git diff --full-index --binary "$base_sha" "$candidate_sha" | sha256sum | cut -d' ' -f1)
          test_diff=$(git diff --full-index --binary "$candidate_sha" "$test_sha" | sha256sum | cut -d' ' -f1)
          fix_diff=$(git diff --full-index --binary "$test_sha" "$fix_sha" | sha256sum | cut -d' ' -f1)
          workflow_files=$(git diff --name-only "$fix_sha" "$workflow_sha")
          printf 'head=%s fix=%s test=%s candidate=%s base=%s tree=%s candidate_diff=%s test_diff=%s fix_diff=%s\n' "$workflow_sha" "$fix_sha" "$test_sha" "$candidate_sha" "$base_sha" "$fix_tree" "$candidate_diff" "$test_diff" "$fix_diff"
          [[ "$workflow_sha" == "$GITHUB_SHA" ]]
          [[ "$fix_sha" == 'd31b9fe1b8777482a5ad90c46dedb27170c46d74' ]]
          [[ "$test_sha" == 'cccc31bd51823b4573480795eeab782f01a0d632' ]]
          [[ "$candidate_sha" == '91cc09a461c73f547d55db43ea90fea8a7e2492b' ]]
          [[ "$base_sha" == '3d3957a2489c95b0e239a7c6231bbcee5e1e71fb' ]]
          [[ "$fix_tree" == 'd21eca371617dc011d1b6ad9aeb24fe50d23de94' ]]
          [[ "$candidate_diff" == '57e3abbabb9804980d1b59318ddcf3a9ff73f3d1f9cd313f817cc05ade7f1a14' ]]
          [[ "$test_diff" == '33600bddcc62e6a282f31c7cc155b9dd98a5e02bf361fa5bc8aa7a2421ed9125' ]]
          [[ "$fix_diff" == '18c20e7e2540e94207585f90052b9fe61696fbc8eb4b8c7e8f68958bea8757b3' ]]
          [[ "$workflow_files" == '.github/workflows/windows-filesystem.yml' ]]
          [[ -z "$(git status --porcelain)" ]]
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential pkg-config libssl-dev ripgrep
      - name: Install protoc
        uses: rustfs/setup-protoc@a3705324d8f9bf5b6c3573fb6cf8ae421db55dd6
        with:
          version: '35.1'
          repo-token: ${{ github.token }}
      - name: Install flatc
        uses: Nugine/setup-flatc@698800de72a96bfb22cf60431dc21a2ff9a7e07b
        with:
          version: '25.12.19'
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8
        with:
          toolchain: stable
      - name: Run the named regressions
        shell: bash
        run: |
          set -euo pipefail
          df -h .
          run_red() {
            local kind="$1" name="$2" marker="$3" log="$RUNNER_TEMP/heal-id-reuse-$1.log"
            set +e
            if [[ "$kind" == integration ]]; then
              cargo test --locked -p rustfs-scanner --features test-util --test heal_generation_observation -- --exact "$name" >"$log" 2>&1
            else
              cargo test --locked -p rustfs-scanner --features test-util --lib -- --exact "$name" >"$log" 2>&1
            fi
            local status=$?
            set -e
            tail -n 100 "$log"
            [[ "$status" -eq 101 ]]
            grep -Fxq -- 'running 1 test' "$log"
            grep -Fxq -- "test $name ... FAILED" "$log"
            grep -Fq -- "$marker" "$log"
            grep -Fq -- 'test result: FAILED. 0 passed; 1 failed;' "$log"
          }
          run_red unit-changed 'heal_completion::tests::reused_task_id_does_not_attach_an_old_terminal_to_a_new_execution' 'HEAL_ID_REUSE_UNIT_STALE_TERMINAL'
          run_red unit-same 'heal_completion::tests::reused_task_id_with_unchanged_data_dir_does_not_reuse_the_old_terminal' 'HEAL_ID_REUSE_UNIT_SAME_DATA_STALE_TERMINAL'
          run_red integration 'overwritten_unversioned_generation_is_not_attributed_to_the_scanned_candidate' 'HEAL_ID_REUSE_E2E_STALE_TERMINAL: same_data=true changed_data=true'
          printf 'Confirmed all three expected failures\n'
      - name: Preserve test output
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: scanner-heal-id-reuse-fixed-red-${{ github.run_id }}
          path: ${{ runner.temp }}/heal-id-reuse-*.log
          if-no-files-found: warn
