name: Scanner Clippy Preflight

on:
  workflow_dispatch:
    inputs:
      expected_head:
        description: Full SHA of this workflow commit
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: scanner-clippy-1f94-${{ github.ref }}
  cancel-in-progress: false

# Clippy compiles Scanner library and test targets without executing tests.
# This does not replace the full CI or distributed G gates.
jobs:
  scoped:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      CARGO_TERM_COLOR: never
      CARGO_BUILD_JOBS: '2'
      CARGO_INCREMENTAL: '0'
      CARGO_PROFILE_DEV_DEBUG: '0'
      CARGO_PROFILE_TEST_DEBUG: '0'
      RUST_BACKTRACE: '0'
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'
      NO_PROXY: 127.0.0.1,localhost
    steps:
      - name: Checkout candidate
        uses: actions/checkout@f548e57e544e1ff5a4c46bf1e1b8685f8e4a348a # v7
        with:
          fetch-depth: 10
          persist-credentials: false

      - name: Verify exact source and test snapshot
        shell: bash
        env:
          EXPECTED_HEAD: ${{ inputs.expected_head }}
          LOG_DIR: ${{ runner.temp }}/scanner-clippy-1f94
        run: |
          set -euo pipefail
          [[ ! -e "$LOG_DIR" ]]
          mkdir "$LOG_DIR"
          head=$(git rev-parse HEAD)
          workflow_parent=$(git rev-parse "${head}^")
          source=$(git rev-parse '1f94f5cef40bf95732d665e0bf2cd6e7e37810ae^{commit}')
          parent=$(git rev-parse "${source}^")
          tree=$(git rev-parse "${source}^{tree}")
          parent_tree=$(git rev-parse "${parent}^{tree}")
          test_blob=$(git rev-parse "${source}:crates/scanner/src/heal_completion/tests.rs")
          production_blob=$(git rev-parse "${source}:crates/scanner/src/heal_completion.rs")
          parent_production_blob=$(git rev-parse "${parent}:crates/scanner/src/heal_completion.rs")
          source_diff=$(git diff --full-index --binary "$parent" "$source" | sha256sum | cut -d' ' -f1)
          workflow_diff=$(git diff --full-index --binary "$source" "$head" | sha256sum | cut -d' ' -f1)
          source_files=$(git diff --name-only "$parent" "$source")
          workflow_files=$(git diff --name-only "$source" "$head")
          printf 'expected_head=%s head=%s workflow_parent=%s source=%s parent=%s tree=%s parent_tree=%s test_blob=%s production_blob=%s source_diff=%s workflow_diff=%s\n' \
            "$EXPECTED_HEAD" "$head" "$workflow_parent" "$source" "$parent" "$tree" "$parent_tree" "$test_blob" "$production_blob" "$source_diff" "$workflow_diff" | tee "$LOG_DIR/snapshot.txt"
          printf 'source_files=%s workflow_files=%s\n' "$source_files" "$workflow_files" | tee -a "$LOG_DIR/snapshot.txt"
          [[ "$EXPECTED_HEAD" =~ ^[0-9a-f]{40}$ ]]
          [[ "$head" == "$EXPECTED_HEAD" && "$head" == "$GITHUB_SHA" && "$workflow_parent" == "$source" ]]
          [[ "$source" == 1f94f5cef40bf95732d665e0bf2cd6e7e37810ae ]]
          [[ "$parent" == e2c7624359f013bfe976b17d4c161b7923e27467 ]]
          [[ "$tree" == 5e8eebb7fa8821823cffa5a4b6512fb74b4b9b56 && "$parent_tree" == 61aae16b94b6dcdcb3698050682afe81fbd71dfe ]]
          [[ "$test_blob" == d6eaf77762b3cb00a3da6055ce601915055d51b5 ]]
          [[ "$production_blob" == 23a6ff93622652d1878b6f5ba4e7f4fc5845492d && "$production_blob" == "$parent_production_blob" ]]
          [[ "$source_diff" == ddbc0c4170f0c0fcf86dcb84842cf5367400ae0cc4a31064e8b2dad44c0cf35c ]]
          [[ "$source_files" == crates/scanner/src/heal_completion/tests.rs ]]
          [[ "$workflow_files" == .github/workflows/windows-filesystem.yml ]]
          [[ -z "$(git status --porcelain)" ]]

      - name: Install system dependencies
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential pkg-config libssl-dev ripgrep

      - name: Install protoc
        uses: rustfs/setup-protoc@a3705324d8f9bf5b6c3573fb6cf8ae421db55dd6 # v3.0.1
        with:
          version: '35.1'
          repo-token: ${{ github.token }}

      - name: Install flatc
        uses: Nugine/setup-flatc@698800de72a96bfb22cf60431dc21a2ff9a7e07b # v1
        with:
          version: '25.12.19'

      - name: Install stable Rust and Clippy
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
        with:
          toolchain: stable
          components: clippy

      - name: Run Scanner Clippy
        shell: bash
        env:
          LOG_DIR: ${{ runner.temp }}/scanner-clippy-1f94
        run: |
          set -euo pipefail
          [[ -d "$LOG_DIR" && -f "$LOG_DIR/snapshot.txt" ]]
          rustc --version --verbose | tee "$LOG_DIR/rustc-version.log"
          cargo --version --verbose | tee "$LOG_DIR/cargo-version.log"
          toolchain=$(rustup show active-toolchain)
          printf '%s\n' "$toolchain" | tee "$LOG_DIR/rustup-version.log"
          [[ "$toolchain" == stable-* ]]
          cargo clippy --version | tee "$LOG_DIR/clippy-version.log"
          df -h . | tee "$LOG_DIR/disk.log"
          available=$(df -Pk . | awk 'NR == 2 {print $4}')
          [[ "$available" =~ ^[0-9]+$ ]]
          if (( available < 4194304 )); then
            echo 'not_started: insufficient disk' | tee -a "$LOG_DIR/disk.log"
            exit 1
          fi
          printf '%s\n' 'cargo clippy --locked -p rustfs-scanner --lib --tests --no-deps -- -D warnings' >"$LOG_DIR/command.txt"
          set +e
          cargo clippy --locked -p rustfs-scanner --lib --tests --no-deps -- -D warnings >"$LOG_DIR/clippy.log" 2>&1
          status=$?
          set -e
          printf '%s\n' "$status" >"$LOG_DIR/clippy.exit"
          cat "$LOG_DIR/clippy.log"
          exit "$status"

      - name: Upload raw logs and status code
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: scanner-clippy-1f94-${{ github.run_id }}
          path: ${{ runner.temp }}/scanner-clippy-1f94/
          retention-days: 7
          if-no-files-found: warn
