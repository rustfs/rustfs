name: Scanner canonical receipt baseline

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-red:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout
        uses: actions/checkout@f548e57e544e1ff5a4c46bf1e1b8685f8e4a348a # v7
        with:
          persist-credentials: false

      - name: Setup Rust
        uses: ./.github/actions/setup
        with:
          rust-version: stable
          cache-shared-key: ci-e2e-distributed-hosted
          cache-save-if: 'false'
          install-build-packaging-tools: 'false'
          install-test-tools: 'false'

      - name: Verify the two baseline failures
        shell: bash
        run: |
          set -euo pipefail
          export CARGO_TERM_COLOR=never
          export CARGO_BUILD_JOBS=2
          export CARGO_PROFILE_TEST_DEBUG=0
          export CARGO_INCREMENTAL=0
          export RUST_BACKTRACE=0
          failed=0
          for mode in normal fair; do
            name="heal::manager::tests::queued_representative::scanner_receipt_tracks_queued_owner_after_${mode}_dequeue"
            log="${RUNNER_TEMP}/scanner-queued-owner-${mode}.log"
            set +e
            cargo test --locked -p rustfs-heal --lib "$name" -- --exact --test-threads=1 >"$log" 2>&1
            status=$?
            set -e
            tail -n 160 "$log"
            if [[ "$status" -ne 101 ]] ||
              ! grep -Fxq 'running 1 test' "$log" ||
              ! grep -Fxq "test ${name} ... FAILED" "$log" ||
              ! grep -Fq 'receipt must name the remaining queued task' "$log" ||
              ! grep -Fq 'test result: FAILED. 0 passed; 1 failed;' "$log"; then
              printf 'Expected exactly one matching failure for %s (cargo exit %s)\n' "$name" "$status" >&2
              failed=1
            else
              printf 'Confirmed expected baseline failure for %s\n' "$name"
            fi
          done
          exit "$failed"
