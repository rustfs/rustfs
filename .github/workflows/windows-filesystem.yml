name: Heal durable alias regression
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: heal-durable-alias-red-${{ github.ref }}
  cancel-in-progress: false
env:
  CARGO_TERM_COLOR: never
  CARGO_INCREMENTAL: '0'
  CARGO_BUILD_JOBS: '1'
  RUST_BACKTRACE: '0'
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'
  NO_PROXY: 127.0.0.1,localhost
jobs:
  scoped-red-test:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout
        uses: actions/checkout@f548e57e544e1ff5a4c46bf1e1b8685f8e4a348a
        with:
          fetch-depth: 3
          persist-credentials: false
          clean: false
      - name: Verify source snapshot
        shell: bash
        run: |
          set -euo pipefail
          workflow_sha=$(git rev-parse HEAD)
          source_sha=$(git rev-parse HEAD^)
          base_sha=$(git rev-parse HEAD^^)
          source_tree=$(git rev-parse "$source_sha^{tree}")
          source_diff=$(git diff --full-index --binary "$base_sha" "$source_sha" | sha256sum | cut -d' ' -f1)
          source_files=$(git diff --name-only "$base_sha" "$source_sha")
          workflow_files=$(git diff --name-only "$source_sha" "$workflow_sha")
          printf 'head=%s source=%s base=%s tree=%s diff=%s\n' "$workflow_sha" "$source_sha" "$base_sha" "$source_tree" "$source_diff"
          [[ "$workflow_sha" == "$GITHUB_SHA" ]]
          [[ "$source_sha" == '955b21d06053f9a90da84fef4991dd7900c59c55' ]]
          [[ "$base_sha" == '157a3a6c7d72be064820bf52a687fe36d8383994' ]]
          [[ "$source_tree" == 'dfae3ae801031d83382a668347ff0c31e9af9d5c' ]]
          [[ "$source_diff" == '560c7d0ddc279488618f663daa59998db853f02d8d1df73b3b2ce281bf072926' ]]
          [[ "$source_files" == 'crates/heal/src/heal/manager/tests/root_recovery.rs' ]]
          [[ "$workflow_files" == '.github/workflows/windows-filesystem.yml' ]]
          [[ -z "$(git status --porcelain)" ]]
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential pkg-config libssl-dev ripgrep
      - name: Install protoc
        uses: rustfs/setup-protoc@a3705324d8f9bf5b6c3573fb6cf8ae421db55dd6
        with:
          version: '35.1'
          repo-token: ${{ github.token }}
      - name: Install flatc
        uses: Nugine/setup-flatc@698800de72a96bfb22cf60431dc21a2ff9a7e07b
        with:
          version: '25.12.19'
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8
        with:
          toolchain: stable
      - name: Run the named regression
        shell: bash
        run: |
          set -euo pipefail
          df -h .
          test_name=heal::manager::tests::root_recovery::root_recovery_force_start_rejects_published_alias_id
          log="$RUNNER_TEMP/heal-durable-alias-red.log"
          set +e
          cargo test --locked -p rustfs-heal --lib -- --exact "$test_name" >"$log" 2>&1
          test_status=$?
          set -e
          tail -n 120 "$log"
          [[ "$test_status" -eq 101 ]]
          grep -Fxq -- 'running 1 test' "$log"
          grep -Fxq -- "test $test_name ... FAILED" "$log"
          grep -Fq -- 'published_alias_force admission=Accepted durable_forced=true queued_forced=true forced_status=Err(InvalidClientToken) alias_status=Ok(Pending)' "$log"
          grep -Fq -- 'root_recovery.rs:159:' "$log"
          grep -Fq -- 'left: Accepted' "$log"
          grep -Fq -- 'right: Dropped(AlreadyRunning)' "$log"
          grep -Fq -- 'test result: FAILED. 0 passed; 1 failed;' "$log"
          printf 'Confirmed the expected failure of the named test\n'
      - name: Preserve test output
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: heal-durable-alias-red-${{ github.run_id }}
          path: ${{ runner.temp }}/heal-durable-alias-red.log
          if-no-files-found: warn
