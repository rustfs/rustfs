name: Heal ownership on current main
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: heal-owner-main-7a3-units-${{ github.ref }}
  cancel-in-progress: false
env:
  CARGO_TERM_COLOR: never
  CARGO_INCREMENTAL: '0'
  CARGO_BUILD_JOBS: '2'
  CARGO_PROFILE_TEST_DEBUG: '0'
  RUST_BACKTRACE: '0'
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'
  NO_PROXY: 127.0.0.1,localhost
jobs:
  focused:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Checkout
        uses: actions/checkout@f548e57e544e1ff5a4c46bf1e1b8685f8e4a348a
        with:
          fetch-depth: 4
          persist-credentials: false
          clean: false
      - name: Verify source snapshot
        shell: bash
        run: |
          set -euo pipefail
          workflow_sha=$(git rev-parse HEAD)
          source_sha=$(git rev-parse HEAD^)
          candidate_sha=$(git rev-parse HEAD^^)
          base_sha=$(git rev-parse HEAD^^^)
          source_tree=$(git rev-parse "$source_sha^{tree}")
          source_diff=$(git diff --full-index --binary "$base_sha" "$source_sha" | sha256sum | cut -d' ' -f1)
          workflow_files=$(git diff --name-only "$source_sha" "$workflow_sha")
          printf 'head=%s source=%s candidate=%s base=%s tree=%s diff=%s\n' "$workflow_sha" "$source_sha" "$candidate_sha" "$base_sha" "$source_tree" "$source_diff"
          [[ "$workflow_sha" == "$GITHUB_SHA" ]]
          [[ "$source_sha" == '41d06b4d7a1eee1cec4db8df65bc741b834831eb' ]]
          [[ "$candidate_sha" == 'c96fc5cf265becd20d39a183f55af9fe1be7d2cf' ]]
          [[ "$base_sha" == '7a3bf8cdbd781116a0970585b995ade668c0e662' ]]
          [[ "$source_tree" == '01b101acf0119bec8243cab1556cc0218170b6bf' ]]
          [[ "$source_diff" == 'c4c3717733546058d5047425a4489ab70b1a024a28635eaeff4494e6a42d629a' ]]
          [[ "$workflow_files" == '.github/workflows/windows-filesystem.yml' ]]
          [[ -z "$(git status --porcelain)" ]]
      - name: Setup Rust
        uses: ./.github/actions/setup
        with:
          rust-version: stable
          cache-shared-key: ci-e2e-distributed-hosted
          cache-save-if: 'false'
          install-build-packaging-tools: 'false'
          install-test-tools: 'false'
      - name: Run the eighteen selected tests
        shell: bash
        run: |
          set -euo pipefail
          df -h .
          tests=(
            heal::manager::tests::queued_representative::scanner_receipt_tracks_queued_owner_after_normal_dequeue
            heal::manager::tests::queued_representative::scanner_receipt_tracks_queued_owner_after_fair_dequeue
            heal::manager::tests::queued_representative::scanner_receipt_keeps_queued_owner_when_a_different_forced_task_runs
            heal::manager::tests::queued_representative::scanner_receipt_reselects_after_the_queued_owner_is_cancelled
            heal::manager::tests::queued_representative::scanner_receipt_reselects_after_multiple_forced_dequeues
            heal::manager::tests::queued_representative::scanner_owner_index_survives_a_single_remaining_holder_and_new_forced_work
            heal::manager::tests::queued_representative::scanner_owner_index_distinguishes_holders_with_the_same_request_id
            heal::manager::tests::queued_representative::scanner_owner_index_tracks_bulk_removal_and_key_release
            heal::manager::tests::queued_representative::scanner_owner_index_tracks_displacement_without_changing_legacy_reselection
            heal::manager::tests::queued_representative::scanner_receipt_rejects_a_missing_or_empty_holder_index
            heal::manager::tests::queued_representative::scanner_and_legacy_owners_keep_their_distinct_reselection_orders
            heal::manager::tests::queued_representative::scanner_owner_index_tracks_a_series_of_forced_holders
            heal::manager::tests::admin_overlap::admin_force_start_rechecks_request_id_after_cancelling_overlaps
            heal::manager::tests::admin_overlap::admin_overlap_forced_request_id_replay_has_no_cancellation_side_effects
            heal::manager::tests::same_request_id_replay_reuses_existing_task_without_force_start_duplication
            heal::manager::tests::admin_overlap::forced_id_conflict_preserves_scanner_queued_owner
            heal::manager::tests::queued_representative::scanner_receipt_tracks_scoped_read_repair_forced_holders
            heal::manager::tests::queued_representative::scanner_receipt_does_not_merge_read_repair_with_a_different_scope_or_version
          )
          for name in "${tests[@]}"; do
            log="$RUNNER_TEMP/heal-owner-unit-${name##*::}.log"
            set +e
            cargo test --locked -p rustfs-heal --lib "$name" -- --exact --test-threads=1 >"$log" 2>&1
            status=$?
            set -e
            tail -n 160 "$log"
            [[ "$status" -eq 0 ]]
            grep -Fxq 'running 1 test' "$log"
            grep -Fxq "test ${name} ... ok" "$log"
            grep -Fq 'test result: ok. 1 passed; 0 failed;' "$log"
            printf 'Confirmed one passing test: %s\n' "$name"
          done
      - name: Preserve test output
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: heal-owner-main-7a3-units-${{ github.run_id }}
          path: ${{ runner.temp }}/heal-owner-unit-*.log
          if-no-files-found: warn
