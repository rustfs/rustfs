name: Scanner collector and admission preflight
on:
  workflow_dispatch:
    inputs:
      expected_head:
        description: Full workflow commit SHA
        required: true
        type: string
permissions:
  contents: read
concurrency:
  group: scanner-collector-admission-${{ github.ref }}
  cancel-in-progress: false
env:
  CARGO_TERM_COLOR: never
  CARGO_INCREMENTAL: '0'
  CARGO_BUILD_JOBS: '1'
  RUST_BACKTRACE: '0'
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'
  NO_PROXY: 127.0.0.1,localhost
jobs:
  scoped-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout
        uses: actions/checkout@f548e57e544e1ff5a4c46bf1e1b8685f8e4a348a
        with:
          fetch-depth: 3
          persist-credentials: false
          clean: false
      - name: Verify source snapshot
        shell: bash
        env:
          EXPECTED_HEAD: ${{ inputs.expected_head }}
        run: |
          set -euo pipefail
          workflow_sha=$(git rev-parse HEAD)
          source_sha=$(git rev-parse HEAD^)
          previous_sha=$(git rev-parse "${source_sha}^1")
          base_sha=$(git rev-parse "${source_sha}^2")
          source_tree=$(git rev-parse "${source_sha}^{tree}")
          source_diff=$(git diff --full-index --binary "$base_sha" "$source_sha" | sha256sum | cut -d' ' -f1)
          source_files=$(git diff --name-only "$base_sha" "$source_sha")
          workflow_files=$(git diff --name-only "$source_sha" "$workflow_sha")
          expected_files=$(printf '%s\n' 'crates/scanner/src/scanner_io/io_cycle.rs' 'crates/scanner/src/scanner_io/tests.rs' 'crates/scanner/src/scanner_io/tests/cycle_collector_diagnostics.rs')
          printf 'head=%s source=%s previous=%s base=%s tree=%s diff=%s\n' "$workflow_sha" "$source_sha" "$previous_sha" "$base_sha" "$source_tree" "$source_diff"
          [[ "$EXPECTED_HEAD" =~ ^[0-9a-f]{40}$ ]]
          [[ "$workflow_sha" == "$EXPECTED_HEAD" ]]
          [[ "$workflow_sha" == "$GITHUB_SHA" ]]
          [[ "$source_sha" == '5ad283e28ffa0d16b82007c64df75901aaea5b21' ]]
          [[ "$previous_sha" == '2aaf979def68d439a29e2757139011cb5a36e008' ]]
          [[ "$base_sha" == '8e88419f3a0c4741073c5ea46dd43c434be7f138' ]]
          [[ "$source_tree" == 'a3ccfe51fbfab34decabd3854c01697a7a3b33d1' ]]
          [[ "$source_diff" == 'd60a641e3de046662dfd3614af6d71f1dd6aa1c1c18718ecf6c2c7cf44b2255f' ]]
          [[ "$source_files" == "$expected_files" ]]
          [[ "$workflow_files" == '.github/workflows/windows-filesystem.yml' ]]
          [[ -z "$(git status --porcelain)" ]]
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential pkg-config libssl-dev ripgrep
      - name: Install protoc
        uses: rustfs/setup-protoc@a3705324d8f9bf5b6c3573fb6cf8ae421db55dd6
        with:
          version: '35.1'
          repo-token: ${{ github.token }}
      - name: Install flatc
        uses: Nugine/setup-flatc@698800de72a96bfb22cf60431dc21a2ff9a7e07b
        with:
          version: '25.12.19'
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8
        with:
          toolchain: stable
      - name: Run the named tests
        shell: bash
        run: |
          set -euo pipefail
          df -h .
          output_dir="$RUNNER_TEMP/scanner-collector-admission"
          mkdir -p "$output_dir"
          tests=(
            scanner_io::io_cycle::collector_summary_tests::collector_distinguishes_an_unobserved_slot_from_an_observed_default
            scanner_io::io_cycle::collector_summary_tests::collector_reports_source_positions_without_inventing_a_slot_failure
            scanner_io::io_cycle::collector_summary_tests::collector_counts_generation_and_plan_differences_without_assigning_a_cause
            scanner_io::io_cycle::collector_summary_tests::collector_sample_is_bounded_and_complete_slots_do_not_explain_other_incomplete_states
            scanner_io::tests::cycle_collector_diagnostics::collector_reports_an_unobserved_slot_after_a_stale_set_snapshot
            scanner_io::tests::cycle_collector_diagnostics::collector_reports_received_incomplete_cache_only_for_non_budget_partial
            scanner_io::tests::node_admission::scanner_node_wait_yields_cache_lease_before_fifo_admission
            scanner_io::tests::node_admission::scanner_node_wait_rejects_cache_changed_while_unlocked
            scanner_io::tests::node_admission::scanner_node_wait_cancellation_releases_queue_without_stealing_running_unit
            scanner_folder::tests::node_admission::scanner_node_admission_blocks_real_walk_before_open_or_metadata
            scanner_folder::tests::node_admission::scanner_node_cancellation_after_acquire_does_not_start_operation
            scanner_folder::tests::node_admission::scanner_node_cancellation_returns_capacity_without_abandoning_operation
          )
          printf '%s\n' "${tests[@]}" > "$output_dir/selection.txt"
          : > "$output_dir/results.txt"
          overall=0
          for test_name in "${tests[@]}"; do
            log="$output_dir/${test_name//::/_}.log"
            set +e
            cargo test --locked -p rustfs-scanner --lib -- --exact "$test_name" > "$log" 2>&1
            status=$?
            set -e
            selected=$(grep -Fxc 'running 1 test' "$log" || true)
            passed=$(grep -Fxc "test $test_name ... ok" "$log" || true)
            summary=$(grep -Fc 'test result: ok. 1 passed; 0 failed;' "$log" || true)
            printf 'test=%s exit=%s selected=%s passed=%s summary=%s\n' "$test_name" "$status" "$selected" "$passed" "$summary" | tee -a "$output_dir/results.txt"
            tail -n 35 "$log"
            if [[ "$status" -ne 0 || "$selected" -ne 1 || "$passed" -ne 1 || "$summary" -ne 1 ]]; then
              overall=1
              if [[ "$selected" -ne 1 ]]; then
                break
              fi
            fi
          done
          exit "$overall"
      - name: Preserve scoped test logs
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: scanner-collector-admission-${{ github.run_id }}
          path: ${{ runner.temp }}/scanner-collector-admission/
          if-no-files-found: warn
