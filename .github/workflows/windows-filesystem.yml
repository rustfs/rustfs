name: Heal force alias regression
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: heal-force-alias-red-${{ github.ref }}
  cancel-in-progress: false
env:
  CARGO_TERM_COLOR: never
  CARGO_INCREMENTAL: '0'
  CARGO_BUILD_JOBS: '1'
  RUST_BACKTRACE: '0'
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'
  NO_PROXY: 127.0.0.1,localhost
jobs:
  scoped-red-test:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout
        uses: actions/checkout@f548e57e544e1ff5a4c46bf1e1b8685f8e4a348a
        with:
          fetch-depth: 3
          persist-credentials: false
          clean: false
      - name: Verify source snapshot
        shell: bash
        run: |
          set -euo pipefail
          workflow_sha=$(git rev-parse HEAD)
          source_sha=$(git rev-parse HEAD^)
          base_sha=$(git rev-parse HEAD^^)
          source_tree=$(git rev-parse "$source_sha^{tree}")
          source_diff=$(git diff --full-index --binary "$base_sha" "$source_sha" | sha256sum | cut -d' ' -f1)
          source_files=$(git diff --name-only "$base_sha" "$source_sha")
          workflow_files=$(git diff --name-only "$source_sha" "$workflow_sha")
          expected_source_files=$(printf '%s\n' 'crates/heal/src/heal/manager.rs' 'crates/heal/src/heal/manager/tests/admin_overlap.rs')
          printf 'head=%s source=%s base=%s tree=%s diff=%s\n' "$workflow_sha" "$source_sha" "$base_sha" "$source_tree" "$source_diff"
          [[ "$workflow_sha" == "$GITHUB_SHA" ]]
          [[ "$source_sha" == 'c5712213727062e67d1e9e295c6a148e202b887a' ]]
          [[ "$base_sha" == '157a3a6c7d72be064820bf52a687fe36d8383994' ]]
          [[ "$source_tree" == 'abca475e165d642da5333e993932b5c58da38ee6' ]]
          [[ "$source_diff" == 'a97a06b7e82caa392c440ae03438b3fac9ddeea6723063e847b20e150bbdf5ba' ]]
          [[ "$source_files" == "$expected_source_files" ]]
          [[ "$workflow_files" == '.github/workflows/windows-filesystem.yml' ]]
          [[ -z "$(git status --porcelain)" ]]
      - name: Install system dependencies
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential pkg-config libssl-dev ripgrep
      - name: Install protoc
        uses: rustfs/setup-protoc@a3705324d8f9bf5b6c3573fb6cf8ae421db55dd6
        with:
          version: '35.1'
          repo-token: ${{ github.token }}
      - name: Install flatc
        uses: Nugine/setup-flatc@698800de72a96bfb22cf60431dc21a2ff9a7e07b
        with:
          version: '25.12.19'
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8
        with:
          toolchain: stable
      - name: Run the named regression
        shell: bash
        run: |
          set -euo pipefail
          df -h .
          test_name=heal::manager::tests::admin_overlap::force_start_and_alias_same_id_do_not_misroute
          log="$RUNNER_TEMP/heal-force-alias-red.log"
          set +e
          cargo test --locked -p rustfs-heal --lib -- --exact "$test_name" >"$log" 2>&1
          test_status=$?
          set -e
          tail -n 120 "$log"
          if [[ "$test_status" -ne 101 ]]; then
            printf 'Expected test exit 101, received %s\n' "$test_status"
            exit 1
          fi
          grep -Fxq -- 'running 1 test' "$log"
          grep -Fxq -- "test $test_name ... FAILED" "$log"
          for source in scanner internal; do
            for timing in published_before pending_before during; do
              if [[ "$timing" == pending_before ]]; then
                alias_reached=true
              else
                alias_reached=false
              fi
              grep -Fxq -- "alias_force_observed source=$source timing=$timing alias_publication_reached=$alias_reached reached_force_window=true force=accepted alias=merged forced_queued=true canonical_original=true canonical_force=false force_pending=false force_missing=false force_invalid=true alias_pending=true alias_invalid=false original_pending=true receipt_matches=true valid=false" "$log"
            done
          done
          grep -Fq -- 'each id must have exactly one admitted owner and route to that owner' "$log"
          grep -Fq -- 'test result: FAILED. 0 passed; 1 failed;' "$log"
          printf 'Confirmed the expected failure of the one selected test\n'
      - name: Preserve test output
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: heal-force-alias-red-${{ github.run_id }}
          path: ${{ runner.temp }}/heal-force-alias-red.log
          if-no-files-found: warn
