name: Scanner cache read origin preflight
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: scanner-cache-origin-${{ github.ref }}
  cancel-in-progress: false
env:
  CARGO_TERM_COLOR: never
  CARGO_INCREMENTAL: '0'
  CARGO_BUILD_JOBS: '1'
  RUST_BACKTRACE: '0'
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'
  NO_PROXY: 127.0.0.1,localhost
jobs:
  scoped-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout
        uses: actions/checkout@f548e57e544e1ff5a4c46bf1e1b8685f8e4a348a
        with:
          fetch-depth: 3
          persist-credentials: false
          clean: false
      - name: Verify source snapshot
        shell: bash
        run: |
          set -euo pipefail
          workflow_sha=$(git rev-parse HEAD)
          source_sha=$(git rev-parse HEAD^)
          base_sha=$(git rev-parse HEAD^^)
          source_tree=$(git rev-parse "${source_sha}^{tree}")
          source_diff=$(git diff --full-index --binary "$base_sha" "$source_sha" | sha256sum | cut -d' ' -f1)
          source_files=$(git diff --name-only "$base_sha" "$source_sha")
          workflow_files=$(git diff --name-only "$source_sha" "$workflow_sha")
          expected_files=$(printf '%s\n' 'crates/scanner/src/data_usage_define.rs' 'crates/scanner/src/data_usage_define/persistence.rs' 'crates/scanner/src/data_usage_define/tests.rs' 'crates/scanner/src/data_usage_define/tests/save_metrics.rs')
          printf 'head=%s source=%s base=%s tree=%s diff=%s\n' "$workflow_sha" "$source_sha" "$base_sha" "$source_tree" "$source_diff"
          [[ "$workflow_sha" == "$GITHUB_SHA" ]]
          [[ "$source_sha" == '495e1d3b873cdd2be2f9ffd6eb76e095010832b9' ]]
          [[ "$base_sha" == '7a3bf8cdbd781116a0970585b995ade668c0e662' ]]
          [[ "$source_tree" == 'c8bd60069f74095d5de1efaee916e177041a9e2e' ]]
          [[ "$source_diff" == '0a433216abecfc91416729e77cf5b16b45ffb04400701216b6aaf92321eeaf82' ]]
          [[ "$source_files" == "$expected_files" ]]
          [[ "$workflow_files" == '.github/workflows/windows-filesystem.yml' ]]
          [[ -z "$(git status --porcelain)" ]]
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential pkg-config libssl-dev ripgrep
      - name: Install protoc
        uses: rustfs/setup-protoc@a3705324d8f9bf5b6c3573fb6cf8ae421db55dd6
        with:
          version: '35.1'
          repo-token: ${{ github.token }}
      - name: Install flatc
        uses: Nugine/setup-flatc@698800de72a96bfb22cf60431dc21a2ff9a7e07b
        with:
          version: '25.12.19'
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8
        with:
          toolchain: stable
      - name: Run the named tests
        shell: bash
        run: |
          set -euo pipefail
          df -h .
          output_dir="$RUNNER_TEMP/scanner-cache-read-origin"
          mkdir -p "$output_dir"
          tests=(
            data_usage_define::tests::cache_read_origin_reports_logical_slot_and_legacy_location
            data_usage_define::tests::save_metrics::read_origin_counts_successful_loads_with_fixed_labels
            data_usage_define::tests::corrupt_primary_cache_loads_valid_backup
            data_usage_define::tests::corrupt_cache_without_valid_backup_rebuilds_with_cas_revisions
            data_usage_define::tests::backup_cache_load_fails_closed_without_main_revision_quorum
            data_usage_define::tests::recovered_main_cache_wins_over_stale_backup
            data_usage_define::tests::usage_cache_wire_format_is_pinned
          )
          printf '%s\n' "${tests[@]}" > "$output_dir/selection.txt"
          : > "$output_dir/results.txt"
          overall=0
          for test_name in "${tests[@]}"; do
            log="$output_dir/${test_name//::/_}.log"
            set +e
            cargo test --locked -p rustfs-scanner --lib -- --exact "$test_name" > "$log" 2>&1
            status=$?
            set -e
            selected=$(grep -Fxc 'running 1 test' "$log" || true)
            passed=$(grep -Fxc "test $test_name ... ok" "$log" || true)
            summary=$(grep -Fc 'test result: ok. 1 passed; 0 failed;' "$log" || true)
            printf 'test=%s exit=%s selected=%s passed=%s summary=%s\n' "$test_name" "$status" "$selected" "$passed" "$summary" | tee -a "$output_dir/results.txt"
            tail -n 35 "$log"
            if [[ "$status" -ne 0 || "$selected" -ne 1 || "$passed" -ne 1 || "$summary" -ne 1 ]]; then
              overall=1
              break
            fi
          done
          exit "$overall"
      - name: Preserve scoped test logs
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: scanner-cache-origin-${{ github.run_id }}
          path: ${{ runner.temp }}/scanner-cache-read-origin/
          if-no-files-found: warn
