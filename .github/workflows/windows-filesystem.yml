name: Scanner Channel Deadline Windows Preflight
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: scanner-deadline-windows-${{ github.ref }}
  cancel-in-progress: false
env:
  CARGO_TERM_COLOR: never
  RUST_BACKTRACE: 1
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'
  NO_PROXY: 127.0.0.1,localhost
jobs:
  scoped-tests:
    runs-on: windows-latest
    timeout-minutes: 90
    steps:
      - name: Checkout candidate
        uses: actions/checkout@f548e57e544e1ff5a4c46bf1e1b8685f8e4a348a
        with:
          persist-credentials: false
      - name: Setup Rust
        uses: ./.github/actions/setup
        with:
          rust-version: stable
          cache-shared-key: build-x86_64-pc-windows-msvc
          cache-save-if: 'false'
          install-build-packaging-tools: 'false'
          install-test-tools: 'false'
      - name: Run only the named diagnostic unit tests
        shell: bash
        run: |
          set -euo pipefail
          run_one() {
            local package="$1"
            local test_name="$2"
            cargo test --locked -p "$package" --lib -- --exact "$test_name" --nocapture 2>&1 | tee scanner-proof-test.log
            grep -F 'test result: ok. 1 passed; 0 failed;' scanner-proof-test.log
          }
          run_one rustfs-ecstore services::notification_sys::tests::scanner_lease_channel_deadline_preserves_public_error_and_diagnostic
          run_one rustfs-scanner scanner::tests::cycle_budget_publication::publication_lease_retries_local_channel_deadline_and_stops_on_cancel
