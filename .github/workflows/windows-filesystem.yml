name: Scanner admitted collector cycle preflight

on:
  workflow_dispatch:
    inputs:
      expected_head:
        description: Exact workflow commit SHA
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: scanner-admitted-collector-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: never
  CARGO_INCREMENTAL: '0'
  CARGO_BUILD_JOBS: '1'
  RUST_BACKTRACE: '0'
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'
  NO_PROXY: 127.0.0.1,localhost

jobs:
  scoped-test:
    runs-on: ubuntu-latest
    timeout-minutes: 110
    steps:
      - name: Prepare evidence
        shell: bash
        run: |
          set -euo pipefail
          evidence="$RUNNER_TEMP/scanner-admitted-collector"
          mkdir -p "$evidence"
          printf '%s\n' 'not-started' > "$evidence/build.exit"
          printf '%s\n' 'not-started' > "$evidence/test.exit"

      - name: Checkout
        uses: actions/checkout@f548e57e544e1ff5a4c46bf1e1b8685f8e4a348a
        with:
          fetch-depth: 5
          persist-credentials: false
          clean: false

      - name: Verify source and workflow
        shell: bash
        env:
          EXPECTED_HEAD: ${{ inputs.expected_head }}
        run: |
          set -euo pipefail
          evidence="$RUNNER_TEMP/scanner-admitted-collector"
          workflow_sha=$(git rev-parse HEAD)
          source_sha=$(git rev-parse HEAD^)
          test_sha=$(git rev-parse HEAD^^)
          combination_sha=$(git rev-parse HEAD^^^)
          main_sha=$(git rev-parse "${combination_sha}^2")
          source_tree=$(git rev-parse "${source_sha}^{tree}")
          test_diff=$(git diff --binary --full-index "$combination_sha" "$source_sha" | sha256sum | cut -d' ' -f1)
          fix_diff=$(git diff --binary --full-index "$test_sha" "$source_sha" | sha256sum | cut -d' ' -f1)
          source_files=$(git diff --name-only "$combination_sha" "$source_sha")
          workflow_files=$(git diff --name-only "$source_sha" "$workflow_sha")
          printf 'expected_head=%s\nhead=%s\nsource=%s\ntest_parent=%s\ncombination=%s\nmain=%s\nsource_tree=%s\ntest_diff=%s\nfix_diff=%s\nsource_files=%s\nworkflow_files=%s\n' \
            "$EXPECTED_HEAD" "$workflow_sha" "$source_sha" "$test_sha" "$combination_sha" "$main_sha" \
            "$source_tree" "$test_diff" "$fix_diff" "$source_files" "$workflow_files" | tee "$evidence/source-proof.txt"
          [[ "$GITHUB_EVENT_NAME" == 'workflow_dispatch' ]]
          [[ "$EXPECTED_HEAD" =~ ^[0-9a-f]{40}$ ]]
          [[ "$workflow_sha" == "$EXPECTED_HEAD" && "$workflow_sha" == "$GITHUB_SHA" ]]
          [[ "$source_sha" == '097f7603db1090f15e390e7e2cde316d148e395f' ]]
          [[ "$test_sha" == '7952608c03bf3d42a28909b0d9f861dd84a3264f' ]]
          [[ "$combination_sha" == '5ad283e28ffa0d16b82007c64df75901aaea5b21' ]]
          [[ "$main_sha" == '8e88419f3a0c4741073c5ea46dd43c434be7f138' ]]
          [[ "$source_tree" == '67db91a7d0556b8beaa5b903ca602c0981bf7434' ]]
          [[ "$test_diff" == '2687c156f166ee2dc38861140210b3063c7f4fc7df656b3e4e2a733b619e11a3' ]]
          [[ "$fix_diff" == 'a50801c7f457af9d3468d421dc1d14efec87be45f67d5af43abb59bc5707b6d6' ]]
          [[ "$source_files" == 'crates/scanner/src/scanner_io/tests/cycle_collector_diagnostics.rs' ]]
          [[ "$workflow_files" == '.github/workflows/windows-filesystem.yml' ]]
          [[ -z "$(git status --porcelain)" ]]
          printf '%s\n' \
            'One exact parent unit test starts one isolated child that checks complete, cancelled and competing-revision local cycles.' \
            'The successful child output is checked inside the parent and is not emitted as a separate log.' \
            'No rejected old coordinator RPC or MRF responsibility-release test is selected; normal storage background activity can occur.' \
            'This scoped preflight does not replace complete CI or distributed acceptance.' | tee "$evidence/scope.txt"
          df -h . | tee "$evidence/disk.txt"

      - name: Setup Rust
        uses: ./.github/actions/setup
        with:
          rust-version: stable
          cache-shared-key: ci-e2e-distributed-hosted
          cache-save-if: 'false'
          install-build-packaging-tools: 'false'
          install-test-tools: 'false'

      - name: Compile scanner library tests
        shell: bash
        timeout-minutes: 80
        run: |
          set -euo pipefail
          evidence="$RUNNER_TEMP/scanner-admitted-collector"
          set +e
          timeout --signal=TERM --kill-after=30s 75m \
            cargo test --locked -p rustfs-scanner --lib --no-run > "$evidence/build.log" 2>&1
          status=$?
          set -e
          printf '%s\n' "$status" > "$evidence/build.exit"
          tail -n 100 "$evidence/build.log"
          exit "$status"

      - name: Run the exact collector test
        shell: bash
        timeout-minutes: 10
        run: |
          set -euo pipefail
          evidence="$RUNNER_TEMP/scanner-admitted-collector"
          test_name='scanner_io::tests::cycle_collector_diagnostics::collector_cycle_with_node_admission_preserves_cache_and_reports_outcomes'
          printf '%s\n' "$test_name" > "$evidence/selection.txt"
          if [[ -v RUSTFS_TEST_ADMITTED_COLLECTOR_CHILD ]]; then
            printf '%s\n' 'Unexpected parent child marker' | tee "$evidence/environment.txt"
            exit 1
          fi
          printf '%s\n' 'parent_child_marker=unset' | tee "$evidence/environment.txt"
          set +e
          timeout --signal=TERM --kill-after=15s 8m \
            cargo test --locked -p rustfs-scanner --lib -- --exact "$test_name" --nocapture > "$evidence/test.log" 2>&1
          status=$?
          set -e
          printf '%s\n' "$status" > "$evidence/test.exit"
          tail -n 120 "$evidence/test.log"
          selected=$(grep -Fxc 'running 1 test' "$evidence/test.log" || true)
          passed=$(grep -Fxc "test $test_name ... ok" "$evidence/test.log" || true)
          summary=$(grep -Fc 'test result: ok. 1 passed; 0 failed; 0 ignored;' "$evidence/test.log" || true)
          printf 'exit=%s selected=%s passed=%s summary=%s\n' "$status" "$selected" "$passed" "$summary" | tee "$evidence/verification.txt"
          [[ "$status" -eq 0 && "$selected" -eq 1 && "$passed" -eq 1 && "$summary" -eq 1 ]]

      - name: Preserve evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: scanner-admitted-collector-${{ github.run_id }}
          path: ${{ runner.temp }}/scanner-admitted-collector/
          if-no-files-found: error
          retention-days: 14
