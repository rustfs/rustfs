name: Heal ownership interaction green
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  focused:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Checkout
        uses: actions/checkout@f548e57e544e1ff5a4c46bf1e1b8685f8e4a348a
        with:
          fetch-depth: 3
          persist-credentials: false
      - name: Verify source snapshot
        shell: bash
        run: |
          set -euo pipefail
          actual_head=$(git rev-parse HEAD)
          actual_source=$(git rev-parse HEAD^)
          actual_base=$(git rev-parse HEAD^^)
          actual_tree=$(git rev-parse 'HEAD^^{tree}')
          actual_diff=$(git diff --full-index --binary "$actual_base" "$actual_source" | sha256sum | cut -d' ' -f1)
          actual_files=$(git diff --name-only "$actual_source" "$actual_head")
          printf 'head %s source %s base %s tree %s diff %s files %s\n' "$actual_head" "$actual_source" "$actual_base" "$actual_tree" "$actual_diff" "$actual_files"
          [[ "$actual_head" == "$GITHUB_SHA" ]]
          [[ "$actual_source" == "baae8e72a062f131c81e4d71b28ccf4961c00089" ]]
          [[ "$actual_base" == "95386773a0f757c737cc479b1fb3233767efdc55" ]]
          [[ "$actual_tree" == "088b14f894f4cda660dedde31bb2ed490dabf170" ]]
          [[ "$actual_diff" == "481706c361582a9cd51d97cc5b5e1aa4e4f83c076586e36717ba19a2d34d2176" ]]
          [[ "$actual_files" == ".github/workflows/windows-filesystem.yml" ]]
      - name: Setup Rust
        uses: ./.github/actions/setup
        with:
          rust-version: stable
          cache-shared-key: ci-e2e-distributed-hosted
          cache-save-if: 'false'
          install-build-packaging-tools: 'false'
          install-test-tools: 'false'
      - name: Run the selected test
        shell: bash
        run: |
          set -euo pipefail
          export CARGO_TERM_COLOR=never CARGO_BUILD_JOBS=2 CARGO_PROFILE_TEST_DEBUG=0 CARGO_INCREMENTAL=0 RUST_BACKTRACE=0
          name="heal::manager::tests::admin_overlap::forced_id_conflict_preserves_scanner_queued_owner"
          log="$RUNNER_TEMP/interaction.log"
          set +e
          cargo test --locked -p rustfs-heal --lib "$name" -- --exact --test-threads=1 >"$log" 2>&1
          status=$?
          set -e
          tail -n 160 "$log"
          [[ "$status" -eq 0 ]]
          grep -Fxq 'running 1 test' "$log"
          grep -Fxq "test ${name} ... ok" "$log"
          grep -Fq 'test result: ok. 1 passed; 0 failed;' "$log"
          printf 'Confirmed combined interaction test passed\n'
