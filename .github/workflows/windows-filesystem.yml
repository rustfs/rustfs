# Temporary verification of the test-only diagnostic isolation prototype.
# Both sinks are in memory; this does not verify OTLP wire serialization.
name: TLS diagnostic isolation observation

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  isolation:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        include:
          - kind: red
            revision: 9cc6f43a9f6bd1ed8f6177ba408480bed49fc74e
            tree: 21a99e7ab9a9593fa739feb34898edaf76b71b57
          - kind: green
            revision: 64048df6e865dede7cbbff91367c700198280e35
            tree: 7cf6320949801c0edfe110185a8a2bca2009cc9a
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
      CARGO_INCREMENTAL: "0"
      CARGO_BUILD_JOBS: "2"
      CARGO_PROFILE_DEV_DEBUG: "0"
      CARGO_PROFILE_TEST_DEBUG: "0"
      CARGO_TERM_COLOR: never
      RUST_BACKTRACE: "0"
      CONTROL_TEST: telemetry::isolation_probe_tests::parent_none_alone_keeps_json_parent_and_otel_thread_context
      ISOLATION_TEST: telemetry::isolation_probe_tests::diagnostic_fixture_is_detached_for_both_sinks_and_restores_context
    steps:
      - name: Checkout fixed test source
        id: source
        uses: actions/checkout@f548e57e544e1ff5a4c46bf1e1b8685f8e4a348a # v7
        with:
          ref: ${{ matrix.revision }}
          clean: false
          persist-credentials: false

      - name: Verify source and create private evidence directories
        id: identity
        env:
          EXPECTED_REVISION: ${{ matrix.revision }}
          EXPECTED_TREE: ${{ matrix.tree }}
          TEST_KIND: ${{ matrix.kind }}
          WORKFLOW_REVISION: ${{ github.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_REVISION"
          test "$(git rev-parse 'HEAD^{tree}')" = "$EXPECTED_TREE"
          test -z "$(git status --porcelain=v1 --untracked-files=all)"
          umask 077
          mkdir "$RUNNER_TEMP/tls-isolation-private"
          mkdir "$RUNNER_TEMP/tls-isolation-evidence"
          python3 - <<'PY'
          import hashlib
          import json
          import os
          from pathlib import Path

          test = Path('crates/obs/src/telemetry/isolation_probe_tests.rs').read_bytes()
          identity = {
              'kind': os.environ['TEST_KIND'],
              'source_revision': os.environ['EXPECTED_REVISION'],
              'source_tree': os.environ['EXPECTED_TREE'],
              'workflow_revision': os.environ['WORKFLOW_REVISION'],
              'test_sha256': hashlib.sha256(test).hexdigest(),
          }
          output = Path(os.environ['RUNNER_TEMP'], 'tls-isolation-evidence', 'identity.json')
          output.write_text(json.dumps(identity, sort_keys=True) + '\n')
          PY

      - name: Install system dependencies
        id: dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential pkg-config libssl-dev ripgrep

      - name: Install protoc
        id: protoc
        uses: rustfs/setup-protoc@a3705324d8f9bf5b6c3573fb6cf8ae421db55dd6 # v3.0.1
        with:
          version: "35.1"
          repo-token: ${{ github.token }}

      - name: Install flatc
        id: flatc
        uses: Nugine/setup-flatc@698800de72a96bfb22cf60431dc21a2ff9a7e07b # v1
        with:
          version: "25.12.19"

      - name: Install Rust
        id: rust
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
        with:
          toolchain: stable

      - name: Record toolchain identity
        id: toolchain
        run: |
          python3 - <<'PY'
          import json
          import os
          import re
          import subprocess
          from pathlib import Path

          versions = {}
          for program in ('rustc', 'cargo'):
              version = subprocess.run([program, '--version'], check=True, capture_output=True, text=True).stdout.strip()
              if not re.fullmatch(program + r' [a-zA-Z0-9+(). _-]{1,120}', version):
                  raise SystemExit('Toolchain version format was unexpected; raw output withheld.')
              versions[program] = version
          output = Path(os.environ['RUNNER_TEMP'], 'tls-isolation-evidence', 'toolchain.json')
          output.write_text(json.dumps(versions, sort_keys=True) + '\n')
          PY

      - name: Compile the library test binary
        id: compile
        run: |
          set -euo pipefail
          if ! cargo test --locked -p rustfs-obs --lib --no-run >"$RUNNER_TEMP/tls-isolation-private/build.log" 2>&1; then
            echo "The library test binary did not compile; raw output withheld."
            exit 1
          fi

      - name: Run control and isolation assertions
        id: assertions
        env:
          TEST_KIND: ${{ matrix.kind }}
          EXPECTED_REVISION: ${{ matrix.revision }}
          EXPECTED_TREE: ${{ matrix.tree }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_REVISION"
          test "$(git rev-parse 'HEAD^{tree}')" = "$EXPECTED_TREE"
          test -z "$(git status --porcelain=v1 --untracked-files=all)"
          control_status=0
          cargo test --offline --locked -p rustfs-obs --lib "$CONTROL_TEST" -- --exact --color never >"$RUNNER_TEMP/tls-isolation-private/control.log" 2>&1 || control_status=$?
          isolation_status=0
          cargo test --offline --locked -p rustfs-obs --lib "$ISOLATION_TEST" -- --exact --color never >"$RUNNER_TEMP/tls-isolation-private/isolation.log" 2>&1 || isolation_status=$?
          test "$(git rev-parse HEAD)" = "$EXPECTED_REVISION"
          test "$(git rev-parse 'HEAD^{tree}')" = "$EXPECTED_TREE"
          test -z "$(git status --porcelain=v1 --untracked-files=all)"
          export CONTROL_STATUS="$control_status" ISOLATION_STATUS="$isolation_status"
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path

          root = Path(os.environ['RUNNER_TEMP'])
          limit = 16 * 1024 * 1024

          def inspect(name, test):
              path = root / 'tls-isolation-private' / name
              if not path.is_file():
                  return {'state': 'missing', 'selected': False, 'ok': False, 'failed': False, 'baggage_assertion': False}
              if path.stat().st_size > limit:
                  return {'state': 'truncated', 'selected': False, 'ok': False, 'failed': False, 'baggage_assertion': False}
              lines = path.read_text(encoding='utf-8', errors='replace').splitlines()
              return {
                  'state': 'available',
                  'selected': lines.count('running 1 test') == 1,
                  'ok': lines.count(f'test {test} ... ok') == 1,
                  'failed': lines.count(f'test {test} ... FAILED') == 1,
                  'baggage_assertion': lines.count('ambient baggage must be hidden') == 1,
              }

          control = inspect('control.log', os.environ['CONTROL_TEST'])
          isolation = inspect('isolation.log', os.environ['ISOLATION_TEST'])
          control_status = int(os.environ['CONTROL_STATUS'])
          isolation_status = int(os.environ['ISOLATION_STATUS'])
          control_ok = control['state'] == 'available' and control['selected'] and control['ok'] and control_status == 0
          if os.environ['TEST_KIND'] == 'red':
              isolation_ok = (isolation['state'] == 'available' and isolation['selected'] and isolation['failed']
                              and isolation['baggage_assertion'] and isolation_status == 101)
          else:
              isolation_ok = (os.environ['TEST_KIND'] == 'green' and isolation['state'] == 'available'
                              and isolation['selected'] and isolation['ok'] and not isolation['baggage_assertion']
                              and isolation_status == 0)
          result = {
              'kind': os.environ['TEST_KIND'],
              'control': control,
              'control_exit_code': control_status,
              'isolation': isolation,
              'isolation_exit_code': isolation_status,
              'expectation_met': control_ok and isolation_ok,
          }
          output = root / 'tls-isolation-evidence' / 'result.json'
          output.write_text(json.dumps(result, sort_keys=True) + '\n')
          if not result['expectation_met']:
              raise SystemExit('The test result did not match the expected assertion; raw output withheld.')
          print('The control and expected isolation outcome were observed.')
          PY

      - name: Record stage outcomes
        if: always()
        env:
          SOURCE: ${{ steps.source.outcome }}
          IDENTITY: ${{ steps.identity.outcome }}
          DEPENDENCIES: ${{ steps.dependencies.outcome }}
          PROTOC: ${{ steps.protoc.outcome }}
          FLATC: ${{ steps.flatc.outcome }}
          RUST: ${{ steps.rust.outcome }}
          TOOLCHAIN: ${{ steps.toolchain.outcome }}
          COMPILE: ${{ steps.compile.outcome }}
          ASSERTIONS: ${{ steps.assertions.outcome }}
        run: |
          umask 077
          mkdir -p "$RUNNER_TEMP/tls-isolation-evidence"
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path

          names = ('SOURCE', 'IDENTITY', 'DEPENDENCIES', 'PROTOC', 'FLATC', 'RUST', 'TOOLCHAIN', 'COMPILE', 'ASSERTIONS')
          allowed = {'success', 'failure', 'cancelled', 'skipped'}
          stages = {name.lower(): os.environ.get(name) if os.environ.get(name) in allowed else 'missing' for name in names}
          output = Path(os.environ['RUNNER_TEMP'], 'tls-isolation-evidence', 'stages.json')
          output.write_text(json.dumps(stages, sort_keys=True) + '\n')
          PY

      - name: Upload sanitized evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: tls-isolation-${{ matrix.kind }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/tls-isolation-evidence/
          retention-days: 7
          if-no-files-found: error
