name: FastLock targeted preflight

on:
  workflow_dispatch:
    inputs:
      expected_head:
        description: Exact workflow commit SHA
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: fast-lock-targeted-${{ github.run_id }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: never
  CARGO_INCREMENTAL: '0'
  CARGO_BUILD_JOBS: '2'
  CARGO_PROFILE_DEV_DEBUG: '0'
  CARGO_PROFILE_TEST_DEBUG: '0'
  RUST_BACKTRACE: '1'
  NO_PROXY: localhost,127.0.0.1,::1
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

jobs:
  targeted:
    runs-on: ubuntu-latest
    timeout-minutes: 130
    steps:
      - name: Prepare evidence
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/fast-lock-targeted"
          printf '%s\n' 'not-started' > "$RUNNER_TEMP/fast-lock-targeted/build.exit"

      - name: Checkout exact workflow commit
        uses: actions/checkout@f548e57e544e1ff5a4c46bf1e1b8685f8e4a348a
        with:
          fetch-depth: 3
          persist-credentials: false
          clean: false

      - name: Verify source and workflow scope
        env:
          EXPECTED_HEAD: ${{ inputs.expected_head }}
        run: |
          set -euo pipefail
          evidence="$RUNNER_TEMP/fast-lock-targeted"
          workflow_sha=$(git rev-parse HEAD)
          source_sha=$(git rev-parse 'HEAD^')
          base_sha=$(git rev-parse 'HEAD^^')
          source_tree=$(git rev-parse "$source_sha^{tree}")
          source_diff=$(git diff --binary --full-index "$base_sha" "$source_sha" | sha256sum | cut -d' ' -f1)
          source_files=$(git diff --name-only "$base_sha" "$source_sha")
          workflow_files=$(git diff --name-only "$source_sha" "$workflow_sha")
          printf 'expected_head=%s\nworkflow=%s\nsource=%s\nbase=%s\ntree=%s\nsource_diff=%s\nsource_files=%s\nworkflow_files=%s\n' \
            "$EXPECTED_HEAD" "$workflow_sha" "$source_sha" "$base_sha" "$source_tree" "$source_diff" \
            "$source_files" "$workflow_files" | tee "$evidence/source-proof.txt"
          [[ "$EXPECTED_HEAD" =~ ^[0-9a-f]{40}$ ]]
          [[ "$GITHUB_EVENT_NAME" == 'workflow_dispatch' ]]
          [[ "$EXPECTED_HEAD" == "$GITHUB_SHA" ]]
          [[ "$workflow_sha" == "$GITHUB_SHA" ]]
          [[ "$source_sha" == 'c802fe210dd01a66c9b917794c2bcf0184401cad' ]]
          [[ "$base_sha" == '56c80a566bac7fa1c0e74430b76ccb8db787aef9' ]]
          [[ "$source_tree" == '01b31f5c19e1f26653849fc77be74a9c5dc7e606' ]]
          [[ "$source_diff" == '307ba0219cf70e1dec215c4e466aca3287f59edf5f1eded39f31a1a961d2b570' ]]
          [[ "$source_files" == $'crates/lock/src/client/local.rs\ncrates/lock/src/fast_lock/guard.rs\ncrates/lock/src/fast_lock/manager.rs\ncrates/lock/src/fast_lock/shard.rs\ncrates/lock/src/fast_lock/state.rs' ]]
          [[ "$workflow_files" == '.github/workflows/windows-filesystem.yml' ]]
          [[ -z "$(git status --porcelain)" ]]

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8
        with:
          toolchain: stable

      - name: Check disk and toolchain
        run: |
          set -euo pipefail
          evidence="$RUNNER_TEMP/fast-lock-targeted"
          df -h "$GITHUB_WORKSPACE" | tee "$evidence/disk.txt"
          available_kib=$(df -Pk "$GITHUB_WORKSPACE" | awk 'NR == 2 {print $4}')
          [[ "$available_kib" =~ ^[0-9]+$ ]]
          [[ "$available_kib" -ge 8388608 ]]
          rustc --version | tee "$evidence/rustc.txt"
          cargo --version | tee "$evidence/cargo.txt"

      - name: Compile lock library tests
        timeout-minutes: 75
        run: |
          set -euo pipefail
          evidence="$RUNNER_TEMP/fast-lock-targeted"
          set +e
          timeout --signal=TERM --kill-after=30s 70m \
            cargo test --locked -p rustfs-lock --lib --no-run > "$evidence/build.log" 2>&1
          result=$?
          set -e
          printf '%s\n' "$result" > "$evidence/build.exit"
          tail -n 100 "$evidence/build.log"
          exit "$result"

      - name: Run exact local lock tests
        timeout-minutes: 50
        run: |
          set -euo pipefail
          evidence="$RUNNER_TEMP/fast-lock-targeted"
          tests=(
            'fast_lock::manager::tests::force_unlocked_exclusive_guard_drop_preserves_same_owner_successor'
            'fast_lock::manager::tests::force_unlocked_exclusive_guard_release_preserves_same_owner_successor'
            'fast_lock::manager::tests::force_unlock_releases_all_shared_guards_of_same_owner'
            'fast_lock::manager::tests::force_unlocked_shared_guards_drop_preserves_same_owner_successor'
            'fast_lock::manager::tests::force_unlocked_shared_guards_release_preserves_same_owner_successor'
            'client::local::tests::force_before_lease_publication_does_not_report_acquisition'
            'client::local::tests::force_revoked_lease_cannot_be_refreshed_or_reported_held'
            'fast_lock::tests::fast_lock_tests::test_basic_write_lock_acquire_release'
            'fast_lock::tests::fast_lock_tests::test_basic_read_lock_acquire_release'
            'client::local::tests::lease_snapshot_tracks_refresh_without_resetting_acquisition_time'
            'client::local::tests::refresh_after_expiry_releases_guard_without_reviving_it'
            'fast_lock::shard::tests::force_waits_for_tracked_holder_and_registration_commit'
            'fast_lock::shard::tests::stale_numeric_release_does_not_release_reacquired_holder'
            'fast_lock::shard::tests::in_flight_weak_numeric_release_does_not_release_successor'
            'fast_lock::shard::tests::in_flight_weak_release_preserves_replacement_tracked_registration'
            'fast_lock::shard::tests::in_flight_weak_release_preserves_reregistered_raw_holder'
            'fast_lock::shard::tests::tracked_revocation_preserves_a_replacement_weak_registration'
            'fast_lock::shard::tests::raw_and_weak_release_prefer_raw_shared_holder'
            'fast_lock::shard::tests::releasing_one_token_preserves_a_different_token_with_the_same_numeric_id'
            'fast_lock::shard::tests::raw_batch_failure_rolls_back_a_previously_acquired_lock'
            'fast_lock::shard::tests::failed_raw_batch_does_not_release_a_reacquired_holder'
            'fast_lock::shard::tests::cancelling_raw_batch_releases_its_holders_and_waiter'
            'fast_lock::shard::tests::pooled_state_does_not_revive_a_forced_guard'
            'fast_lock::shard::tests::release_wakes_can_reenter_the_shard'
          )
          printf '%s\n' "${tests[@]}" > "$evidence/selection.txt"
          [[ "${#tests[@]}" -eq 24 ]]
          failures=0
          for test_name in "${tests[@]}"; do
            file_name=${test_name//::/_}
            log="$evidence/$file_name.log"
            set +e
            timeout --signal=TERM --kill-after=10s 2m \
              cargo test --locked -p rustfs-lock --lib -- --exact "$test_name" --test-threads=1 > "$log" 2>&1
            result=$?
            set -e
            printf '%s\n' "$result" > "$evidence/$file_name.exit"
            printf 'test=%s exit=%s\n' "$test_name" "$result"
            tail -n 50 "$log"
            if [[ "$result" -ne 0 ]] \
              || [[ "$(grep -Fxc 'running 1 test' "$log" || true)" != '1' ]] \
              || [[ "$(grep -Fxc "test $test_name ... ok" "$log" || true)" != '1' ]] \
              || [[ "$(grep -Ec '^test result: ok\. 1 passed; 0 failed; 0 ignored; 0 measured; [0-9]+ filtered out;' "$log" || true)" != '1' ]]; then
              printf 'Unexpected test result: %s\n' "$test_name"
              failures=$((failures + 1))
            fi
          done
          printf '%s\n' "$failures" > "$evidence/failures.txt"
          [[ "$failures" -eq 0 ]]

      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: fast-lock-targeted-evidence
          path: ${{ runner.temp }}/fast-lock-targeted/
          if-no-files-found: warn
