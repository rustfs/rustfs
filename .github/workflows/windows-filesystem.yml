name: Scanner Candidate Group Red Preflight

on:
  workflow_dispatch:
    inputs:
      expected_head:
        description: Full SHA of this workflow commit
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: scanner-candidate-group-red-${{ github.ref }}
  cancel-in-progress: false

# Eight expected baseline failures and one passing control use only in-memory
# observation fixtures. They do not validate the fix, full CI, G, RPC or MRF.
jobs:
  scoped:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      CARGO_TERM_COLOR: never
      CARGO_BUILD_JOBS: '2'
      CARGO_INCREMENTAL: '0'
      CARGO_PROFILE_DEV_DEBUG: '0'
      CARGO_PROFILE_TEST_DEBUG: '0'
      RUST_BACKTRACE: '0'
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'
      NO_PROXY: 127.0.0.1,localhost
    steps:
      - name: Checkout candidate
        uses: actions/checkout@f548e57e544e1ff5a4c46bf1e1b8685f8e4a348a # v7
        with:
          fetch-depth: 10
          persist-credentials: false

      - name: Verify exact baseline and test snapshot
        shell: bash
        env:
          EXPECTED_HEAD: ${{ inputs.expected_head }}
          LOG_DIR: ${{ runner.temp }}/scanner-group-red
        run: |
          set -euo pipefail
          [[ ! -e "$LOG_DIR" ]]
          mkdir "$LOG_DIR"
          head=$(git rev-parse HEAD)
          workflow_parent=$(git rev-parse "${head}^")
          source=$(git rev-parse '3a3cd5bbdc2d76ddd2a5540bfe7565c4b1afbca2^{commit}')
          parent=$(git rev-parse "${source}^")
          base=$(git rev-parse "${source}~5")
          tree=$(git rev-parse "${source}^{tree}")
          parent_tree=$(git rev-parse "${parent}^{tree}")
          test_blob=$(git rev-parse "${source}:crates/scanner/src/heal_completion/tests.rs")
          production_blob=$(git rev-parse "${source}:crates/scanner/src/heal_completion.rs")
          base_production_blob=$(git rev-parse "${base}:crates/scanner/src/heal_completion.rs")
          last_diff=$(git diff --full-index --binary "$parent" "$source" | sha256sum | cut -d' ' -f1)
          test_diff=$(git diff --full-index --binary "$base" "$source" | sha256sum | cut -d' ' -f1)
          test_files=$(git diff --name-only "$base" "$source")
          workflow_files=$(git diff --name-only "$source" "$head")
          printf 'head=%s workflow_parent=%s source=%s parent=%s base=%s tree=%s parent_tree=%s test_blob=%s production_blob=%s last_diff=%s test_diff=%s\n' \
            "$head" "$workflow_parent" "$source" "$parent" "$base" "$tree" "$parent_tree" "$test_blob" "$production_blob" "$last_diff" "$test_diff" | tee "$LOG_DIR/snapshot.txt"
          printf 'test_files=%s workflow_files=%s\n' "$test_files" "$workflow_files" | tee -a "$LOG_DIR/snapshot.txt"
          [[ "$EXPECTED_HEAD" =~ ^[0-9a-f]{40}$ ]]
          [[ "$head" == "$EXPECTED_HEAD" && "$head" == "$GITHUB_SHA" ]]
          [[ "$workflow_parent" == "$source" ]]
          [[ "$source" == 3a3cd5bbdc2d76ddd2a5540bfe7565c4b1afbca2 ]]
          [[ "$parent" == 5608495e0e526c05a40fe5add985a4f7db1e62bc ]]
          [[ "$base" == 8605f3d3d183e2d98a4b31fe87d39f8439d1b0f4 ]]
          [[ "$tree" == 96f407f21b088a0d3fc054f907fb8151e655025e ]]
          [[ "$parent_tree" == 17e7d51b49412aff1b957913f1d9671f3b6707fe ]]
          [[ "$test_blob" == 1e2e77a1a16afc5cef7f749f60e72ff5ab9a9367 ]]
          [[ "$production_blob" == 51e51f7bfaa03ec8e1d0efdfdd5847b1130c9f13 && "$production_blob" == "$base_production_blob" ]]
          [[ "$last_diff" == 77721d72e4e0c505180fc3015a8127a29239aa212228a594555f8fbe0f06ccee ]]
          [[ "$test_diff" == 935f81f7c3546e44083e2845f08423a35efaafb7ed8e68f468f1edccbb7352da ]]
          [[ "$test_files" == crates/scanner/src/heal_completion/tests.rs ]]
          [[ "$workflow_files" == .github/workflows/windows-filesystem.yml ]]
          [[ -z "$(git status --porcelain)" ]]

      - name: Setup Rust
        uses: ./.github/actions/setup
        with:
          rust-version: stable
          cache-shared-key: scanner-group-red-8605-hosted
          cache-save-if: 'false'
          install-build-packaging-tools: 'false'
          install-test-tools: 'false'

      - name: Run one passing control and eight expected failures
        shell: bash
        env:
          LOG_DIR: ${{ runner.temp }}/scanner-group-red
        run: |
          set -euo pipefail
          [[ -d "$LOG_DIR" && -f "$LOG_DIR/snapshot.txt" ]]
          rustc --version --verbose | tee "$LOG_DIR/rustc-version.log"
          cargo --version --verbose | tee "$LOG_DIR/cargo-version.log"
          toolchain=$(rustup show active-toolchain)
          printf '%s\n' "$toolchain" | tee "$LOG_DIR/rustup-version.log"
          [[ "$toolchain" == stable-* ]]
          tests=(
            'heal_completion::tests::mixed_candidate_semantics_settle_independently_in_either_order|RED_GROUP_MIXED_SCOPE|100'
            'heal_completion::tests::candidate_group_capacity_is_global_and_released_by_completion|RED_GROUP_GLOBAL_CAPACITY|135'
            'heal_completion::tests::candidate_group_expiry_and_notification_loss_are_independent|RED_GROUP_EXPIRY_WITH_LOSS|174'
            'heal_completion::tests::candidate_group_expiry_uses_earliest_discovery_not_admission_order|RED_GROUP_FIRST_EARLIEST_EXPIRY|203'
            'heal_completion::tests::later_candidate_group_also_expires_from_earliest_discovery|RED_GROUP_ADDITIONAL_EARLIEST_EXPIRY|226'
            'heal_completion::tests::candidate_expiry_is_enforced_when_terminal_arrives_between_ticks|RED_GROUP_TERMINAL_EXPIRY|251'
            'heal_completion::tests::expired_candidate_is_unknown_even_if_terminal_was_seen_first|RED_GROUP_EXPIRED_ADMISSION|273'
            'heal_completion::tests::grouped_pending_status_counts_candidates_after_partial_expiry|RED_GROUP_STATUS_AFTER_EXPIRY|312'
          )
          control=heal_completion::tests::observation_id_keeps_grouped_owner_generations_separate
          printf '%s\n' "${tests[@]}" >"$LOG_DIR/selected-red.txt"
          printf '%s\n' "$control" >"$LOG_DIR/selected-control.txt"
          unique_names=$(printf '%s\n' "${tests[@]}" | cut -d'|' -f1 | sort -u | wc -l | tr -d '[:space:]')
          unique_markers=$(printf '%s\n' "${tests[@]}" | cut -d'|' -f2 | sort -u | wc -l | tr -d '[:space:]')
          [[ "${#tests[@]}" -eq 8 && "$unique_names" -eq 8 && "$unique_markers" -eq 8 ]]
          python3 - "$LOG_DIR/selected-red.txt" "$control" <<'PY'
          from pathlib import Path
          import re
          import sys

          source = Path('crates/scanner/src/heal_completion/tests.rs').read_text()
          lines = source.splitlines()
          for item in Path(sys.argv[1]).read_text().splitlines():
              name, marker, line_text = item.split('|')
              symbol = name.rsplit('::', 1)[-1]
              declarations = list(re.finditer(rf'#\[test\]\s*fn\s+{re.escape(symbol)}\s*\(', source))
              assert len(declarations) == 1, name
              assert source.count(marker) == 1, marker
              line = int(line_text)
              start = source.count('\n', 0, declarations[0].start()) + 1
              following = re.search(r'#\[test\]\s*fn\s+', source[declarations[0].end():])
              end = source.count('\n', 0, declarations[0].end() + following.start()) + 1 if following else len(lines) + 1
              assert start < line < end, (name, line)
              assert lines[line - 1].lstrip().startswith(('assert!(', 'assert_eq!(')), (name, line)
              assert marker in '\n'.join(lines[line - 1:line + 4]), (name, marker, line)
          control = sys.argv[2].rsplit('::', 1)[-1]
          assert len(re.findall(rf'#\[test\]\s*fn\s+{re.escape(control)}\s*\(', source)) == 1, control
          PY
          validate_control() {
            local status="$1" log="$2" name="$3"
            if (( status != 0 )); then return "$status"; fi
            awk -v name="$name" '
              $0 == "running 1 test" { runs++ }
              index($0, "test " name " ...") == 1 {
                suffix = substr($0, length("test " name " ...") + 1)
                if (suffix == "" || suffix ~ /^[[:space:]]/) names++
              }
              /^test result: ok[.] 1 passed; 0 failed; 0 ignored; [0-9]+ measured; [0-9]+ filtered out; finished in / { passed++ }
              END {
                printf "Control markers: running=%d named=%d passed=%d\n", runs, names, passed
                if (runs != 1 || names != 1 || passed != 1) exit 1
              }
            ' "$log"
          }
          validate_red() {
            local status="$1" log="$2" name="$3" marker="$4" expected_line="$5"
            (( status == 101 )) || return 1
            awk -v name="$name" -v marker="$marker" -v expected_line="$expected_line" '
              $0 == "running 1 test" { runs++ }
              index($0, "test " name " ...") == 1 {
                suffix = substr($0, length("test " name " ...") + 1)
                if (suffix == "" || suffix ~ /^[[:space:]]/) names++
              }
              /^test result: FAILED[.] 0 passed; 1 failed; 0 ignored; [0-9]+ measured; [0-9]+ filtered out; finished in / { failed++ }
              /^thread .* panicked at / {
                panics++
                expected_thread = "thread \047" name "\047"
                expected_location = "crates/scanner/src/heal_completion/tests.rs:" expected_line ":"
                tail = substr($0, length(expected_thread) + 1)
                split_at = index(tail, " panicked at ")
                thread_id = substr(tail, 1, split_at - 1)
                location = substr(tail, split_at + length(" panicked at "))
                column = substr(location, length(expected_location) + 1)
                target = index($0, expected_thread) == 1 && split_at > 0 && (thread_id == "" || thread_id ~ /^ [(][0-9]+[)]$/) && index(location, expected_location) == 1 && column ~ /^[0-9]+:$/
                if (target) target_panics++
              }
              /RED_GROUP_/ {
                rest = $0
                while (match(rest, /RED_GROUP_[A-Z_]+/)) {
                  word = substr(rest, RSTART, RLENGTH)
                  markers++
                  if (target && word == marker) target_markers++
                  rest = substr(rest, RSTART + RLENGTH)
                }
              }
              END {
                printf "Red markers: running=%d named=%d failed=%d panics=%d target=%d markers=%d matched=%d\n", runs, names, failed, panics, target_panics, markers, target_markers
                if (runs != 1 || names != 1 || failed != 1 || panics != 1 || target_panics != 1 || markers != 1 || target_markers != 1) exit 1
              }
            ' "$log"
          }
          check_disk() {
            local available
            df -h . | tee -a "$LOG_DIR/disk.log"
            available=$(df -Pk . | awk 'NR == 2 {print $4}')
            [[ "$available" =~ ^[0-9]+$ ]]
            if (( available < 4194304 )); then
              echo 'not_started: insufficient disk' | tee -a "$LOG_DIR/disk.log"
              return 1
            fi
          }
          run_one() {
            local name="$1" short status
            short="${name##*::}"
            check_disk
            set +e
            cargo test --locked -p rustfs-scanner --lib -- "$name" --exact --test-threads=1 >"$LOG_DIR/$short.log" 2>&1
            status=$?
            set -e
            printf '%s\n' "$status" >"$LOG_DIR/$short.exit"
            cat "$LOG_DIR/$short.log"
          }
          run_one "$control"
          control_short="${control##*::}"
          control_status=$(cat "$LOG_DIR/$control_short.exit")
          validate_control "$control_status" "$LOG_DIR/$control_short.log" "$control" | tee "$LOG_DIR/$control_short.validation"
          matched=0
          mismatched=0
          for item in "${tests[@]}"; do
            IFS='|' read -r name marker line <<< "$item"
            short="${name##*::}"
            run_one "$name"
            status=$(cat "$LOG_DIR/$short.exit")
            if validate_red "$status" "$LOG_DIR/$short.log" "$name" "$marker" "$line" >"$LOG_DIR/$short.validation"; then
              matched=$((matched + 1))
            else
              mismatched=$((mismatched + 1))
              if ! grep -Fxq 'running 1 test' "$LOG_DIR/$short.log"; then
                echo "Stopping: test execution did not start for $name" >&2
                cat "$LOG_DIR/$short.validation"
                break
              fi
            fi
            cat "$LOG_DIR/$short.validation"
          done
          printf 'expected_red=8 matched=%s mismatched=%s\n' "$matched" "$mismatched"
          [[ "$matched" -eq 8 && "$mismatched" -eq 0 ]]

      - name: Upload raw logs, status codes and selection
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: scanner-group-red-${{ github.run_id }}
          path: ${{ runner.temp }}/scanner-group-red/
          retention-days: 7
          if-no-files-found: warn
