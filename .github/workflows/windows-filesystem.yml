# Temporary, manual-only verification of the test-only isolation fixture.
# The exporter is in memory; no OTLP wire serialization is exercised.
name: TLS diagnostic overlap isolation preflight

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  isolation:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
      CARGO_INCREMENTAL: "0"
      CARGO_BUILD_JOBS: "2"
      CARGO_PROFILE_DEV_DEBUG: "0"
      CARGO_PROFILE_TEST_DEBUG: "0"
      CARGO_TERM_COLOR: never
      RUST_BACKTRACE: "0"
      CARGO_TARGET_DIR: ${{ github.workspace }}/target
      EXPECTED_REVISION: a577526778f252dd1a8afeb1368657cb27107aae
      EXPECTED_TREE: b1902264b4b4a55e6af6cdecad1e13c934358f60
    steps:
      - name: Checkout fixed source
        id: source
        uses: actions/checkout@f548e57e544e1ff5a4c46bf1e1b8685f8e4a348a # v7
        with:
          ref: a577526778f252dd1a8afeb1368657cb27107aae
          clean: false
          persist-credentials: false

      - name: Verify source and prepare private output
        id: identity
        env:
          WORKFLOW_REVISION: ${{ github.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_REVISION"
          test "$(git rev-parse 'HEAD^{tree}')" = "$EXPECTED_TREE"
          test -z "$(git status --porcelain=v1 --untracked-files=all)"
          umask 077
          mkdir "$RUNNER_TEMP/tls-async-private"
          mkdir "$RUNNER_TEMP/tls-async-evidence"
          python3 - <<'PY'
          import hashlib
          import json
          import os
          import sys
          from pathlib import Path

          sys.excepthook = lambda *_: print('Source identity unavailable; raw output withheld.', file=sys.stderr)
          source = Path('crates/obs/src/telemetry/isolation_probe_tests.rs').read_bytes()
          identity = {
              'source_revision': os.environ['EXPECTED_REVISION'],
              'source_tree': os.environ['EXPECTED_TREE'],
              'workflow_revision': os.environ['WORKFLOW_REVISION'],
              'test_sha256': hashlib.sha256(source).hexdigest(),
          }
          output = Path(os.environ['RUNNER_TEMP'], 'tls-async-evidence', 'identity.json')
          output.write_text(json.dumps(identity, sort_keys=True) + '\n')
          PY

      - name: Install system dependencies
        id: dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential pkg-config libssl-dev ripgrep

      - name: Install protoc
        id: protoc
        uses: rustfs/setup-protoc@a3705324d8f9bf5b6c3573fb6cf8ae421db55dd6 # v3.0.1
        with:
          version: "35.1"
          repo-token: ${{ github.token }}

      - name: Install flatc
        id: flatc
        uses: Nugine/setup-flatc@698800de72a96bfb22cf60431dc21a2ff9a7e07b # v1
        with:
          version: "25.12.19"

      - name: Install Rust
        id: rust
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
        with:
          toolchain: stable

      - name: Record toolchain identity
        id: toolchain
        run: |
          python3 - <<'PY'
          import json
          import os
          import re
          import subprocess
          import sys
          from pathlib import Path

          sys.excepthook = lambda *_: print('Toolchain identity unavailable; raw output withheld.', file=sys.stderr)
          versions = {}
          for program in ('rustc', 'cargo'):
              version = subprocess.run([program, '--version'], check=True, capture_output=True, text=True).stdout.strip()
              if not re.fullmatch(program + r' [a-zA-Z0-9+(). _-]{1,120}', version):
                  raise SystemExit('Unexpected toolchain version; raw output withheld.')
              versions[program] = version
          output = Path(os.environ['RUNNER_TEMP'], 'tls-async-evidence', 'toolchain.json')
          output.write_text(json.dumps(versions, sort_keys=True) + '\n')
          PY

      - name: Compile the library test binary
        id: compile
        run: |
          set -euo pipefail
          if ! cargo test --locked -p rustfs-obs --lib --no-run --message-format=json >"$RUNNER_TEMP/tls-async-private/build.jsonl" 2>"$RUNNER_TEMP/tls-async-private/build.log"; then
            echo "The library test binary did not compile; raw output withheld."
            exit 1
          fi

      - name: Run the two named isolation tests
        id: assertions
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_REVISION"
          test "$(git rev-parse 'HEAD^{tree}')" = "$EXPECTED_TREE"
          test -z "$(git status --porcelain=v1 --untracked-files=all)"
          python3 - <<'PY'
          import hashlib
          import json
          import os
          import subprocess
          import sys
          from pathlib import Path

          sys.excepthook = lambda *_: print('Preflight evidence unavailable; raw output withheld.', file=sys.stderr)
          prefix = 'telemetry::isolation_probe_tests::async_isolation::'
          cases = (
              ('overlap', prefix + 'isolated_scopes_overlap_with_distinct_per_poll_contexts'),
              ('migration', prefix + 'pending_future_migrates_and_restores_each_thread_context'),
          )
          root = Path(os.environ['RUNNER_TEMP'])
          private = root / 'tls-async-private'
          evidence = root / 'tls-async-evidence'
          build = private / 'build.jsonl'
          if not build.is_file() or build.stat().st_size > 256 * 1024 * 1024:
              raise SystemExit('Build output unavailable or too large; raw output withheld.')
          binaries = set()
          with build.open(encoding='utf-8') as lines:
              for line in lines:
                  if len(line) > 2 * 1024 * 1024:
                      raise SystemExit('Build output record too large; raw output withheld.')
                  try:
                      value = json.loads(line)
                  except ValueError:
                      raise SystemExit('Build output was not valid JSON; raw output withheld.')
                  if value.get('reason') != 'compiler-artifact':
                      continue
                  target = value.get('target', {})
                  profile = value.get('profile', {})
                  executable = value.get('executable')
                  if (target.get('name') == 'rustfs_obs' and 'lib' in target.get('kind', [])
                          and profile.get('test') is True and isinstance(executable, str)):
                      binaries.add(executable)
          if len(binaries) != 1:
              raise SystemExit('Expected one library test binary; raw output withheld.')
          binary = Path(next(iter(binaries))).resolve(strict=True)
          target_root = Path(os.environ['CARGO_TARGET_DIR']).resolve(strict=True)
          if not binary.is_file() or not binary.is_relative_to(target_root):
              raise SystemExit('Test binary identity was unavailable; raw output withheld.')

          def digest(path):
              hasher = hashlib.sha256()
              with path.open('rb') as handle:
                  for block in iter(lambda: handle.read(1024 * 1024), b''):
                      hasher.update(block)
              return hasher.hexdigest()

          binary_sha256 = digest(binary)
          binary_size = binary.stat().st_size
          results = []
          for index, (label, name) in enumerate(cases):
              output = private / f'test-{index}.log'
              command = ['cargo', 'test', '--offline', '--locked', '-p', 'rustfs-obs', '--lib', name,
                         '--', '--exact', '--color', 'never']
              try:
                  with output.open('wb') as handle:
                      completed = subprocess.run(command, stdout=handle, stderr=subprocess.STDOUT, timeout=120, check=False)
              except subprocess.TimeoutExpired:
                  results.append({'case': label, 'state': 'timeout', 'exit_code': None, 'selected': False, 'passed': False})
                  break
              if not output.is_file():
                  results.append({'case': label, 'state': 'missing', 'exit_code': completed.returncode, 'selected': False, 'passed': False})
                  continue
              if output.stat().st_size > 16 * 1024 * 1024:
                  results.append({'case': label, 'state': 'truncated', 'exit_code': completed.returncode, 'selected': False, 'passed': False})
                  continue
              lines = output.read_text(encoding='utf-8', errors='replace').splitlines()
              selected = lines.count('running 1 test') == 1
              passed = lines.count(f'test {name} ... ok') == 1
              results.append({'case': label, 'state': 'available', 'exit_code': completed.returncode,
                              'selected': selected, 'passed': passed})
          binary_unchanged = binary.is_file() and binary.stat().st_size == binary_size and digest(binary) == binary_sha256
          accepted = (len(results) == len(cases) and binary_unchanged
                      and all(item['state'] == 'available' and item['exit_code'] == 0
                              and item['selected'] and item['passed'] for item in results))
          report = {'binary_sha256': binary_sha256, 'binary_size': binary_size, 'binary_unchanged': binary_unchanged,
                    'expected_cases': len(cases), 'cases': results, 'expectation_met': accepted}
          (evidence / 'results.json').write_text(json.dumps(report, sort_keys=True) + '\n')
          if not accepted:
              raise SystemExit('Isolation assertions did not all pass; raw output withheld.')
          print('Both exact isolation tests passed.')
          PY
          test "$(git rev-parse HEAD)" = "$EXPECTED_REVISION"
          test "$(git rev-parse 'HEAD^{tree}')" = "$EXPECTED_TREE"
          test -z "$(git status --porcelain=v1 --untracked-files=all)"

      - name: Record stage outcomes
        if: always()
        env:
          SOURCE: ${{ steps.source.outcome }}
          IDENTITY: ${{ steps.identity.outcome }}
          DEPENDENCIES: ${{ steps.dependencies.outcome }}
          PROTOC: ${{ steps.protoc.outcome }}
          FLATC: ${{ steps.flatc.outcome }}
          RUST: ${{ steps.rust.outcome }}
          TOOLCHAIN: ${{ steps.toolchain.outcome }}
          COMPILE: ${{ steps.compile.outcome }}
          ASSERTIONS: ${{ steps.assertions.outcome }}
        run: |
          umask 077
          mkdir -p "$RUNNER_TEMP/tls-async-evidence"
          python3 - <<'PY'
          import json
          import os
          import sys
          from pathlib import Path

          sys.excepthook = lambda *_: print('Stage evidence unavailable; raw output withheld.', file=sys.stderr)
          names = ('SOURCE', 'IDENTITY', 'DEPENDENCIES', 'PROTOC', 'FLATC', 'RUST', 'TOOLCHAIN', 'COMPILE', 'ASSERTIONS')
          allowed = {'success', 'failure', 'cancelled', 'skipped'}
          stages = {name.lower(): os.environ.get(name) if os.environ.get(name) in allowed else 'missing' for name in names}
          output = Path(os.environ['RUNNER_TEMP'], 'tls-async-evidence', 'stages.json')
          output.write_text(json.dumps(stages, sort_keys=True) + '\n')
          PY

      - name: Upload sanitized evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: tls-async-isolation-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/tls-async-evidence/
          retention-days: 7
          if-no-files-found: error
