name: Scanner canonical receipt candidate

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-candidate:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Checkout
        uses: actions/checkout@f548e57e544e1ff5a4c46bf1e1b8685f8e4a348a # v7
        with:
          fetch-depth: 3
          persist-credentials: false

      - name: Check the source snapshot
        shell: bash
        run: |
          set -euo pipefail
          expected_base=d88f524d9ff071300dde4aab1c9af1fd45a82426
          expected_source=e371b8aaa6d0e1436795c1415eaaba037717f99d
          expected_diff_sha=1d7cee2ba7cc9b1add5ff76e07c209a80dd43ed0bc164b2a1e425bda941e6955
          if actual_head=$(git rev-parse --verify HEAD 2>/dev/null); then :; else actual_head=unavailable; fi
          if actual_source=$(git rev-parse --verify HEAD^ 2>/dev/null); then :; else actual_source=unavailable; fi
          if actual_base=$(git rev-parse --verify HEAD^^ 2>/dev/null); then :; else actual_base=unavailable; fi
          if git diff --full-index --binary "$actual_base" "$actual_source" >"$RUNNER_TEMP/source.diff" 2>/dev/null; then
            actual_diff_sha=$(sha256sum "$RUNNER_TEMP/source.diff" | cut -d' ' -f1)
          else
            actual_diff_sha=unavailable
          fi
          if actual_files=$(git diff --name-only "$actual_source" "$actual_head" 2>/dev/null); then :; else actual_files=unavailable; fi
          printf 'HEAD: %s\nparent: %s\nbase: %s\nfull-index diff SHA-256: %s\nworkflow files:\n%s\n' \
            "$actual_head" "$actual_source" "$actual_base" "$actual_diff_sha" "$actual_files"
          [[ "$actual_head" == "$GITHUB_SHA" ]] || { printf 'Unexpected workflow HEAD\n' >&2; exit 1; }
          [[ "$actual_source" == "$expected_source" ]] || { printf 'Unexpected source parent\n' >&2; exit 1; }
          [[ "$actual_base" == "$expected_base" ]] || { printf 'Unexpected base\n' >&2; exit 1; }
          [[ "$actual_diff_sha" == "$expected_diff_sha" ]] || { printf 'Unexpected source diff\n' >&2; exit 1; }
          [[ "$actual_files" == '.github/workflows/windows-filesystem.yml' ]] || { printf 'Unexpected workflow files\n' >&2; exit 1; }
          printf 'Verified the source snapshot\n'

      - name: Setup Rust
        uses: ./.github/actions/setup
        with:
          rust-version: stable
          cache-shared-key: ci-e2e-distributed-hosted
          cache-save-if: 'false'
          install-build-packaging-tools: 'false'
          install-test-tools: 'false'

      - name: Verify the twelve focused tests
        shell: bash
        run: |
          set -euo pipefail
          export CARGO_TERM_COLOR=never
          export CARGO_BUILD_JOBS=2
          export CARGO_PROFILE_TEST_DEBUG=0
          export CARGO_INCREMENTAL=0
          export RUST_BACKTRACE=0
          tests=(
            scanner_receipt_tracks_queued_owner_after_normal_dequeue
            scanner_receipt_tracks_queued_owner_after_fair_dequeue
            scanner_receipt_keeps_queued_owner_when_a_different_forced_task_runs
            scanner_receipt_reselects_after_the_queued_owner_is_cancelled
            scanner_receipt_reselects_after_multiple_forced_dequeues
            scanner_owner_index_survives_a_single_remaining_holder_and_new_forced_work
            scanner_owner_index_distinguishes_holders_with_the_same_request_id
            scanner_owner_index_tracks_bulk_removal_and_key_release
            scanner_owner_index_tracks_displacement_without_changing_legacy_reselection
            scanner_receipt_rejects_a_missing_or_empty_holder_index
            scanner_and_legacy_owners_keep_their_distinct_reselection_orders
            scanner_owner_index_tracks_a_series_of_forced_holders
          )
          for test in "${tests[@]}"; do
            name="heal::manager::tests::queued_representative::${test}"
            log="${RUNNER_TEMP}/${test}.log"
            set +e
            cargo test --locked -p rustfs-heal --lib "$name" -- --exact --test-threads=1 >"$log" 2>&1
            status=$?
            set -e
            tail -n 160 "$log"
            if [[ "$status" -ne 0 ]] ||
              ! grep -Fxq 'running 1 test' "$log" ||
              ! grep -Fxq "test ${name} ... ok" "$log" ||
              ! grep -Fq 'test result: ok. 1 passed; 0 failed;' "$log"; then
              printf 'Expected exactly one passing test for %s (cargo exit %s)\n' "$name" "$status" >&2
              exit 1
            fi
            printf 'Confirmed exactly one passing test for %s\n' "$name"
          done
          printf 'All twelve focused tests passed individually\n'
