name: TLS read observation unit checks
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: tls-fixed-sink-units-${{ github.ref }}
  cancel-in-progress: false
env:
  CARGO_TERM_COLOR: never
  CARGO_INCREMENTAL: '0'
  CARGO_BUILD_JOBS: '2'
  CARGO_PROFILE_TEST_DEBUG: '0'
  RUST_BACKTRACE: '0'
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'
  NO_PROXY: 127.0.0.1,localhost
jobs:
  scoped-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Checkout
        uses: actions/checkout@f548e57e544e1ff5a4c46bf1e1b8685f8e4a348a
        with:
          fetch-depth: 3
          persist-credentials: false
          clean: false
      - name: Verify source snapshot
        shell: bash
        run: |
          set -euo pipefail
          workflow_sha=$(git rev-parse HEAD)
          source_sha=$(git rev-parse HEAD^)
          base_sha=$(git rev-parse HEAD^^)
          source_tree=$(git rev-parse "$source_sha^{tree}")
          source_diff=$(git diff --full-index --binary "$base_sha" "$source_sha" | sha256sum | cut -d' ' -f1)
          workflow_files=$(git diff --name-only "$source_sha" "$workflow_sha")
          printf 'head=%s source=%s base=%s tree=%s diff=%s\n' "$workflow_sha" "$source_sha" "$base_sha" "$source_tree" "$source_diff"
          [[ "$workflow_sha" == "$GITHUB_SHA" ]]
          [[ "$source_sha" == '7d3f077072e43ff1ae1844a14c09dec623107f69' ]]
          [[ "$base_sha" == 'fedc9666123076f2b985d75a9c290f6496ef8717' ]]
          [[ "$source_tree" == '63766720ae81d7e0cd717d7214244511302a067c' ]]
          [[ "$source_diff" == '93262c65fe976d926db93ef90b7e7e4649d8395f17b7c266dba2db0b494d508e' ]]
          [[ "$workflow_files" == '.github/workflows/windows-filesystem.yml' ]]
          [[ -z "$(git status --porcelain)" ]]
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential pkg-config libssl-dev ripgrep
      - name: Install protoc
        uses: rustfs/setup-protoc@a3705324d8f9bf5b6c3573fb6cf8ae421db55dd6
        with:
          version: '35.1'
          repo-token: ${{ github.token }}
      - name: Install flatc
        uses: Nugine/setup-flatc@698800de72a96bfb22cf60431dc21a2ff9a7e07b
        with:
          version: '25.12.19'
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8
        with:
          toolchain: stable
      - name: Run the named tests
        shell: bash
        run: |
          set -euo pipefail
          df -h .
          server=(
            event_writer_rejects_existing_fifo_symlinks_and_creates_a_regular_file
            event_writer_remains_in_the_pinned_directory_after_path_replacement
            parent_peer_requires_both_kernel_pid_and_uid
            parent_check_reads_kernel_socket_credentials
            authenticated_record_matches_independent_fixture
            records_are_redacted_and_disconnected_receiver_is_nonfatal
            full_queue_and_panic_leave_missing_values_unknown
            unwind_drop_does_not_claim_a_byte_count
            attempted_records_are_capped_even_with_a_live_receiver
            writer_failure_is_reported_without_record_contents
          )
          client=(
            authenticated_observation_rejects_missing_truncated_and_modified_records
            authenticated_duplicate_remains_unknown_after_a_later_unique_snapshot
            final_failure_snapshot_missing_or_invalid_revokes_cached_events
            verification_rechecks_cached_nodes_for_later_authenticated_duplicates
            failure_summary_does_not_restore_uniqueness_after_a_duplicate
            failure_summary_final_recheck_revokes_missing_or_invalid_events
            verification_keeps_confirmed_nodes_while_the_fourth_arrives_late
            verification_keeps_budget_for_multiple_late_nodes
            verification_keeps_missing_node_unknown
            failure_summary_keeps_confirmed_nodes_while_the_fourth_arrives_late
            event_reader_rejects_fifos_links_and_other_special_files_without_waiting
            event_reader_reopens_the_pinned_inode_after_path_replacement
            event_reader_worker_limits_return_unknown_without_spawning
            fifo_event_read_returns_unknown_without_blocking_the_runtime
            key_delivery_waits_for_the_exact_registered_child
          )
          [[ "${#server[@]}" -eq 10 && "${#client[@]}" -eq 15 ]]
          run_one() {
            local kind="$1" short="$2" name log status
            if [[ "$kind" == server ]]; then
              name="app::object::get_e2e_observation::tests::$short"
            else
              name="distributed::internode_tls_test::$short"
            fi
            log="$RUNNER_TEMP/tls-observation-$kind-$short.log"
            set +e
            if [[ "$kind" == server ]]; then
              cargo test --locked -p rustfs --lib --features e2e-test-hooks "$name" -- --exact --test-threads=1 >"$log" 2>&1
            else
              cargo test --locked -p e2e_test --lib "$name" -- --exact --test-threads=1 >"$log" 2>&1
            fi
            status=$?
            set -e
            tail -n 100 "$log"
            [[ "$status" -eq 0 ]]
            grep -Fxq 'running 1 test' "$log"
            grep -Fxq "test $name ... ok" "$log"
            grep -Fq 'test result: ok. 1 passed; 0 failed;' "$log"
            printf 'Confirmed one passing test: %s\n' "$name"
          }
          for name in "${server[@]}"; do run_one server "$name"; done
          for name in "${client[@]}"; do run_one client "$name"; done
      - name: Preserve test output
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: tls-fixed-sink-units-${{ github.run_id }}
          path: ${{ runner.temp }}/tls-observation-*.log
          if-no-files-found: warn
