name: FastLock stale guard regression

on:
  workflow_dispatch:
    inputs:
      expected_head:
        description: Exact workflow commit SHA
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: fast-lock-stale-guard-${{ github.ref }}-${{ github.run_id }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: never
  CARGO_INCREMENTAL: '0'
  CARGO_BUILD_JOBS: '2'
  RUST_BACKTRACE: '0'
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'
  NO_PROXY: 127.0.0.1,localhost

jobs:
  scoped-regressions:
    runs-on: ubuntu-latest
    timeout-minutes: 110
    steps:
      - name: Prepare evidence
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/fast-lock-stale-guard"
          printf 'not-started\n' > "$RUNNER_TEMP/fast-lock-stale-guard/build-exit.txt"

      - name: Checkout
        uses: actions/checkout@f548e57e544e1ff5a4c46bf1e1b8685f8e4a348a
        with:
          fetch-depth: 3
          persist-credentials: false
          clean: false

      - name: Verify exact source and workflow scope
        shell: bash
        env:
          EXPECTED_HEAD: ${{ inputs.expected_head }}
        run: |
          set -euo pipefail
          evidence="$RUNNER_TEMP/fast-lock-stale-guard"
          workflow_sha=$(git rev-parse HEAD)
          source_sha=$(git rev-parse HEAD^)
          base_sha=$(git rev-parse HEAD^^)
          source_tree=$(git rev-parse "$source_sha^{tree}")
          source_diff=$(git diff --full-index --binary "$base_sha" "$source_sha" | sha256sum | cut -d' ' -f1)
          source_files=$(git diff --name-only "$base_sha" "$source_sha")
          workflow_files=$(git diff --name-only "$source_sha" "$workflow_sha")
          printf 'expected_head=%s\nworkflow=%s\nsource=%s\nbase=%s\ntree=%s\ndiff=%s\nsource_files=%s\nworkflow_files=%s\n' \
            "$EXPECTED_HEAD" "$workflow_sha" "$source_sha" "$base_sha" "$source_tree" "$source_diff" \
            "$source_files" "$workflow_files" | tee "$evidence/source-proof.txt"
          [[ "$EXPECTED_HEAD" =~ ^[0-9a-f]{40}$ ]]
          [[ "$GITHUB_EVENT_NAME" == 'workflow_dispatch' ]]
          [[ "$EXPECTED_HEAD" == "$GITHUB_SHA" ]]
          [[ "$workflow_sha" == "$GITHUB_SHA" ]]
          [[ "$source_sha" == 'f5c082de935e64f6cad64caf860021b0937ab213' ]]
          [[ "$base_sha" == '7a3bf8cdbd781116a0970585b995ade668c0e662' ]]
          [[ "$source_tree" == '0984e2b01c6d3ec7d162dd637d8f2af40fb41b59' ]]
          [[ "$source_diff" == 'c78aea1d30af8be1d40d7bd5607168442cd13d3f61ea87af012d84164218f261' ]]
          [[ "$source_files" == 'crates/lock/src/fast_lock/manager.rs' ]]
          [[ "$workflow_files" == '.github/workflows/windows-filesystem.yml' ]]
          [[ -z "$(git status --porcelain)" ]]
          df -h . | tee "$evidence/disk.txt"

      - name: Install system dependencies
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y build-essential pkg-config libssl-dev

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8
        with:
          toolchain: stable

      - name: Compile only the lock library tests
        shell: bash
        timeout-minutes: 75
        run: |
          set -euo pipefail
          evidence="$RUNNER_TEMP/fast-lock-stale-guard"
          set +e
          timeout --signal=TERM --kill-after=30s 70m \
            cargo test --locked -p rustfs-lock --lib --no-run > "$evidence/build.log" 2>&1
          result=$?
          set -e
          printf '%s\n' "$result" > "$evidence/build-exit.txt"
          tail -n 100 "$evidence/build.log"
          exit "$result"

      - name: Run normal shared and exclusive controls
        shell: bash
        timeout-minutes: 12
        run: |
          set -euo pipefail
          evidence="$RUNNER_TEMP/fast-lock-stale-guard"
          tests=(
            'fast_lock::tests::fast_lock_tests::test_basic_write_lock_acquire_release'
            'fast_lock::tests::fast_lock_tests::test_basic_read_lock_acquire_release'
          )
          for test_name in "${tests[@]}"; do
            file_name=${test_name//::/_}
            log="$evidence/$file_name.log"
            set +e
            timeout --signal=TERM --kill-after=10s 5m \
              cargo test --locked -p rustfs-lock --lib -- --exact "$test_name" > "$log" 2>&1
            result=$?
            set -e
            printf '%s\n' "$result" > "$evidence/$file_name.exit"
            tail -n 80 "$log"
            [[ "$result" -eq 0 ]]
            grep -Eq '^[[:space:]]*Finished .*test.* profile' "$log"
            grep -Fq 'Running unittests src/lib.rs ' "$log"
            grep -Fxq 'running 1 test' "$log"
            grep -Fxq "test $test_name ... ok" "$log"
            grep -Fq 'test result: ok. 1 passed; 0 failed;' "$log"
            if grep -Eq '^error(\[E[0-9]+\])?: ' "$log"; then
              printf 'Unexpected Cargo or compiler error in control %s\n' "$test_name"
              exit 1
            fi
          done

      - name: Run and classify each expected red regression
        shell: bash
        timeout-minutes: 27
        run: |
          set -euo pipefail
          evidence="$RUNNER_TEMP/fast-lock-stale-guard"
          tests=(
            'fast_lock::manager::tests::force_unlocked_exclusive_guard_drop_preserves_same_owner_successor'
            'fast_lock::manager::tests::force_unlocked_exclusive_guard_release_preserves_same_owner_successor'
            'fast_lock::manager::tests::force_unlock_releases_all_shared_guards_of_same_owner'
            'fast_lock::manager::tests::force_unlocked_shared_guards_drop_preserves_same_owner_successor'
            'fast_lock::manager::tests::force_unlocked_shared_guards_release_preserves_same_owner_successor'
          )
          messages=(
            'after stale guard drop: successor must remain the sole holder'
            'after stale guard release: successor must remain the sole holder'
            'force unlock must release every shared guard of the owner'
            'after first stale shared drop: successor must remain the sole holder'
            'after first stale shared release: successor must remain the sole holder'
          )
          lines=(670 670 781 670 670)
          left=(0 0 1 0 0)
          right=(1 1 0 1 1)
          failures=0
          for index in "${!tests[@]}"; do
            test_name=${tests[$index]}
            file_name=${test_name//::/_}
            message=${messages[$index]}
            panic_line=${lines[$index]}
            expected_left=${left[$index]}
            expected_right=${right[$index]}
            log="$evidence/$file_name.log"
            set +e
            timeout --signal=TERM --kill-after=10s 5m \
              cargo test --locked -p rustfs-lock --lib -- --exact "$test_name" > "$log" 2>&1
            result=$?
            set -e
            printf '%s\n' "$result" > "$evidence/$file_name.exit"
            tail -n 100 "$log"
            unexpected_errors=$(grep -E '^error(\[E[0-9]+\])?: ' "$log" | grep -Fv 'error: test failed,' || true)
            panic_count=$(grep -Ec "^thread '.*' \([0-9]+\) panicked at " "$log" || true)
            if [[ "$result" -ne 101 ]] \
              || [[ -n "$unexpected_errors" ]] \
              || [[ "$panic_count" -ne 1 ]] \
              || ! grep -Eq '^[[:space:]]*Finished .*test.* profile' "$log" \
              || ! grep -Fq 'Running unittests src/lib.rs ' "$log" \
              || ! grep -Fxq 'running 1 test' "$log" \
              || ! grep -Fxq "test $test_name ... FAILED" "$log" \
              || ! grep -Eq "^thread '$test_name' \([0-9]+\) panicked at crates/lock/src/fast_lock/manager\.rs:$panic_line:[0-9]+:$" "$log" \
              || ! grep -Eq "^assertion .left == right. failed: $message$" "$log" \
              || ! grep -Eq "^[[:space:]]*left: $expected_left$" "$log" \
              || ! grep -Eq "^[[:space:]]*right: $expected_right$" "$log" \
              || ! grep -Fq 'test result: FAILED. 0 passed; 1 failed;' "$log"; then
              printf 'Unexpected outcome for %s\n' "$test_name" | tee "$evidence/$file_name.classification"
              failures=$((failures + 1))
            else
              printf 'Expected red assertion observed for %s\n' "$test_name" | tee "$evidence/$file_name.classification"
            fi
          done
          [[ "$failures" -eq 0 ]]

      - name: Preserve logs and exit codes
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: fast-lock-stale-guard-${{ github.run_id }}
          path: ${{ runner.temp }}/fast-lock-stale-guard/
          if-no-files-found: error
          retention-days: 14
