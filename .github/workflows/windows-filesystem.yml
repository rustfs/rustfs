name: Scanner lease deadline f879 scoped
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: scanner-lease-main-scoped-${{ github.ref }}
  cancel-in-progress: false
env:
  CARGO_TERM_COLOR: never
  RUST_BACKTRACE: 1
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'
  NO_PROXY: 127.0.0.1,localhost
jobs:
  scoped-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout
        uses: actions/checkout@f548e57e544e1ff5a4c46bf1e1b8685f8e4a348a
        with:
          fetch-depth: 3
          persist-credentials: false
      - name: Verify source snapshot
        shell: bash
        run: |
          set -euo pipefail
          actual_head=$(git rev-parse HEAD)
          actual_source=$(git rev-parse HEAD^)
          actual_base=$(git rev-parse HEAD^^)
          actual_tree=$(git rev-parse 'HEAD^^{tree}')
          actual_diff=$(git diff --full-index --binary "$actual_base" "$actual_source" | sha256sum | cut -d' ' -f1)
          actual_files=$(git diff --name-only "$actual_source" "$actual_head")
          printf 'head %s source %s base %s tree %s diff %s files %s\n' "$actual_head" "$actual_source" "$actual_base" "$actual_tree" "$actual_diff" "$actual_files"
          [[ "$actual_head" == "$GITHUB_SHA" ]]
          [[ "$actual_source" == "672505dca190711abe9b8f4d0088dc031b76273f" ]]
          [[ "$actual_base" == "f879946ead08f90074a73079e29cb33e6746f9d1" ]]
          [[ "$actual_tree" == "3d2195ad379bc495a25db85c9f89015444b052d7" ]]
          [[ "$actual_diff" == "e420e5ab9aba26be6852044841954e4031d4f091271e10a8dce88f4c19426ed3" ]]
          [[ "$actual_files" == ".github/workflows/windows-filesystem.yml" ]]
      - name: Setup Rust
        uses: ./.github/actions/setup
        with:
          rust-version: stable
          cache-shared-key: ci-e2e-distributed-hosted
          cache-save-if: 'false'
          install-build-packaging-tools: 'false'
          install-test-tools: 'false'
      - name: Run selected tests
        shell: bash
        env:
          CARGO_BUILD_JOBS: '1'
          CARGO_INCREMENTAL: '0'
        run: |
          set -euo pipefail
          df -h .
          free -h
          run_one() {
            local package="$1"
            local test_name="$2"
            local log="$RUNNER_TEMP/${test_name//::/_}.log"
            local status
            set +e
            cargo test --locked -p "$package" --lib -- --exact "$test_name" --nocapture >"$log" 2>&1
            status=$?
            set -e
            tail -n 160 "$log"
            [[ "$status" -eq 0 ]]
            grep -Fxq 'running 1 test' "$log"
            grep -Fxq "test $test_name ... ok" "$log"
            grep -Fq 'test result: ok. 1 passed; 0 failed;' "$log"
            printf 'Confirmed one passing test: %s\n' "$test_name"
          }
          run_one rustfs-scanner scanner::tests::cycle_budget_publication::publication_lease_observations_keep_cycle_epoch_purpose_and_outcome
          run_one rustfs-scanner scanner::tests::cycle_budget_publication::publication_lease_retry_logs_identify_interleaved_epochs
          run_one rustfs-scanner scanner::tests::cycle_budget_publication::publication_lease_events_include_context_in_otlp_without_span_export
          run_one rustfs-scanner scanner::tests::cycle_budget_publication::dropped_lease_wait_does_not_report_a_finished_outcome
          run_one rustfs-scanner scanner::tests::cycle_budget_publication::publication_lease_retries_local_channel_deadline_and_stops_on_cancel
          run_one rustfs-ecstore cluster::rpc::peer_rest_client::tests::scanner_publication_lease_validation_errors_are_typed_without_changing_display
          run_one rustfs-ecstore cluster::rpc::peer_rest_client::tests::scanner_publication_lease_error_class_keeps_remote_reports_separate_from_local_errors
          run_one rustfs-ecstore services::notification_sys::tests::scanner_lease_acquisition_error_identifies_peer_and_preserves_retry_suffix
          run_one rustfs-ecstore services::notification_sys::tests::scanner_lease_failure_info_uses_the_actual_target_and_rejects_unbounded_peers
          run_one rustfs-ecstore services::notification_sys::tests::scanner_lease_failure_info_accepts_real_grid_host_urls
          run_one rustfs-ecstore services::notification_sys::tests::scanner_lease_failure_info_preserves_typed_connection_failures_without_logging_details
          run_one rustfs-ecstore services::notification_sys::tests::scanner_lease_channel_deadline_preserves_public_error_and_diagnostic
