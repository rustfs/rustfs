name: Scanner heal ID stack diagnostic

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: scanner-heal-id-reuse-stack-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: never
  CARGO_INCREMENTAL: '0'
  CARGO_BUILD_JOBS: '1'
  RUST_BACKTRACE: '0'
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'
  NO_PROXY: 127.0.0.1,localhost

jobs:
  stack-diagnostic:
    name: Diagnose one scanner test
    runs-on: ubuntu-latest
    timeout-minutes: 110
    steps:
      - name: Checkout
        uses: actions/checkout@f548e57e544e1ff5a4c46bf1e1b8685f8e4a348a
        with:
          fetch-depth: 5
          persist-credentials: false
          clean: false

      - name: Verify diagnostic source
        shell: bash
        run: |
          set -euo pipefail
          output_dir="$RUNNER_TEMP/heal-id-reuse-stack"
          mkdir -p "$output_dir"
          workflow_sha=$(git rev-parse HEAD)
          previous_workflow_sha=$(git rev-parse HEAD^)
          source_sha=$(git rev-parse HEAD^^)
          base_sha=$(git rev-parse HEAD^^^)
          source_tree=$(git rev-parse "${source_sha}^{tree}")
          marker_diff=$(git diff --full-index --binary "$base_sha" "$source_sha" | sha256sum | cut -d' ' -f1)
          marker_files=$(git diff --name-only "$base_sha" "$source_sha")
          workflow_files=$(git diff --name-only "$source_sha" "$workflow_sha")
          printf 'workflow=%s\nprevious_workflow=%s\nsource=%s\nbase=%s\nsource_tree=%s\nmarker_diff=%s\nmarker_files=%s\nworkflow_files=%s\n' \
            "$workflow_sha" "$previous_workflow_sha" "$source_sha" "$base_sha" "$source_tree" "$marker_diff" "$marker_files" "$workflow_files" \
            | tee "$output_dir/source.txt"
          [[ "$workflow_sha" == "$GITHUB_SHA" ]]
          [[ "$previous_workflow_sha" == 'dce2e710b5a6e7b6385749f898d0cb008b25b067' ]]
          [[ "$source_sha" == '12b3ee9f948be35e54a0cd008aab50009f446ad3' ]]
          [[ "$base_sha" == 'd31b9fe1b8777482a5ad90c46dedb27170c46d74' ]]
          [[ "$source_tree" == '55c91e3a126628e309092353ceff9766c3ea06f7' ]]
          [[ "$marker_diff" == '640e98d000acb90d09f15872423160cac05900f2bae6daf7f6f5e9a012954033' ]]
          [[ "$marker_files" == 'crates/scanner/tests/heal_generation_observation.rs' ]]
          [[ "$workflow_files" == '.github/workflows/windows-filesystem.yml' ]]
          [[ -z "$(git status --porcelain)" ]]

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential pkg-config libssl-dev ripgrep

      - name: Install protoc
        uses: rustfs/setup-protoc@a3705324d8f9bf5b6c3573fb6cf8ae421db55dd6
        with:
          version: '35.1'
          repo-token: ${{ github.token }}

      - name: Install flatc
        uses: Nugine/setup-flatc@698800de72a96bfb22cf60431dc21a2ff9a7e07b
        with:
          version: '25.12.19'

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8
        with:
          toolchain: stable

      - name: Run the single diagnostic test
        shell: bash
        run: |
          set -euo pipefail
          output_dir="$RUNNER_TEMP/heal-id-reuse-stack"
          log="$output_dir/test.log"
          test_name='overwritten_unversioned_generation_is_not_attributed_to_the_scanned_candidate'
          if [[ -v RUST_MIN_STACK ]]; then
            printf 'RUST_MIN_STACK is set; refusing a non-default-stack diagnostic\n' | tee "$output_dir/environment.txt"
            exit 1
          fi
          printf 'RUST_MIN_STACK is unset\nshell_stack_limit_kib=%s\n' "$(ulimit -s)" | tee "$output_dir/environment.txt"
          printf '%s\n' 'Diagnostic only: the test result is not a repair or full CI verdict.' | tee "$output_dir/scope.txt"
          set +e
          cargo test --locked -p rustfs-scanner --features test-util --test heal_generation_observation -- --exact "$test_name" --nocapture >"$log" 2>&1
          test_status=$?
          set -e
          printf '%s\n' "$test_status" | tee "$output_dir/exit-code.txt"
          tail -n 120 "$log" || printf '%s\n' 'Could not display the diagnostic log' >&2
          if [[ "$test_status" -ne 0 ]]; then
            exit "$test_status"
          fi
          set +e
          python3 - "$log" "$test_name" >"$output_dir/selection.txt" 2>&1 <<'PY'
          import re
          import sys
          from pathlib import Path

          def valid_selection(output, expected_name):
              output = re.sub(r"\x1b\[[0-?]*[ -/]*[@-~]", "", output)
              runs = re.findall(r"(?m)^running (\d+) tests?[ \t]*\r?$", output)
              names = re.findall(r"\btest ([^\s]+) \.\.\.", output)
              summaries = re.findall(r"(?m)^test result: (ok|FAILED)\. (\d+) passed; (\d+) failed; (\d+) ignored;", output)
              return runs == ["1"] and names == [expected_name] and summaries == [("ok", "1", "0", "0")]

          if __name__ == "__main__":
              output = Path(sys.argv[1]).read_text(encoding="utf-8", errors="replace")
              if not valid_selection(output, sys.argv[2]):
                  print("Test selection or passing summary did not match the named test")
                  sys.exit(1)
              print("The named test ran once and passed")
          PY
          selection_status=$?
          set -e
          cat "$output_dir/selection.txt"
          exit "$selection_status"

      - name: Preserve diagnostic output
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: scanner-heal-id-reuse-stack-${{ github.run_id }}
          path: ${{ runner.temp }}/heal-id-reuse-stack/
          if-no-files-found: warn
