name: Scanner child I/O regression
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: scanner-child-io-red-${{ github.ref }}
  cancel-in-progress: false
env:
  CARGO_TERM_COLOR: never
  RUST_BACKTRACE: '0'
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'
  NO_PROXY: 127.0.0.1,localhost
jobs:
  scoped-red-test:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout
        uses: actions/checkout@f548e57e544e1ff5a4c46bf1e1b8685f8e4a348a
        with:
          fetch-depth: 3
          persist-credentials: false
      - name: Verify source snapshot
        shell: bash
        run: |
          set -euo pipefail
          workflow_sha=$(git rev-parse HEAD)
          source_sha=$(git rev-parse HEAD^)
          base_sha=$(git rev-parse HEAD^^)
          source_tree=$(git rev-parse "$source_sha^{tree}")
          source_diff=$(git diff --full-index --binary "$base_sha" "$source_sha" | sha256sum | cut -d' ' -f1)
          source_files=$(git diff --name-only "$base_sha" "$source_sha")
          workflow_files=$(git diff --name-only "$source_sha" "$workflow_sha")
          printf 'head=%s source=%s base=%s tree=%s diff=%s\n' "$workflow_sha" "$source_sha" "$base_sha" "$source_tree" "$source_diff"
          printf 'source files: %s\nworkflow files: %s\n' "$source_files" "$workflow_files"
          [[ "$workflow_sha" == "$GITHUB_SHA" ]]
          [[ "$source_sha" == "fb3ea1e203e4a5d94d8110acfe9b78eae59083a3" ]]
          [[ "$base_sha" == "851c2957530dcd92101f64e8193b75d2709e1ff1" ]]
          [[ "$source_tree" == "061e2bb5105d9e47e4c80d015acd33962ed7129c" ]]
          [[ "$source_diff" == "c2d0c17da20ff727a169f8c57ff7460099144ba1a5a12da2d6e6463133804887" ]]
          [[ "$source_files" == "crates/scanner/src/scanner_folder/tests/erasure_probe.rs" ]]
          [[ "$workflow_files" == ".github/workflows/windows-filesystem.yml" ]]
      - name: Setup Rust
        uses: ./.github/actions/setup
        with:
          rust-version: stable
          cache-shared-key: scanner-child-io-red-hosted
          cache-save-if: 'false'
          install-build-packaging-tools: 'false'
          install-test-tools: 'false'
      - name: Run the named regression
        shell: bash
        env:
          CARGO_BUILD_JOBS: '1'
          CARGO_INCREMENTAL: '0'
        run: |
          set -euo pipefail
          df -h .
          test_name=scanner_folder::tests::erasure_probe::namespace_child_io_failure_preserves_healthy_sibling_as_partial
          log="$RUNNER_TEMP/scanner-child-io-red.log"
          set +e
          cargo test --locked -p rustfs-scanner --lib -- --exact "$test_name" >"$log" 2>&1
          test_status=$?
          set -e
          tail -n 120 "$log"
          if [[ "$test_status" -ne 101 ]]; then
            printf 'Expected test exit 101, received %s\n' "$test_status"
            exit 1
          fi
          grep -Fxq -- 'running 1 test' "$log"
          grep -Fxq -- "test $test_name ... FAILED" "$log"
          grep -Fxq -- 'Observed the child I/O failure before scanning the healthy sibling' "$log"
          grep -Fxq -- 'Observed partial=false snapshot_complete=true' "$log"
          grep -Fxq -- 'a child directory I/O failure must leave the bucket partial; partial=false, snapshot_complete=true' "$log"
          grep -Fq -- 'test result: FAILED. 0 passed; 1 failed;' "$log"
          printf 'Confirmed expected failure of the one selected test\n'
      - name: Preserve test output
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: scanner-child-io-red-${{ github.run_id }}
          path: ${{ runner.temp }}/scanner-child-io-red.log
          if-no-files-found: warn
