name: Scanner Read Repair Queue Preflight

on:
  workflow_dispatch:
    inputs:
      expected_head:
        description: Full SHA of this workflow commit
        required: true
        type: string

permissions:
  contents: read

jobs:
  focused-test:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      CARGO_TERM_COLOR: never
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'
      NO_PROXY: 127.0.0.1,localhost
    steps:
      - name: Checkout candidate
        uses: actions/checkout@f548e57e544e1ff5a4c46bf1e1b8685f8e4a348a # v7
        with:
          fetch-depth: 5
          persist-credentials: false

      - name: Verify candidate and workflow head
        shell: bash
        env:
          EXPECTED_HEAD: ${{ inputs.expected_head }}
        run: |
          set -euo pipefail
          actual_head=$(git rev-parse HEAD)
          source=$(git rev-parse HEAD^)
          test_base=$(git rev-parse HEAD^^)
          main_base=$(git rev-parse HEAD~4)
          base_tree=$(git rev-parse "${test_base}^{tree}")
          candidate_tree=$(git rev-parse "${source}^{tree}")
          workflow_tree=$(git rev-parse "${actual_head}^{tree}")
          test_diff=$(git diff --full-index --binary "$test_base" "$source" | sha256sum | cut -d' ' -f1)
          combined_diff=$(git diff --full-index --binary "$main_base" "$source" | sha256sum | cut -d' ' -f1)
          source_files=$(git diff --name-only "$test_base" "$source")
          workflow_files=$(git diff --name-only "$source" "$actual_head")
          printf 'head=%s source=%s test_base=%s main_base=%s base_tree=%s candidate_tree=%s workflow_tree=%s test_diff=%s combined_diff=%s\n' \
            "$actual_head" "$source" "$test_base" "$main_base" "$base_tree" "$candidate_tree" "$workflow_tree" "$test_diff" "$combined_diff"
          printf 'source_files=%s workflow_files=%s\n' "$source_files" "$workflow_files"
          [[ "$EXPECTED_HEAD" =~ ^[0-9a-f]{40}$ ]]
          [[ "$actual_head" == "$EXPECTED_HEAD" && "$actual_head" == "$GITHUB_SHA" ]]
          [[ "$source" == e8382ebefc8f6feac681fbbd67d30fefdd3bf46b ]]
          [[ "$test_base" == 41d06b4d7a1eee1cec4db8df65bc741b834831eb ]]
          [[ "$main_base" == 7a3bf8cdbd781116a0970585b995ade668c0e662 ]]
          [[ "$base_tree" == 01b101acf0119bec8243cab1556cc0218170b6bf ]]
          [[ "$candidate_tree" == 7cb63e65ca31372a85fd06657608c24cc3b8d063 ]]
          [[ "$test_diff" == d7dd41fa96e9ee83e7a3c64a0b27efbe2265771e2b026e29e12e94393fab9dd2 ]]
          [[ "$combined_diff" == 8b898f5821031f5e567c0a0ab51c4039c39467c42e32c54d916aca20e59eba2d ]]
          [[ "$source_files" == crates/scanner/tests/read_repair_scanner_queue.rs ]]
          [[ "$workflow_files" == .github/workflows/windows-filesystem.yml ]]
          [[ -z "$(git status --porcelain)" ]]

      - name: Setup Rust
        uses: ./.github/actions/setup
        with:
          rust-version: stable
          cache-shared-key: ci-e2e-distributed-hosted
          cache-save-if: 'false'
          install-build-packaging-tools: 'false'
          install-test-tools: 'false'

      # The single integration test uses local disks and an in-process channel.
      - name: Run the named Scanner and ReadRepair test
        id: scoped_test
        shell: bash
        env:
          CARGO_BUILD_JOBS: '2'
          CARGO_INCREMENTAL: '0'
          CARGO_PROFILE_TEST_DEBUG: '0'
          RUST_BACKTRACE: '1'
          TEST_LOG: ${{ runner.temp }}/read-repair-scanner-test.log
          TEST_NAME: dangling_metadata_read_repair_and_scanner_have_distinct_queued_owners
        run: |
          set -euo pipefail
          [[ ! -e "$TEST_LOG" ]]
          set +e
          cargo test --locked -p rustfs-scanner --test read_repair_scanner_queue -- "$TEST_NAME" --exact --test-threads=1 >"$TEST_LOG" 2>&1
          status=$?
          set -e
          cat "$TEST_LOG"
          [[ "$status" -eq 0 ]]
          grep -Fxq 'running 1 test' "$TEST_LOG"
          grep -Fxq "test $TEST_NAME ... ok" "$TEST_LOG"
          grep -Eq '^test result: ok\. 1 passed; 0 failed; 0 ignored; [0-9]+ measured; [0-9]+ filtered out; finished in ' "$TEST_LOG"

      - name: Upload test log
        if: ${{ always() && (steps.scoped_test.outcome == 'success' || steps.scoped_test.outcome == 'failure') }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: scanner-read-repair-queue-${{ github.run_id }}
          path: ${{ runner.temp }}/read-repair-scanner-test.log
          retention-days: 7
          if-no-files-found: error
