name: Heal force-start ID baseline
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  focused:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Checkout
        uses: actions/checkout@f548e57e544e1ff5a4c46bf1e1b8685f8e4a348a
        with:
          fetch-depth: 3
          persist-credentials: false
      - name: Verify source snapshot
        shell: bash
        run: |
          set -euo pipefail
          actual_head=$(git rev-parse HEAD)
          actual_source=$(git rev-parse HEAD^)
          actual_base=$(git rev-parse HEAD^^)
          actual_tree=$(git rev-parse 'HEAD^^{tree}')
          actual_diff=$(git diff --full-index --binary "$actual_base" "$actual_source" | sha256sum | cut -d' ' -f1)
          actual_files=$(git diff --name-only "$actual_source" "$actual_head")
          printf 'head %s source %s base %s tree %s diff %s files %s\n' "$actual_head" "$actual_source" "$actual_base" "$actual_tree" "$actual_diff" "$actual_files"
          [[ "$actual_head" == "$GITHUB_SHA" ]]
          [[ "$actual_source" == "e966840de75f8a87bb10ed572e26450ad23a2ac9" ]]
          [[ "$actual_base" == "d88f524d9ff071300dde4aab1c9af1fd45a82426" ]]
          [[ "$actual_tree" == "13bc1218b790e2ce3d69cf189bc898c79606eb29" ]]
          [[ "$actual_diff" == "1161ffcd56e7e68ea20effc701da4de17c4340249be4d38dd274b63be23b388f" ]]
          [[ "$actual_files" == ".github/workflows/windows-filesystem.yml" ]]
      - name: Setup Rust
        uses: ./.github/actions/setup
        with:
          rust-version: stable
          cache-shared-key: ci-e2e-distributed-hosted
          cache-save-if: 'false'
          install-build-packaging-tools: 'false'
          install-test-tools: 'false'
      - name: Run selected tests
        shell: bash
        run: |
          set -euo pipefail
          export CARGO_TERM_COLOR=never CARGO_BUILD_JOBS=2 CARGO_PROFILE_TEST_DEBUG=0 CARGO_INCREMENTAL=0 RUST_BACKTRACE=0
          tests=(
            heal::manager::tests::admin_overlap::admin_force_start_rechecks_request_id_after_cancelling_overlaps
          )
          for name in "${tests[@]}"; do
            log="$RUNNER_TEMP/${name##*::}.log"
            set +e
            cargo test --locked -p rustfs-heal --lib "$name" -- --exact --test-threads=1 >"$log" 2>&1
            status=$?
            set -e
            tail -n 160 "$log"
            [[ "$status" -eq 101 ]]
            grep -Fxq 'running 1 test' "$log"
            grep -Fxq "test ${name} ... FAILED" "$log"
            grep -Fq 'left: Accepted' "$log"
            grep -Fq 'right: Dropped(AlreadyRunning)' "$log"
            grep -Fq 'test result: FAILED. 0 passed; 1 failed;' "$log"
            printf 'Confirmed one expected baseline assertion failure: %s\n' "$name" 
          done
