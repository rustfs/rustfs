name: TLS observation directory admission diagnostic
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Inspect task-owned directory fixtures
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import ctypes
          import errno
          import os
          import platform
          import re
          import stat

          if platform.system() != "Linux" or platform.machine() != "x86_64":
              raise SystemExit("unsupported platform; no admission conclusion")
          if not all(hasattr(os, name) for name in ("O_PATH", "O_DIRECTORY", "O_NOFOLLOW", "O_CLOEXEC", "O_NONBLOCK")):
              raise SystemExit("missing open flags; no admission conclusion")
          run_id = os.environ.get("GITHUB_RUN_ID", "")
          attempt = os.environ.get("GITHUB_RUN_ATTEMPT", "")
          if not re.fullmatch(r"[0-9]{1,20}", run_id) or not re.fullmatch(r"[0-9]{1,6}", attempt):
              raise SystemExit("missing run identity; no fixtures created")

          tmpdir = os.environ.get("TMPDIR")
          if tmpdir is None:
              base = "/tmp"
              tmpdir_source = "default"
          else:
              tmpdir_source = "env"
              if not tmpdir:
                  raise SystemExit("TMPDIR is empty; admission inconclusive")
              if not tmpdir.startswith("/"):
                  raise SystemExit("TMPDIR is relative; admission inconclusive")
              if ".." in tmpdir.split("/"):
                  raise SystemExit("TMPDIR contains a parent component; admission inconclusive")
              base = tmpdir
          old_umask = os.umask(0)
          os.umask(old_umask)
          print(f"kernel={platform.release()} umask={old_umask:04o} tmpdir_source={tmpdir_source}")

          current = ""
          chain_errors = False
          symlinks = 0
          for index, component in enumerate(base.split("/")[1:], start=1):
              current += "/" + component
              if component in ("", "."):
                  print(f"base_component index={index} kind={'empty' if not component else 'dot'}")
                  continue
              try:
                  metadata = os.lstat(current)
                  is_link = stat.S_ISLNK(metadata.st_mode)
                  symlinks += int(is_link)
                  print(f"base_component index={index} symlink={str(is_link).lower()}")
              except OSError as error:
                  chain_errors = True
                  print(f"base_component index={index} errno={error.errno} code={errno.errorcode.get(error.errno, 'UNKNOWN')}")
                  break
          print(f"base_chain symlinks={symlinks} inspectable={str(not chain_errors).lower()}")
          if chain_errors:
              raise SystemExit("base path not inspectable; no admission conclusion")

          class OpenHow(ctypes.Structure):
              _fields_ = [("flags", ctypes.c_uint64), ("mode", ctypes.c_uint64), ("resolve", ctypes.c_uint64)]

          libc = ctypes.CDLL(None, use_errno=True)
          libc.syscall.restype = ctypes.c_long
          directory_flags = os.O_PATH | os.O_DIRECTORY | os.O_NOFOLLOW | os.O_CLOEXEC
          event_flags = os.O_WRONLY | os.O_CREAT | os.O_EXCL | os.O_NOFOLLOW | os.O_NONBLOCK | os.O_CLOEXEC

          def open_directory(path):
              how = OpenHow(directory_flags, 0, 0x04)
              result = libc.syscall(
                  ctypes.c_long(437), ctypes.c_int(-100), ctypes.c_char_p(os.fsencode(path)),
                  ctypes.byref(how), ctypes.c_size_t(ctypes.sizeof(how)),
              )
              return (int(result), None) if result >= 0 else (None, ctypes.get_errno())

          base_fd, base_error = open_directory(base)
          if base_fd is None:
              print(f"base_openat2 errno={base_error} code={errno.errorcode.get(base_error, 'UNKNOWN')}")
              raise SystemExit("base path admission inconclusive; no fixtures created")
          names = {
              label: f"rustfs-tls-mode-{run_id}-{attempt}-{label}"
              for label in ("default", "control0755", "control0700")
          }
          separator = "" if base.endswith("/") else "/"
          paths = {label: base + separator + name for label, name in names.items()}
          try:
              os.mkdir(names["default"], 0o777, dir_fd=base_fd)
              control_umask = os.umask(0)
              try:
                  os.mkdir(names["control0755"], 0o755, dir_fd=base_fd)
                  os.mkdir(names["control0700"], 0o700, dir_fd=base_fd)
              finally:
                  os.umask(control_umask)
          except OSError as error:
              print(f"fixture_create errno={error.errno} code={errno.errorcode.get(error.errno, 'UNKNOWN')}")
              raise SystemExit("fixture setup failed; no admission conclusion")

          def inspect_event_file(directory_fd, name, label):
              try:
                  fd = os.open(name, event_flags, 0o600, dir_fd=directory_fd)
              except OSError as error:
                  print(f"{label} stage=openat errno={error.errno} code={errno.errorcode.get(error.errno, 'UNKNOWN')}")
                  return False
              try:
                  metadata = os.fstat(fd)
                  regular = stat.S_ISREG(metadata.st_mode)
                  print(f"{label} stage=fstat regular={str(regular).lower()} nlink={metadata.st_nlink} mode={metadata.st_mode & 0o7777:04o}")
                  return regular and metadata.st_nlink == 1
              except OSError as error:
                  print(f"{label} stage=fstat errno={error.errno} code={errno.errorcode.get(error.errno, 'UNKNOWN')}")
                  return False
              finally:
                  os.close(fd)

          results = {}
          private_fd = None
          for label, path in paths.items():
              try:
                  metadata = os.stat(names[label], dir_fd=base_fd, follow_symlinks=False)
                  print(f"{label} lstat_mode={metadata.st_mode & 0o7777:04o} directory={str(stat.S_ISDIR(metadata.st_mode)).lower()}")
              except OSError as error:
                  print(f"{label} stage=lstat errno={error.errno} code={errno.errorcode.get(error.errno, 'UNKNOWN')}")
                  continue
              fd, error = open_directory(path)
              if fd is None:
                  print(f"{label} stage=openat2 errno={error} code={errno.errorcode.get(error, 'UNKNOWN')}")
                  continue
              try:
                  opened = os.fstat(fd)
                  if (opened.st_dev, opened.st_ino) != (metadata.st_dev, metadata.st_ino):
                      print(f"{label} stage=identity mismatch=true")
                      continue
                  mode = opened.st_mode & 0o7777
                  admitted = stat.S_ISDIR(opened.st_mode) and mode & 0o077 == 0
                  print(f"{label} stage=directory_fstat mode={mode:04o} admitted={str(admitted).lower()}")
                  results[label] = {"mode": mode, "admitted": admitted}
                  if admitted:
                      results[label]["event_file"] = inspect_event_file(fd, "get-reader-103.events", label)
                  if label == "control0700" and admitted:
                      private_fd = os.dup(fd)
              except OSError as error:
                  print(f"{label} stage=directory_fstat errno={error.errno} code={errno.errorcode.get(error.errno, 'UNKNOWN')}")
              finally:
                  os.close(fd)

          if private_fd is not None:
              try:
                  os.mkfifo("get-reader-101.events", 0o600, dir_fd=private_fd)
                  os.symlink("missing", "get-reader-102.events", dir_fd=private_fd)
                  for label, name in (("fifo_collision", "get-reader-101.events"), ("symlink_collision", "get-reader-102.events")):
                      try:
                          fd = os.open(name, event_flags, 0o600, dir_fd=private_fd)
                      except OSError as error:
                          print(f"{label} errno={error.errno} code={errno.errorcode.get(error.errno, 'UNKNOWN')}")
                          results[label] = error.errno == errno.EEXIST
                      else:
                          os.close(fd)
                          print(f"{label} unexpected_open=true")
                          results[label] = False
              finally:
                  os.close(private_fd)

          os.close(base_fd)
          if "default" not in results:
              raise SystemExit("default admission inconclusive; controls cannot establish the prior run's mode")
          if results["default"]["admitted"]:
              if results["default"].get("event_file") is not True:
                  raise SystemExit("default event openat/fstat inconclusive; inspect recorded stage and errno")
          elif results["default"]["mode"] & 0o077 != 0:
              print("default_mode_rejected=true")
          else:
              raise SystemExit("default directory admission inconclusive")
          if (results.get("control0755", {}).get("mode") != 0o755
                  or results.get("control0755", {}).get("admitted") is not False
                  or results.get("control0700", {}).get("mode") != 0o700
                  or results.get("control0700", {}).get("admitted") is not True
                  or results.get("control0700", {}).get("event_file") is not True
                  or results.get("fifo_collision") is not True
                  or results.get("symlink_collision") is not True):
              raise SystemExit("control evidence incomplete or different; inspect recorded stages")
          print("controls_verified=true; this is not evidence of the failed run's actual mode")
          PY
