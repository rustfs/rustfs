# 4-node 4-disk distributed e2e lane.
#
# Each selected test starts a real localhost cluster via
# `RustFSTestClusterEnvironment` (4 processes; 4 drives per node unless the
# case is a two-site 4-node 1-drive pair or a 4-node upgrade). Membership is
# `[profile.e2e-distributed]` in `.config/nextest.toml`. Storage-sensitive PRs,
# nightly runs, and manual dispatches all execute the same fail-closed suite.
# Upgrade cases download the same pinned previous release as e2e-upgrade.yml.
#
# Isolated pool filesystems: expand/decommission/rebalance cases require
# independent `statfs` capacity. This job runs on GitHub-hosted
# `ubuntu-latest` because the self-hosted `sm-standard-4` ARC pods cannot
# create filesystems: `mount -o loop` fails with ENOENT (no
# `/dev/loop-control`), and `mount -t tmpfs` fails with "cannot mount tmpfs
# read-only" (no `CAP_SYS_ADMIN` in the initial namespace). The same reason
# `uring-integration` and `e2e-s3tests.yml` left that label. The prepare
# step mounts four 1 GiB tmpfs instances and exports `RUSTFS_E2E_POOL_ROOTS`.

name: Multipart Quorum Diagnostic

on:
  pull_request:
    paths:
      - "Cargo.lock"
      - "Cargo.toml"
      - ".config/nextest.toml"
      - ".config/e2e-distributed-selection.txt"
      - ".github/workflows/e2e-distributed.yml"
      - "crates/audit/**"
      - "crates/common/**"
      - "crates/config/**"
      - "crates/e2e_test/**"
      - "crates/ecstore/**"
      - "crates/filemeta/**"
      - "crates/heal/**"
      - "crates/iam/**"
      - "crates/lock/**"
      - "crates/madmin/**"
      - "crates/notify/**"
      - "crates/replication/**"
      - "crates/s3-client/**"
      - "crates/s3-ops/**"
      - "crates/s3-types/**"
      - "crates/scanner/**"
      - "crates/storage-api/**"
      - "crates/utils/**"
      - "rustfs/**"
  workflow_dispatch:
    inputs:
      filter:
        description: "Optional nextest -E filter (default: the whole e2e-distributed profile)"
        required: false
        default: ""
  schedule:
    # 05:53 UTC nightly — clear of e2e-nightly (04:29) and ODM interop (05:23).
    - cron: "53 5 * * *"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name != 'schedule' }}

jobs:
  distributed:
    if: github.repository == 'rustfs/rustfs'
    name: Distributed 4-node 4-disk e2e
    # GitHub-hosted VM: loop and tmpfs mounts work here. sm-standard-4 is an
    # ARC pod and rejects both (`mount -o loop` ENOENT, tmpfs "read-only").
    runs-on: ubuntu-latest
    timeout-minutes: 180
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
      NO_PROXY: 127.0.0.1,localhost
      HTTP_PROXY: ""
      HTTPS_PROXY: ""
      # Pinned previous release used by distributed::upgrade_test (same pin as e2e-upgrade.yml).
      UPGRADE_SOURCE_VERSION: 1.0.0-rc.2
      UPGRADE_SOURCE_ASSET: rustfs-linux-x86_64-gnu-v1.0.0-rc.2.zip
      UPGRADE_SOURCE_SHA256: 7c789386bf85278f865b8e0d359bf4edb84d5aa408cc3fa54a18c25ca74cd6e7
    steps:
      - name: Checkout repository
        uses: actions/checkout@f548e57e544e1ff5a4c46bf1e1b8685f8e4a348a # v7
        with:
          fetch-depth: 5
          persist-credentials: false

      - name: Verify source snapshot
        shell: bash
        run: |
          set -euo pipefail
          actual_head=$(git rev-parse HEAD)
          actual_source=$(git rev-parse HEAD^)
          actual_parent=$(git rev-parse HEAD^^)
          actual_base=$(git rev-parse HEAD^^^^)
          actual_tree=$(git rev-parse 'HEAD^^{tree}')
          actual_diff=$(git diff --full-index --binary "$actual_base" "$actual_source" | sha256sum | cut -d' ' -f1)
          actual_files=$(git diff --name-only "$actual_source" "$actual_head")
          printf 'head %s source %s parent %s base %s tree %s diff %s files %s\n' "$actual_head" "$actual_source" "$actual_parent" "$actual_base" "$actual_tree" "$actual_diff" "$actual_files"
          [[ "$actual_head" == "$GITHUB_SHA" ]]
          [[ "$actual_source" == "baae8e72a062f131c81e4d71b28ccf4961c00089" ]]
          [[ "$actual_parent" == "95386773a0f757c737cc479b1fb3233767efdc55" ]]
          [[ "$actual_base" == "d88f524d9ff071300dde4aab1c9af1fd45a82426" ]]
          [[ "$actual_tree" == "088b14f894f4cda660dedde31bb2ed490dabf170" ]]
          [[ "$actual_diff" == "e958f9a147b79c5732a920a5e6960d95d1c121af5f646f57b1e1065f890cd20e" ]]
          [[ "$actual_files" == ".github/workflows/e2e-distributed.yml" ]]

      - name: Setup Rust environment
        uses: ./.github/actions/setup
        with:
          rust-version: stable
          # Dedicated key: ubuntu-latest and sm-standard-4 share runner.os, so
          # a shared key would mix VM and ARC pod target/ artifacts.
          cache-shared-key: ci-e2e-distributed-hosted
          cache-save-if: ${{ github.ref == 'refs/heads/main' }}
          install-build-packaging-tools: 'false'

      - name: Prepare isolated filesystems for pool movement
        run: |
          set -euo pipefail
          mount_base="${RUNNER_TEMP}/rustfs-e2e-pools"
          mkdir -p "${mount_base}"
          roots=()
          for pool in 0 1 2 3; do
            mountpoint="${mount_base}/pool-${pool}"
            mkdir -p "${mountpoint}"
            # Sized tmpfs reports a distinct st_dev and independent 1G
            # statfs capacity. Requires a VM runner (ubuntu-latest).
            if ! sudo mount -t tmpfs -o size=1G,nosuid,nodev,mode=1777 tmpfs "${mountpoint}"; then
              echo "tmpfs mount failed on $(uname -a)" >&2
              findmnt || true
              grep Cap /proc/self/status || true
              exit 1
            fi
            sudo chmod 1777 "${mountpoint}"
            roots+=("${mountpoint}")
          done
          printf -v joined_roots '%s:' "${roots[@]}"
          echo "RUSTFS_E2E_POOL_ROOTS=${joined_roots%:}" >> "${GITHUB_ENV}"
          findmnt --noheadings --output TARGET,SOURCE,FSTYPE,SIZE --target "${roots[0]}"
          findmnt --noheadings --output TARGET,SOURCE,FSTYPE,SIZE --target "${roots[1]}"
          findmnt --noheadings --output TARGET,SOURCE,FSTYPE,SIZE --target "${roots[2]}"
          findmnt --noheadings --output TARGET,SOURCE,FSTYPE,SIZE --target "${roots[3]}"

      - name: Download pinned previous release
        env:
          SOURCE_DIR: ${{ runner.temp }}/rustfs-upgrade-source
        run: |
          set -euo pipefail
          mkdir -p "$SOURCE_DIR"
          archive="$SOURCE_DIR/$UPGRADE_SOURCE_ASSET"
          curl --fail --location --retry 3 --output "$archive" \
            "https://github.com/${GITHUB_REPOSITORY}/releases/download/${UPGRADE_SOURCE_VERSION}/${UPGRADE_SOURCE_ASSET}"
          echo "$UPGRADE_SOURCE_SHA256  $archive" | sha256sum --check --strict
          unzip -q "$archive" -d "$SOURCE_DIR"
          chmod +x "$SOURCE_DIR/rustfs"
          test -x "$SOURCE_DIR/rustfs"
          echo "RUSTFS_UPGRADE_SOURCE_BINARY=$SOURCE_DIR/rustfs" >> "$GITHUB_ENV"

      - name: Build rustfs binary
        run: |
          python3 scripts/e2e_binary.py build --bins --features e2e-test-hooks

      - name: Verify distributed e2e membership
        env:
          NEXTEST_LISTING: ${{ runner.temp }}/rustfs-e2e-distributed-list.json
        run: |
          cargo nextest list --profile e2e-distributed -p e2e_test --message-format json > "${NEXTEST_LISTING}"
          python3 ./scripts/check_test_wiring.py --check-profile e2e-distributed "${NEXTEST_LISTING}"

      - name: Run distributed 4-node e2e suite
        env:
          RUSTFS_E2E_LOG_DIR: ${{ runner.temp }}/rustfs-e2e-distributed-logs
          FILTER: "test(=distributed::scanner_heal_topology_test::scanner_heal_topology_expand_one_to_four_pools_preserves_versions_and_placement) | test(=distributed::scanner_heal_topology_test::scanner_heal_topology_rebalance_survives_live_writes_stop_and_restart) | test(=distributed::scanner_heal_topology_test::scanner_heal_topology_rebalance_kill_before_source_cleanup_resumes_without_loss) | test(=distributed::scanner_heal_topology_test::scanner_heal_topology_decommission_queue_cancel_resume_and_last_pool_guard) | test(=distributed::scanner_heal_topology_test::scanner_heal_topology_decommission_kill_before_source_cleanup_resumes_without_loss) | test(=distributed::scanner_heal_topology_test::scanner_heal_topology_decommission_target_commit_failure_retains_source) | test(=distributed::scanner_heal_topology_test::scanner_heal_topology_decommission_kill_after_responsibility_persisted_before_ack_resumes) | test(=distributed::expand_decommission_rebalance_test::four_node_pool_expand_preserves_objects_then_rebalance) | test(=distributed::expand_decommission_rebalance_test::four_pool_decommission_moves_objects_without_loss)"
          EXPECTED_TESTS: "distributed::scanner_heal_topology_test::scanner_heal_topology_expand_one_to_four_pools_preserves_versions_and_placement,distributed::scanner_heal_topology_test::scanner_heal_topology_rebalance_survives_live_writes_stop_and_restart,distributed::scanner_heal_topology_test::scanner_heal_topology_rebalance_kill_before_source_cleanup_resumes_without_loss,distributed::scanner_heal_topology_test::scanner_heal_topology_decommission_queue_cancel_resume_and_last_pool_guard,distributed::scanner_heal_topology_test::scanner_heal_topology_decommission_kill_before_source_cleanup_resumes_without_loss,distributed::scanner_heal_topology_test::scanner_heal_topology_decommission_target_commit_failure_retains_source,distributed::scanner_heal_topology_test::scanner_heal_topology_decommission_kill_after_responsibility_persisted_before_ack_resumes,distributed::expand_decommission_rebalance_test::four_node_pool_expand_preserves_objects_then_rebalance,distributed::expand_decommission_rebalance_test::four_pool_decommission_moves_objects_without_loss"
          SELECTED_LISTING: ${{ runner.temp }}/rustfs-selected-topology.json
        run: |
          set -euo pipefail
          test ! -e target/nextest/e2e-distributed/junit.xml
          cargo nextest list --profile e2e-distributed -p e2e_test -E "${FILTER}" --message-format json > "${SELECTED_LISTING}"
          python3 -c 'import json,os,sys; d=json.load(open(sys.argv[1])); expected=set(os.environ["EXPECTED_TESTS"].split(",")); got=[n for s in d["rust-suites"].values() for n,t in s["testcases"].items() if t.get("filter-match",{}).get("status") == "matches" and t.get("ignored") is False]; print("Selected tests:",len(got),sorted(got)); assert len(got)==len(expected)==9 and set(got)==expected' "${SELECTED_LISTING}"
          python3 scripts/e2e_binary.py run --features e2e-test-hooks -- cargo nextest run --profile e2e-distributed -p e2e_test -E "${FILTER}" --no-tests=fail
          test -s target/nextest/e2e-distributed/junit.xml
          python3 -c 'import os,xml.etree.ElementTree as E; expected=set(os.environ["EXPECTED_TESTS"].split(",")); cases=list(E.parse("target/nextest/e2e-distributed/junit.xml").iter("testcase")); got=[c.get("name") for c in cases]; print("JUnit cases:",len(got),sorted(got)); assert len(cases)==len(expected)==9 and set(got)==expected and all(not any(c.find(t) is not None for t in ("failure","error","skipped")) for c in cases)'

      - name: Upload distributed e2e diagnostics
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: e2e-distributed-${{ github.run_number }}
          path: |
            target/nextest/e2e-distributed/junit.xml
            ${{ runner.temp }}/rustfs-e2e-distributed-list.json
            ${{ runner.temp }}/rustfs-selected-topology.json
            ${{ runner.temp }}/rustfs-e2e-distributed-logs/
          retention-days: 7
          if-no-files-found: warn

      - name: Unmount isolated pool filesystems
        if: always()
        run: |
          set -euo pipefail
          mount_base="${RUNNER_TEMP}/rustfs-e2e-pools"
          for pool in 0 1 2 3; do
            mountpoint="${mount_base}/pool-${pool}"
            if mountpoint --quiet "${mountpoint}"; then
              sudo umount "${mountpoint}"
            fi
          done

  alert-on-failure:
    name: Alert on scheduled failure
    needs: [distributed]
    if: github.repository == 'rustfs/rustfs' && (always() && github.event_name == 'schedule' && contains(needs.*.result, 'failure'))
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@f548e57e544e1ff5a4c46bf1e1b8685f8e4a348a # v7
        with:
          persist-credentials: false
      - name: Open or update failure-tracking issue
        uses: ./.github/actions/schedule-failure-issue
        with:
          github-token: ${{ secrets.BACKLOG_ISSUE_TOKEN }}
