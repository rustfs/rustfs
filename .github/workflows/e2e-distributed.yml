name: TLS GET observation diagnostic

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tls-get-observation-${{ github.ref }}
  cancel-in-progress: false

jobs:
  tls-get:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
      CARGO_TERM_COLOR: never
      CARGO_INCREMENTAL: "0"
      CARGO_BUILD_JOBS: "2"
      NO_PROXY: 127.0.0.1,localhost
      HTTP_PROXY: ""
      HTTPS_PROXY: ""
      FILTER: "test(=distributed::internode_tls_test::four_node_tls_large_and_range_gets_preserve_bytes)"
    steps:
      - name: Checkout
        uses: actions/checkout@f548e57e544e1ff5a4c46bf1e1b8685f8e4a348a
        with:
          fetch-depth: 3
          persist-credentials: false
          clean: false

      - name: Verify source snapshot
        shell: bash
        run: |
          set -euo pipefail
          workflow_sha=$(git rev-parse HEAD)
          source_sha=$(git rev-parse HEAD^)
          base_sha=$(git rev-parse HEAD^^)
          source_tree=$(git rev-parse "$source_sha^{tree}")
          source_diff=$(git diff --full-index --binary "$base_sha" "$source_sha" | sha256sum | cut -d' ' -f1)
          workflow_files=$(git diff --name-only "$source_sha" "$workflow_sha")
          printf 'head=%s source=%s base=%s tree=%s diff=%s\n' "$workflow_sha" "$source_sha" "$base_sha" "$source_tree" "$source_diff"
          [[ "$workflow_sha" == "$GITHUB_SHA" ]]
          [[ "$source_sha" == '0339b4f8815b4b6e94a1b6c0d6c29b4700d1eb2f' ]]
          [[ "$base_sha" == '7d3f077072e43ff1ae1844a14c09dec623107f69' ]]
          [[ "$source_tree" == '9a92610ac6e9c054c4a567a896784ddae5c6034c' ]]
          [[ "$source_diff" == '8b4da474b948371493945bf05545f768b026870be340d410b89c4e4a605412f4' ]]
          [[ "$workflow_files" == '.github/workflows/e2e-distributed.yml' ]]
          [[ -z "$(git status --porcelain)" ]]
          test ! -e target/nextest/e2e-distributed/junit.xml
          test ! -L target/nextest/e2e-distributed/junit.xml

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential pkg-config libssl-dev ripgrep

      - name: Install protoc
        uses: rustfs/setup-protoc@a3705324d8f9bf5b6c3573fb6cf8ae421db55dd6
        with:
          version: '35.1'
          repo-token: ${{ github.token }}

      - name: Install flatc
        uses: Nugine/setup-flatc@698800de72a96bfb22cf60431dc21a2ff9a7e07b
        with:
          version: '25.12.19'

      - name: Install Rust
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8
        with:
          toolchain: stable

      - name: Install nextest
        uses: taiki-e/install-action@96c7780c1d8a2b8723e12031def873a434d39d8d
        with:
          tool: cargo-nextest@0.9.138

      - name: Build identified RustFS binary
        run: python3 scripts/e2e_binary.py build --bins --features e2e-test-hooks

      - name: Verify profile and exact selection
        id: selection
        shell: bash
        env:
          PROFILE_LIST: ${{ runner.temp }}/tls-get-distributed-list.json
          SELECTED_LIST: ${{ runner.temp }}/tls-get-selected-list.json
        run: |
          set -euo pipefail
          test ! -e "$PROFILE_LIST"
          test ! -L "$PROFILE_LIST"
          test ! -e "$SELECTED_LIST"
          test ! -L "$SELECTED_LIST"
          echo 'fresh=true' >> "$GITHUB_OUTPUT"
          cargo nextest list --profile e2e-distributed -p e2e_test --message-format json > "$PROFILE_LIST"
          python3 scripts/check_test_wiring.py --check-profile e2e-distributed "$PROFILE_LIST"
          cargo nextest list --profile e2e-distributed -p e2e_test -E "$FILTER" --message-format json > "$SELECTED_LIST"
          python3 - "$SELECTED_LIST" <<'PY'
          import json
          import sys

          with open(sys.argv[1], encoding="utf-8") as listing:
              data = json.load(listing)
          selected = [
              (suite_id, name, case)
              for suite_id, suite in data["rust-suites"].items()
              for name, case in suite["testcases"].items()
              if case.get("filter-match", {}).get("status") == "matches"
          ]
          expected = "distributed::internode_tls_test::four_node_tls_large_and_range_gets_preserve_bytes"
          if len(selected) != 1 or selected[0][:2] != ("e2e_test", expected):
              raise SystemExit("expected exactly the named TLS GET test")
          if selected[0][2].get("kind") != "test" or selected[0][2].get("ignored") is not False:
              raise SystemExit("the selected TLS GET test must be runnable")
          print("Selected exactly one TLS GET test")
          PY

      # This case starts scanner and heal; normal background MRF may run.
      # It does not select the rejected coordinator RPC or MRF release tests.
      - name: Run single TLS GET diagnostic
        id: diagnostic
        shell: bash
        env:
          TMPDIR: ${{ runner.temp }}/tls-get-fixtures
          RUSTFS_E2E_LOG_DIR: ${{ runner.temp }}/tls-get-node-logs
          RUSTFS_E2E_TLS_GET_OBSERVATION_DIR: ${{ runner.temp }}/tls-get-observation
        run: |
          set -euo pipefail
          unset RUSTFS_INTERNODE_ACCEPTANCE_REPORT
          test ! -e target/nextest/e2e-distributed/junit.xml
          test ! -L target/nextest/e2e-distributed/junit.xml
          test ! -e "${RUNNER_TEMP}/tls-get-nextest.log"
          test ! -L "${RUNNER_TEMP}/tls-get-nextest.log"
          umask 077
          mkdir -m 0700 "$TMPDIR"
          mkdir -m 0700 "$RUSTFS_E2E_LOG_DIR"
          mkdir -m 0700 "$RUSTFS_E2E_TLS_GET_OBSERVATION_DIR"
          TMPDIR=$(realpath -e -- "$TMPDIR")
          RUSTFS_E2E_LOG_DIR=$(realpath -e -- "$RUSTFS_E2E_LOG_DIR")
          RUSTFS_E2E_TLS_GET_OBSERVATION_DIR=$(realpath -e -- "$RUSTFS_E2E_TLS_GET_OBSERVATION_DIR")
          export TMPDIR RUSTFS_E2E_LOG_DIR RUSTFS_E2E_TLS_GET_OBSERVATION_DIR
          python3 - "$TMPDIR" "$RUSTFS_E2E_LOG_DIR" "$RUSTFS_E2E_TLS_GET_OBSERVATION_DIR" <<'PY'
          import os
          from pathlib import Path
          import stat
          import sys

          roots = [Path(value).resolve(strict=True) for value in sys.argv[1:]]
          for root in roots:
              metadata = root.stat()
              if not stat.S_ISDIR(metadata.st_mode) or metadata.st_uid != os.getuid() or stat.S_IMODE(metadata.st_mode) != 0o700:
                  raise SystemExit("diagnostic directories must be private and owned by the runner")
          for index, root in enumerate(roots):
              for other in roots[index + 1:]:
                  if root == other or root in other.parents or other in root.parents:
                      raise SystemExit("fixture, log, and observation directories must be independent")
          print("Fixture, log, and observation directories are private and independent")
          PY
          echo 'ready=true' >> "$GITHUB_OUTPUT"
          python3 scripts/e2e_binary.py run --features e2e-test-hooks -- \
            cargo nextest run --profile e2e-distributed -p e2e_test -E "$FILTER" \
            --no-tests=fail --success-output=final --failure-output=final \
            2>&1 | tee "${RUNNER_TEMP}/tls-get-nextest.log"
          test -s target/nextest/e2e-distributed/junit.xml
          python3 - target/nextest/e2e-distributed/junit.xml <<'PY'
          import sys
          import xml.etree.ElementTree as ET

          root = ET.parse(sys.argv[1]).getroot()
          suites = root.findall("testsuite")
          cases = root.findall(".//testcase")
          expected = "distributed::internode_tls_test::four_node_tls_large_and_range_gets_preserve_bytes"
          if root.tag != "testsuites" or any(root.get(key) != value for key, value in (
              ("tests", "1"), ("failures", "0"), ("errors", "0")
          )):
              raise SystemExit("JUnit totals do not prove one successful test")
          if len(suites) != 1 or any(suites[0].get(key) != value for key, value in (
              ("name", "e2e_test"), ("tests", "1"), ("failures", "0"), ("errors", "0"), ("disabled", "0")
          )):
              raise SystemExit("JUnit suite does not prove one successful test")
          if len(cases) != 1 or cases[0].get("name") != expected or cases[0].get("classname") != "e2e_test":
              raise SystemExit("JUnit did not report the exact TLS GET test")
          bad = {"failure", "error", "skipped", "flakyFailure", "rerunFailure", "rerunError"}
          if any(element.tag.rsplit("}", 1)[-1] in bad for element in root.iter()):
              raise SystemExit("JUnit contains a failed, skipped, or retried test")
          print("JUnit confirms the exact test passed")
          PY

      - name: Preserve selection listings
        if: always() && steps.selection.outputs.fresh == 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: tls-get-selection-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/tls-get-distributed-list.json
            ${{ runner.temp }}/tls-get-selected-list.json
          retention-days: 7
          if-no-files-found: warn

      - name: Preserve diagnostic logs
        if: always() && steps.diagnostic.outputs.ready == 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: tls-get-observation-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            target/nextest/e2e-distributed/junit.xml
            ${{ runner.temp }}/tls-get-nextest.log
            ${{ runner.temp }}/tls-get-node-logs/internode-tls-*/node-0.log
            ${{ runner.temp }}/tls-get-node-logs/internode-tls-*/node-1.log
            ${{ runner.temp }}/tls-get-node-logs/internode-tls-*/node-2.log
            ${{ runner.temp }}/tls-get-node-logs/internode-tls-*/node-3.log
          retention-days: 7
          if-no-files-found: warn
