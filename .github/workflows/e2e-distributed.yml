# Temporary, manually dispatched diagnostic for one distributed TLS case.
# The workflow branch carries only the observer; both builds use the fixed source.
name: Distributed TLS resource observation

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  observe:
    if: github.repository == 'rustfs/rustfs'
    runs-on: ubuntu-latest
    timeout-minutes: 180
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
      NO_PROXY: 127.0.0.1,localhost
      HTTP_PROXY: ""
      HTTPS_PROXY: ""
    steps:
      - name: Check isolated checkout paths
        run: |
          test ! -e observer-source
          test ! -L observer-source
          test ! -e test-source
          test ! -L test-source

      - name: Checkout observer
        uses: actions/checkout@f548e57e544e1ff5a4c46bf1e1b8685f8e4a348a # v7
        with:
          path: observer-source
          clean: false
          persist-credentials: false

      - name: Stage observer outside source
        env:
          WORKFLOW_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          test "$(git -C observer-source rev-parse HEAD)" = "$WORKFLOW_SHA"
          mkdir -p "$RUNNER_TEMP/tls-private" "$RUNNER_TEMP/tls-evidence"
          chmod 700 "$RUNNER_TEMP/tls-private"
          cp observer-source/.github/scripts/observe_tls_resource.py "$RUNNER_TEMP/tls-private/observer.py"
          python3 - <<'PY'
          import hashlib, json, os
          from pathlib import Path
          workflow = Path('observer-source/.github/workflows/e2e-distributed.yml').read_bytes()
          observer = Path('observer-source/.github/scripts/observe_tls_resource.py').read_bytes()
          result = {'workflow_commit': os.environ['WORKFLOW_SHA'],
                    'workflow_sha256': hashlib.sha256(workflow).hexdigest(),
                    'observer_sha256': hashlib.sha256(observer).hexdigest()}
          Path(os.environ['RUNNER_TEMP'], 'tls-evidence', 'workflow-identity.json').write_text(json.dumps(result, sort_keys=True) + '\n')
          PY

      - name: Checkout fixed test source
        id: source
        uses: actions/checkout@f548e57e544e1ff5a4c46bf1e1b8685f8e4a348a # v7
        with:
          ref: fedc9666123076f2b985d75a9c290f6496ef8717
          path: test-source
          clean: false
          persist-credentials: false

      - name: Verify source commit and tree
        id: identity
        working-directory: test-source
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = fedc9666123076f2b985d75a9c290f6496ef8717
          test "$(git rev-parse 'HEAD^{tree}')" = 1ea486f6d6a86ce488b83cab4a1b232188ab9708
          test -z "$(git status --porcelain=v1 --untracked-files=all)"

      # The repository's composite setup defaults its cache workspace to the
      # checkout root. These are the same pinned tools, with the cache scoped
      # explicitly to the independent source checkout.
      - name: Install system dependencies
        id: dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential pkg-config libssl-dev ripgrep

      - name: Install protoc
        id: protoc
        uses: rustfs/setup-protoc@a3705324d8f9bf5b6c3573fb6cf8ae421db55dd6 # v3.0.1
        with:
          version: "35.1"
          repo-token: ${{ github.token }}

      - name: Install flatc
        id: flatc
        uses: Nugine/setup-flatc@698800de72a96bfb22cf60431dc21a2ff9a7e07b # v1
        with:
          version: "25.12.19"

      - name: Install Rust toolchain
        id: rust
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
        with:
          toolchain: stable
          components: rustfmt, clippy

      - name: Install cargo-nextest
        id: nextest
        uses: taiki-e/install-action@96c7780c1d8a2b8723e12031def873a434d39d8d # nextest
        with:
          tool: cargo-nextest@0.9.138

      - name: Restore Rust cache
        id: setup
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          workspaces: test-source -> target
          shared-key: ci-e2e-distributed-hosted
          cache-all-crates: false
          cache-on-failure: true
          save-if: false

      # Match the original distributed lane; this case keeps its disks in the
      # normal temporary directory, not in these otherwise empty pool mounts.
      - name: Prepare isolated pool filesystems
        id: mounts
        run: |
          set -euo pipefail
          roots=()
          for pool in 0 1 2 3; do
            mountpoint="$RUNNER_TEMP/rustfs-e2e-pools/pool-$pool"
            mkdir -p "$mountpoint"
            sudo mount -t tmpfs -o size=1G,nosuid,nodev,mode=1777 tmpfs "$mountpoint"
            sudo chmod 1777 "$mountpoint"
            roots+=("$mountpoint")
          done
          printf -v joined_roots '%s:' "${roots[@]}"
          echo "RUSTFS_E2E_POOL_ROOTS=${joined_roots%:}" >> "$GITHUB_ENV"

      - name: Build identified server
        id: build
        working-directory: test-source
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = fedc9666123076f2b985d75a9c290f6496ef8717
          test -z "$(git status --porcelain=v1 --untracked-files=all)"
          if ! python3 scripts/e2e_binary.py build --bins --features e2e-test-hooks >"$RUNNER_TEMP/tls-private/build.log" 2>&1; then
            echo "Server build failed; raw output withheld."
            exit 1
          fi

      - name: Observe the single TLS test
        id: observe
        working-directory: test-source
        env:
          WORKFLOW_SHA: ${{ github.sha }}
          RUN_ID: ${{ github.run_id }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
        run: python3 "$RUNNER_TEMP/tls-private/observer.py"

      - name: Record workflow stage outcomes
        if: always()
        env:
          SOURCE_RESULT: ${{ steps.source.outcome }}
          IDENTITY_RESULT: ${{ steps.identity.outcome }}
          DEPENDENCIES_RESULT: ${{ steps.dependencies.outcome }}
          PROTOC_RESULT: ${{ steps.protoc.outcome }}
          FLATC_RESULT: ${{ steps.flatc.outcome }}
          RUST_RESULT: ${{ steps.rust.outcome }}
          NEXTEST_RESULT: ${{ steps.nextest.outcome }}
          SETUP_RESULT: ${{ steps.setup.outcome }}
          MOUNTS_RESULT: ${{ steps.mounts.outcome }}
          BUILD_RESULT: ${{ steps.build.outcome }}
          OBSERVE_RESULT: ${{ steps.observe.outcome }}
        run: |
          mkdir -p "$RUNNER_TEMP/tls-evidence"
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          allowed = {'success', 'failure', 'cancelled', 'skipped'}
          names = ('SOURCE', 'IDENTITY', 'DEPENDENCIES', 'PROTOC', 'FLATC', 'RUST', 'NEXTEST', 'SETUP', 'MOUNTS', 'BUILD', 'OBSERVE')
          outcomes = {name.lower(): os.environ.get(name + '_RESULT') for name in names}
          outcomes = {name: value if value in allowed else 'missing' for name, value in outcomes.items()}
          Path(os.environ['RUNNER_TEMP'], 'tls-evidence', 'stages.json').write_text(json.dumps(outcomes, sort_keys=True) + '\n')
          PY

      - name: Upload sanitized numerical evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: tls-resource-observation-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/tls-evidence/
          retention-days: 7
          if-no-files-found: error

      - name: Unmount isolated pool filesystems
        if: always()
        run: |
          set -euo pipefail
          for pool in 0 1 2 3; do
            mountpoint="$RUNNER_TEMP/rustfs-e2e-pools/pool-$pool"
            if mountpoint --quiet "$mountpoint"; then
              sudo umount "$mountpoint"
            fi
          done
