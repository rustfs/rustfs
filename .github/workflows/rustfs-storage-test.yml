name: RustFS Storage Engine Test

on:
  workflow_call:
    inputs:
      chain_manifest:
        description: Verified candidate and chain attempt from the chain driver
        type: string
        required: true
  workflow_dispatch:
    inputs:
      rustfs_version:
        description: 'RustFS release tag to test. Leave empty for nightly.'
        required: false
        default: ''
      package_url:
        description: 'Direct .deb URL (nightly/R2/dev). Overrides rustfs_version.'
        required: false
        type: string
      topology:
        description: 'Topology to run (all = SNSD, SNMD, MNMD)'
        type: choice
        options:
          - all
          - single-single
          - single-multi
          - multi-multi
        default: all

permissions:
  contents: read

concurrency:
  group: rustfs-shared-functional-tests-v2
  cancel-in-progress: false

defaults:
  run:
    shell: bash

env:
  RUSTFS_ACCESS_KEY: ${{ secrets.RUSTFS_ACCESS_KEY }}
  RUSTFS_SECRET_KEY: ${{ secrets.RUSTFS_SECRET_KEY }}
  RUSTFS_NODES: ${{ secrets.RUSTFS_NODES || vars.RUSTFS_NODES }}
  RUSTFS_SSH_USER: ${{ secrets.RUSTFS_SSH_USER || vars.RUSTFS_SSH_USER }}
  RUSTFS_NIGHTLY_PACKAGE_URL: ${{ vars.RUSTFS_NIGHTLY_PACKAGE_URL || 'https://dl.rustfs.com/artifacts/rustfs/packages/nightly/rustfs-nightly-latest.deb' }}
  PF_TESTING_GH_TOKEN: ${{ secrets.PF_TESTING_GH_TOKEN }}

jobs:
  storage-test:
    runs-on: smoke-testing
    timeout-minutes: 60
    if: ${{ inputs.chain_manifest != '' || github.event_name == 'workflow_dispatch' }}
    steps:
      - name: Checkout repository (for report parser)
        uses: actions/checkout@f548e57e544e1ff5a4c46bf1e1b8685f8e4a348a # v7
        with:
          persist-credentials: false

      - name: Initialize functional evidence
        id: evidence
        run: |
          set -euo pipefail
          umask 077
          FUNCTIONAL_ARTIFACTS_DIR="${RUNNER_TEMP}/rustfs-storage-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          mkdir -- "${FUNCTIONAL_ARTIFACTS_DIR}" "${FUNCTIONAL_ARTIFACTS_DIR}-scratch"
          {
            printf 'FUNCTIONAL_ARTIFACTS_DIR=%s\n' "${FUNCTIONAL_ARTIFACTS_DIR}"
            printf 'LOG_FILE=%s/suite.log\n' "${FUNCTIONAL_ARTIFACTS_DIR}"
            printf 'REPORT_FILE=%s/report.md\n' "${FUNCTIONAL_ARTIFACTS_DIR}"
            printf 'TMPDIR=%s-scratch\n' "${FUNCTIONAL_ARTIFACTS_DIR}"
          } >> "${GITHUB_ENV}"

      - name: Bind functional candidate
        id: chain
        if: ${{ inputs.chain_manifest != '' }}
        env:
          CHAIN_MANIFEST: ${{ inputs.chain_manifest }}
        run: python3 scripts/functional_chain_evidence.py consume

      - name: Checkout auto-testing scripts
        uses: actions/checkout@f548e57e544e1ff5a4c46bf1e1b8685f8e4a348a # v7
        with:
          repository: rustfs/auto-testing
          ref: ${{ steps.chain.outputs.testing_sha || 'main' }}
          token: ${{ secrets.PF_TESTING_GH_TOKEN }}
          path: auto-testing
          persist-credentials: false

      - name: Show environment
        run: |
          uname -a
          jq --version
          openssl version
          df -h /data | tail -1

      - name: Admit clean shared environment
        id: environment
        timeout-minutes: 5
        env:
          FUNCTIONAL_ENVIRONMENT_RECEIPT: ${{ runner.temp }}/environment-storage.json
        run: python3 scripts/functional_environment.py enter --suite storage

      - name: Cleanup environment (before)
        timeout-minutes: 5
        run: |
          set -euo pipefail
          read -r -a NODES <<< "${RUSTFS_NODES:-vm000 vm001 vm002}"
          SSH_USER="${RUSTFS_SSH_USER:-azureuser}"
          for node in "${NODES[@]}"; do
            ssh -o BatchMode=yes -o ConnectTimeout=10 -o StrictHostKeyChecking=accept-new "${SSH_USER}@${node}" '
              set -euo pipefail
              SUDO=""; [ "$(id -u)" -ne 0 ] && SUDO="sudo -n"
              ${SUDO} systemctl stop rustfs 2>/dev/null || true
              if ${SUDO} dpkg -l rustfs 2>/dev/null | grep -q "^ii"; then
                ${SUDO} dpkg -P rustfs
              fi
              for i in 1 2 3 4; do ${SUDO} rm -rf /data/rustfs${i}/mnmd; done
              ${SUDO} rm -rf /var/log/rustfs /var/lib/rustfs/kms /var/lib/rustfs/kms-backup
            '
          done

      - name: Run storage engine suite
        id: test
        timeout-minutes: 45
        # Collect reports and backlog evidence before the final suite verdict.
        continue-on-error: true
        run: |
          set -euo pipefail
          chmod +x auto-testing/rustfs-storage-test.sh
          PACKAGE_URL='${{ inputs.package_url }}'
          RUSTFS_VERSION='${{ inputs.rustfs_version }}'
          TOPOLOGY='${{ inputs.topology }}'
          ARGS=(-y --log-file "${LOG_FILE}")
          if [ "${TOPOLOGY}" = "all" ] || [ -z "${TOPOLOGY}" ] || [ "${TOPOLOGY}" = "null" ]; then
            ARGS+=(--all-topologies)
          else
            ARGS+=(--topology "${TOPOLOGY}")
          fi
          if [ -n "${PACKAGE_URL}" ]; then
            ARGS+=(--package-url "${PACKAGE_URL}")
          elif [ -n "${RUSTFS_VERSION}" ]; then
            ARGS+=(--version "${RUSTFS_VERSION}")
          else
            ARGS+=(--package-url "${RUSTFS_NIGHTLY_PACKAGE_URL}")
          fi
          ./auto-testing/rustfs-storage-test.sh "${ARGS[@]}"

      - name: Generate report
        id: chain_report
        timeout-minutes: 2
        if: ${{ always() && steps.evidence.outcome == 'success' }}
        run: |
          set -euo pipefail
          PACKAGE_URL='${{ inputs.package_url }}'
          RUSTFS_VERSION='${{ inputs.rustfs_version }}'
          if [ -n "${PACKAGE_URL}" ]; then
            PACKAGE_SOURCE="${PACKAGE_URL}"
          elif [ -n "${RUSTFS_VERSION}" ]; then
            PACKAGE_SOURCE="version ${RUSTFS_VERSION}"
          else
            PACKAGE_SOURCE="${RUSTFS_NIGHTLY_PACKAGE_URL}"
          fi
          read -r -a NODES <<< "${RUSTFS_NODES:-vm000 vm001 vm002}"
          SSH_USER="${RUSTFS_SSH_USER:-azureuser}"
          RUSTFS_VERSION_INFO="N/A"
          if [ "${#NODES[@]}" -gt 0 ]; then
            DETECTED_VERSION="$(ssh -o BatchMode=yes -o ConnectTimeout=10 -o StrictHostKeyChecking=accept-new \
              "${SSH_USER}@${NODES[0]}" 'rustfs --version' 2>/dev/null | tr -d '\r' | head -n 1 || true)"
            if [ -n "${DETECTED_VERSION}" ]; then
              RUSTFS_VERSION_INFO="${DETECTED_VERSION}"
            fi
          fi
          CASE_TABLE="${FUNCTIONAL_ARTIFACTS_DIR}/cases.md"
          CASE_RESULT=success
          python3 scripts/functional_case_report.py "${LOG_FILE}" "${CASE_TABLE}" || CASE_RESULT=failure
          RESULT=failure
          if [ '${{ steps.test.outcome }}' = 'success' ] && [ "${CASE_RESULT}" = 'success' ]; then
            RESULT=success
          fi

          # Report harness completion here; the final verdict checks every
          # case result after diagnostics and cleanup have been retained.
          CASES_TOTAL="$(grep -cE '^\| [A-Z][A-Z0-9]*-[0-9]+ .*\| (PASS|FAIL|UNSUPPORTED|RUNNING) \|' "${CASE_TABLE}" 2>/dev/null || true)"
          CASES_FAIL="$(grep -cE '^\| [A-Z][A-Z0-9]*-[0-9]+ .*\| FAIL \|' "${CASE_TABLE}" 2>/dev/null || true)"
          CASES_TOTAL=$(( ${CASES_TOTAL:-0} + 0 )); CASES_FAIL=$(( ${CASES_FAIL:-0} + 0 ))
          CASES_PASS=$(( CASES_TOTAL - CASES_FAIL ))
          HARNESS_OK=0
          if [ '${{ steps.test.outcome }}' = 'success' ]; then
            HARNESS_OK=1
          elif [ '${{ steps.test.outcome }}' = 'failure' ] && [ "${CASES_TOTAL}" -gt 0 ] && [ "${CASES_PASS}" -ge 1 ]; then
            HARNESS_OK=1
          fi
          {
            echo "# RustFS storage engine test report"
            echo ""
            echo "- Run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
            echo "- Attempt: ${GITHUB_RUN_ATTEMPT}"
            echo "- Workflow Commit: ${GITHUB_SHA}"
            echo "- Trigger: ${{ github.event_name }}"
            echo "- Package: ${PACKAGE_SOURCE}"
            echo "- RustFS Version: ${RUSTFS_VERSION_INFO}"
            echo "- Test Step Outcome: ${RESULT}"
            echo "- Suite Step Outcome: ${{ steps.test.outcome }}"
            echo ""
            if [ -s "${CASE_TABLE}" ]; then
              cat "${CASE_TABLE}"
              echo ""
            fi
            echo "- Product result: ${CASES_PASS} passed, ${CASES_FAIL} failed (failing cases are tracked in rustfs/backlog)"
            echo ""
            if [ -s "${CASE_TABLE}" ]; then
              echo "## Log tail"
              echo '```text'
              tail -n 200 "${LOG_FILE}" 2>/dev/null || true
              echo '```'
            else
              echo "The suite or evidence validation failed. See this run's artifact for partial case results and suite.log."
            fi
          } | tee "${REPORT_FILE}"
          cat "${REPORT_FILE}" >> "${GITHUB_STEP_SUMMARY}"
          # Preserve the harness verdict separately from the final case verdict.
          [ "${HARNESS_OK}" = "1" ]

      - name: Upload functional report to dashboard
        timeout-minutes: 2
        if: ${{ always() && steps.evidence.outcome == 'success' }}
        continue-on-error: true
        env:
          GH_TOKEN: ${{ env.PF_TESTING_GH_TOKEN }}
          SUITE: storage
        run: |
          set -euo pipefail
          if [ -z "${GH_TOKEN:-}" ]; then
            echo "PF_TESTING_GH_TOKEN is not configured; skipping dashboard upload"
            exit 0
          fi
          DATE="$(date -u +%Y-%m-%d)"
          REPORT_PATH="functional-reports/${SUITE}/${DATE}.md"
          # Base64-encode the report into a temp file and feed it to jq via
          # --rawfile: large reports (e.g. pool) exceed the OS argv limit and
          # make `jq --arg content "${CONTENT}"` fail with "Argument list too long".
          B64_FILE="$(mktemp)"
          python3 -c 'import base64,sys;print(base64.b64encode(open(sys.argv[1],"rb").read()).decode())' "${REPORT_FILE}" > "${B64_FILE}"
          SHA="$(gh api "repos/rustfs/dashboard/contents/${REPORT_PATH}" -q '.sha' 2>/dev/null || true)"
          if [ -n "${SHA}" ]; then
            jq -n --arg msg "report(${SUITE}): ${DATE}" --rawfile content "${B64_FILE}" --arg sha "${SHA}" \
              '{message:$msg, content:($content|rtrimstr("\n")), sha:$sha}' \
              | gh api --method PUT "repos/rustfs/dashboard/contents/${REPORT_PATH}" --input - >/dev/null
          else
            jq -n --arg msg "report(${SUITE}): ${DATE}" --rawfile content "${B64_FILE}" \
              '{message:$msg, content:($content|rtrimstr("\n"))}' \
              | gh api --method PUT "repos/rustfs/dashboard/contents/${REPORT_PATH}" --input - >/dev/null
          fi
          rm -f "${B64_FILE}"

      - name: Manage backlog issues (dedup / label / auto-close)
        timeout-minutes: 2
        # Replaces the old per-run failure filing. One entry point that:
        # - dedups by signal: failing cases are matched against open backlog
        #   issues by label (category + case ID); covered cases become a
        #   comment on the existing issue, only uncovered cases file a new one
        # - labels new issues (functional-test, category, case IDs, env)
        # - closes fixed issues after a fully green run
        # - never files or closes on cancelled runs
        if: ${{ always() && steps.evidence.outcome == 'success' }}
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.PF_TESTING_GH_TOKEN }}
          SUITE: 'storage'
          SUITE_LABEL: 'Storage engine'
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          if [ -z "${GH_TOKEN:-}" ]; then
            echo "PF_TESTING_GH_TOKEN is not configured; skipping backlog issue management"
            exit 0
          fi
          if [ ! -f auto-testing/scripts/issue_manager.py ]; then
            echo "issue_manager.py not found in auto-testing checkout; skipping"
            exit 0
          fi
          PACKAGE_URL='${{ inputs.package_url }}'
          RUSTFS_VERSION='${{ inputs.rustfs_version }}'
          PACKAGE_SOURCE=""
          if [ -n "${PACKAGE_URL}" ]; then
            PACKAGE_SOURCE="${PACKAGE_URL}"
          elif [ -n "${RUSTFS_VERSION}" ]; then
            PACKAGE_SOURCE="version ${RUSTFS_VERSION}"
          else
            PACKAGE_SOURCE="${RUSTFS_NIGHTLY_PACKAGE_URL}"
          fi
          python3 auto-testing/scripts/issue_manager.py handle \
            --repo rustfs/backlog \
            --suite "${SUITE}" --category "${SUITE}" --suite-label "${SUITE_LABEL}" \
            --outcome "${{ steps.test.outcome }}" \
            --report "${FUNCTIONAL_ARTIFACTS_DIR}/cases.md" \
            --report-file "${REPORT_FILE}" \
            --log "${LOG_FILE}" \
            --run-url "${RUN_URL}/attempts/${GITHUB_RUN_ATTEMPT}#summary" \
            --run-id "${GITHUB_RUN_ID}" \
            --attempt "${GITHUB_RUN_ATTEMPT}" \
            --commit "${GITHUB_SHA}" \
            --trigger "${{ github.event_name }}" \
            --package-source "${PACKAGE_SOURCE}" \
            --date "$(date -u +%Y-%m-%d)"

      - name: Upload report and logs
        timeout-minutes: 2
        if: ${{ always() && steps.evidence.outcome == 'success' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: rustfs-storage-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ env.FUNCTIONAL_ARTIFACTS_DIR }}/report.md
            ${{ env.FUNCTIONAL_ARTIFACTS_DIR }}/suite.log
            ${{ env.FUNCTIONAL_ARTIFACTS_DIR }}/cases.md
          if-no-files-found: error

      - name: Cleanup environment (after)
        id: environment_cleanup
        timeout-minutes: 5
        if: ${{ always() && steps.environment.outcome == 'success' }}
        run: |
          set -euo pipefail
          read -r -a NODES <<< "${RUSTFS_NODES:-vm000 vm001 vm002}"
          SSH_USER="${RUSTFS_SSH_USER:-azureuser}"
          for node in "${NODES[@]}"; do
            ssh -o BatchMode=yes -o ConnectTimeout=10 -o StrictHostKeyChecking=accept-new "${SSH_USER}@${node}" '
              set -euo pipefail
              SUDO=""; [ "$(id -u)" -ne 0 ] && SUDO="sudo -n"
              ${SUDO} systemctl stop rustfs 2>/dev/null || true
              if ${SUDO} dpkg -l rustfs 2>/dev/null | grep -q "^ii"; then
                ${SUDO} dpkg -P rustfs
              fi
              for i in 1 2 3 4; do ${SUDO} rm -rf /data/rustfs${i}/mnmd; done
              ${SUDO} rm -rf /var/log/rustfs
            '
          done

      - name: Release environment only after successful cleanup
        if: ${{ always() && steps.environment.outcome == 'success' }}
        timeout-minutes: 5
        env:
          FUNCTIONAL_ENVIRONMENT_RECEIPT: ${{ runner.temp }}/environment-storage.json
          CLEANUP_OUTCOME: ${{ steps.environment_cleanup.outcome }}
        run: python3 scripts/functional_environment.py finish --suite storage --cleanup-outcome "$CLEANUP_OUTCOME"

      - name: Retain environment ownership and cleanup receipt
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: functional-environment-storage-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/environment-storage.json
          if-no-files-found: error

      - name: Notify on failure
        if: failure()
        run: |
          echo "RustFS storage engine suite failed"
          echo "See the uploaded report and log artifacts for details."

      - name: Record chain evidence
        id: chain_record
        if: ${{ always() && inputs.chain_manifest != '' && steps.evidence.outcome == 'success' }}
        env:
          CHAIN_MANIFEST: ${{ inputs.chain_manifest }}
          CHAIN_JOB_STATUS: ${{ job.status }}
          CHAIN_TEST_OUTCOME: ${{ steps.test.outcome }}
          CHAIN_REPORT_OUTCOME: ${{ steps.chain_report.outcome }}
        run: >-
          python3 scripts/functional_chain_evidence.py record --suite storage
          --report "${FUNCTIONAL_ARTIFACTS_DIR}/cases.md"
          --output "${RUNNER_TEMP}/chain-storage-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}/storage.json"

      - name: Upload chain evidence
        if: ${{ always() && steps.chain_record.outputs.written == 'true' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: functional-chain-storage-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/chain-storage-${{ github.run_id }}-${{ github.run_attempt }}/storage.json
          if-no-files-found: error

      - name: Enforce suite and report result
        if: ${{ always() }}
        env:
          SUITE_OUTCOME: ${{ steps.test.outcome }}
          REPORT_OUTCOME: ${{ steps.chain_report.outcome }}
        run: |
          test "$SUITE_OUTCOME" = success
          test "$REPORT_OUTCOME" = success
          python3 scripts/functional_chain_evidence.py verify-report --suite storage --report "${FUNCTIONAL_ARTIFACTS_DIR}/cases.md"
