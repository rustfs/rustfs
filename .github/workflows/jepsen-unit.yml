name: Jepsen unit

on:
  pull_request:
    paths:
      - "jepsen/**"
      - ".github/workflows/jepsen-unit.yml"
  push:
    branches: [main]
    paths:
      - "jepsen/**"
      - ".github/workflows/jepsen-unit.yml"

jobs:
  lein-test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@f548e57e544e1ff5a4c46bf1e1b8685f8e4a348a # v7
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        with:
          distribution: temurin
          java-version: "21"
      - name: Install Leiningen
        run: |
          set -euo pipefail
          mkdir -p "$HOME/bin"
          curl -fsSL -o "$HOME/bin/lein" https://raw.githubusercontent.com/technomancy/leiningen/2.11.2/bin/lein
          chmod +x "$HOME/bin/lein"
          echo "$HOME/bin" >> "$GITHUB_PATH"
          lein version
      - name: Run Jepsen checker tests
        working-directory: jepsen
        run: lein test
