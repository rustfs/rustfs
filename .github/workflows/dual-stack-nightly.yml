# Nightly both-stack diff of the two e2e profiles only ci.yml runs, e2e-smoke
# and e2e-full (rustfs/backlog#2772, T3.1). The other profiles carry a `stack`
# dimension in their own workflows, where the existing lane is the legacy leg.
#
# One build serves every leg. One preflight starts that binary with
# RUSTFS_S3_STACK=gateway (scripts/dual_stack.py preflight); without a proven
# gateway start the gateway legs do not run and the summary says `skipped:
# gateway stack refuses startup: <why>`. Which stack a leg ran is read from the
# servers' own start-up line. The gateway legs are report-only until T2.10.
#
# Left out of both stacks: `dual_stack_differential::` (servers with an explicit
# stack), `fake_s3_target::`, the upgrade write-readiness cases and one deadline
# case (no server), and `distributed_startup_regression_test::` (needs ci.yml's
# hooks-binary manifest). Both e2e-full stacks use ci.yml's pinned mc and
# Vault binaries and network fault-injection tools.

name: dual-stack-nightly

on:
  workflow_dispatch:
  schedule:
    # 03:13 UTC nightly, clear of e2e-nightly (04:29), the ODM lane (05:23) and
    # e2e-distributed (05:53).
    - cron: "13 3 * * *"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name != 'schedule' }}

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  build:
    name: Build once and probe the gateway stack
    if: github.repository == 'rustfs/rustfs'
    # The runner and cache of ci.yml's build-rustfs-debug-binary.
    runs-on: sm-standard-4
    timeout-minutes: 60
    outputs:
      stacks: ${{ steps.preflight.outputs.stacks }}
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
    steps:
      - name: Checkout repository
        uses: actions/checkout@f548e57e544e1ff5a4c46bf1e1b8685f8e4a348a # v7
        with:
          persist-credentials: false

      - name: Setup Rust environment
        uses: ./.github/actions/setup
        with:
          rust-version: stable
          cache-shared-key: ci-dev
          cache-save-if: 'false'
          install-build-packaging-tools: 'false'

      - name: Build the rustfs binary
        run: python3 scripts/e2e_binary.py build --bins --features e2e-test-hooks

      - name: Upload the binary
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dual-stack-binary
          path: |
            target/debug/rustfs
            target/debug/rustfs.e2e.json
          if-no-files-found: error
          retention-days: 1

      # Without a proven gateway start there is no gateway leg to run.
      - name: Gateway preflight
        id: preflight
        run: |
          if python3 scripts/dual_stack.py preflight --binary target/debug/rustfs --out "$RUNNER_TEMP/preflight/stack.json"; then
            echo 'stacks=["legacy","gateway"]' >> "$GITHUB_OUTPUT"
          else
            echo 'stacks=["legacy"]' >> "$GITHUB_OUTPUT"
          fi

      # The evidence stands in for a gateway leg that is skipped; a leg that runs overwrites it.
      - name: Upload the preflight evidence for e2e-smoke
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dual-stack-leg-e2e-smoke-gateway
          path: ${{ runner.temp }}/preflight
          if-no-files-found: warn
          retention-days: 7

      - name: Upload the preflight evidence for e2e-full
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dual-stack-leg-e2e-full-gateway
          path: ${{ runner.temp }}/preflight
          if-no-files-found: warn
          retention-days: 7

  leg:
    name: ${{ matrix.profile }} (${{ matrix.stack }}${{ matrix.stack == 'gateway' && ', report-only until T2.10' || '' }})
    needs: [ build ]
    runs-on: sm-standard-4
    timeout-minutes: 120
    # Report-only until T2.10: the gateway stack cannot serve the suites yet.
    continue-on-error: ${{ matrix.stack == 'gateway' }}
    strategy:
      fail-fast: false
      matrix:
        profile: [ e2e-smoke, e2e-full ]
        stack: ${{ fromJSON(needs.build.outputs.stacks) }}
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
    steps:
      - name: Checkout repository
        uses: actions/checkout@f548e57e544e1ff5a4c46bf1e1b8685f8e4a348a # v7
        with:
          persist-credentials: false

      - name: Setup Rust environment
        uses: ./.github/actions/setup
        with:
          rust-version: stable
          cache-shared-key: ci-dev
          cache-save-if: 'false'
          install-build-packaging-tools: 'false'

      - name: Download the binary
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: dual-stack-binary
          path: target/debug

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Install awscurl
        run: |
          python3 -m pip install --user --upgrade pip "awscurl==0.44"
          echo "AWSCURL_PATH=$HOME/.local/bin/awscurl" >> "$GITHUB_ENV"
          test -x "$HOME/.local/bin/awscurl"

      - name: Install network fault-injection tools
        if: matrix.profile == 'e2e-full'
        run: |
          sudo apt-get install -y iptables
          sudo -n iptables --version
          # The endpoint-blackhole heal scenario needs CAP_NET_ADMIN. Containerised
          # runners can run iptables but not touch the rule set; the test then logs
          # a skip instead of failing, so surface that here where it is visible.
          if ! sudo -n iptables -w 5 -S OUTPUT >/dev/null 2>&1; then
            echo "::warning::iptables cannot read the OUTPUT chain on this runner (no CAP_NET_ADMIN); the endpoint-blackhole heal scenario will be skipped"
          fi

      - name: Install mc
        if: matrix.profile == 'e2e-full'
        env:
          GH_TOKEN: ${{ github.token }}
          MC_VERSION: RELEASE.2025-08-13T08-35-41Z
          MC_SHA256: 01f866e9c5f9b87c2b09116fa5d7c06695b106242d829a8bb32990c00312e891
        run: |
          if ! command -v gh >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install -y gh
          fi
          MC_BINARY="mc.linux-amd64.${MC_VERSION}"
          python3 .github/actions/setup/download_release_asset.py --repository minio/mc --tag "$MC_VERSION" --asset "$MC_BINARY" --output "$RUNNER_TEMP/mc" --sha256 "$MC_SHA256"
          echo "${MC_SHA256}  $RUNNER_TEMP/mc" | sha256sum --check --status
          chmod +x "$RUNNER_TEMP/mc"
          echo "$RUNNER_TEMP" >> "$GITHUB_PATH"

      - name: Verify mc
        if: matrix.profile == 'e2e-full'
        run: mc --version

      - name: Install Vault
        if: matrix.profile == 'e2e-full'
        run: |
          VAULT_VERSION="1.17.6"
          VAULT_ARCHIVE="vault_${VAULT_VERSION}_linux_amd64.zip"
          curl -fsSLo "$RUNNER_TEMP/$VAULT_ARCHIVE" "https://releases.hashicorp.com/vault/${VAULT_VERSION}/${VAULT_ARCHIVE}"
          echo "0cddc1fbbb88583b5ba5b845f9f8fae47c6fb39a6d48cd543c6ba6fd3ac1a669  $RUNNER_TEMP/$VAULT_ARCHIVE" | sha256sum --check --status
          unzip -q "$RUNNER_TEMP/$VAULT_ARCHIVE" -d "$RUNNER_TEMP/vault-bin"
          echo "RUSTFS_TEST_VAULT_BIN=$RUNNER_TEMP/vault-bin/vault" >> "$GITHUB_ENV"

      - name: Verify Vault
        if: matrix.profile == 'e2e-full'
        run: |
          "$RUSTFS_TEST_VAULT_BIN" version

      - name: Run the profile on the ${{ matrix.stack }} stack
        env:
          PROFILE: ${{ matrix.profile }}
          RUSTFS_S3_STACK: ${{ matrix.stack }}
          RUSTFS_E2E_LOG_DIR: ${{ runner.temp }}/server-logs
        run: |
          chmod +x target/debug/rustfs
          filter='not test(/^(dual_stack_differential|fake_s3_target|distributed_startup_regression_test)::/)'
          filter="$filter & not test(/^upgrade_compatibility_test::upgrade_write_readiness_tests::/)"
          filter="$filter & not test(=list_objects_v2_pagination_test::tests::test_list_objects_v2_deadline_rejects_unresponsive_peer)"
          python3 scripts/e2e_binary.py run --features e2e-test-hooks -- cargo nextest run --profile "$PROFILE" -p e2e_test -E "$filter"

      - name: Prove the stack and upload the leg
        if: always()
        uses: ./.github/actions/dual-stack-leg
        with: { profile: "${{ matrix.profile }}", stack: "${{ matrix.stack }}", logs: "${{ runner.temp }}/server-logs" }

  summary:
    name: Both-stack diff summary
    needs: [ build, leg ]
    if: github.repository == 'rustfs/rustfs' && always()
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@f548e57e544e1ff5a4c46bf1e1b8685f8e4a348a # v7
        with:
          persist-credentials: false

      - uses: ./.github/actions/dual-stack-summary
        with:
          profiles: e2e-smoke,e2e-full
