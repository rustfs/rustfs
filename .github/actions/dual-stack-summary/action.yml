name: Both-stack summary
description: Diff the legacy and gateway legs of this run (scripts/junit_diff.py) and upload one dated summary

inputs:
  profiles:
    description: Comma-separated nextest profiles whose two legs this run uploaded
    required: true

runs:
  using: composite
  steps:
    - name: Download the legs
      uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
      with:
        pattern: dual-stack-leg-*
        path: legs

    - name: Diff every profile and write the summary
      id: summary
      shell: bash
      env:
        PROFILES: ${{ inputs.profiles }}
      run: |
        # The shell runs with -e; the exit status is reported after the summary is written.
        set +e -u -o pipefail
        date="$(date -u +%F)"
        echo "date=${date}" >> "$GITHUB_OUTPUT"
        mkdir -p legs
        python3 scripts/dual_stack.py summary --profiles "$PROFILES" --legs legs --date "$date" --out-dir dual-stack
        status=$?
        if [ -f dual-stack/summary.md ]; then cat dual-stack/summary.md >> "$GITHUB_STEP_SUMMARY"; fi
        exit "$status"

    - name: Upload the dated summary
      if: always() && steps.summary.outputs.date != ''
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
      with:
        name: dual-stack-summary-${{ steps.summary.outputs.date }}
        overwrite: true
        path: dual-stack
        if-no-files-found: error
        retention-days: 30
