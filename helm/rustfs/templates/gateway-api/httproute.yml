{{- if .Values.gatewayApi.enabled }}
{{- $routes := list (dict "name" "route" "hostname" .Values.gatewayApi.hostname "port" .Values.service.console.port) }}
{{- with .Values.gatewayApi.endpointHostname }}
{{- if eq . $.Values.gatewayApi.hostname }}
{{- fail "gatewayApi.endpointHostname must differ from gatewayApi.hostname" }}
{{- end }}
{{- $routes = append $routes (dict "name" "endpoint-route" "hostname" . "port" $.Values.service.endpoint.port) }}
{{- end }}
{{- range $routes }}
{{- if eq .name "endpoint-route" }}
---
{{- end }}
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: {{ include "rustfs.fullname" $ }}-{{ .name }}
  namespace: {{ $.Release.Namespace }}
  annotations:
    {{- if and (eq $.Values.gatewayApi.gatewayClass "contour") (eq .name "route") }}
    projectcontour.io/upstream-hash-policy: "cookie"
    {{- end }}
spec:
  parentRefs:
    {{- if $.Values.gatewayApi.existingGateway.name }}
    - name: {{ $.Values.gatewayApi.existingGateway.name }}
      {{- if $.Values.gatewayApi.existingGateway.namespace }}
      namespace: {{ $.Values.gatewayApi.existingGateway.namespace }}
      {{- end }}
      sectionName: {{ $.Values.gatewayApi.listeners.https.name | default "websecure"}}
    {{- else }}
    - name: {{ include "rustfs.fullname" $ }}-gateway
      sectionName: {{ $.Values.gatewayApi.listeners.https.name | default "websecure"}}
    {{- end }}
  hostnames:
    - {{ .hostname | quote }}
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: {{ include "rustfs.fullname" $ }}-svc
          port: {{ .port }}
{{- end }}
{{- if .Values.gatewayApi.httpToHttpsRedirect }}
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: {{ include "rustfs.fullname" . }}-redirect
  namespace: {{ .Release.Namespace }}
spec:
  parentRefs:
    {{- if .Values.gatewayApi.existingGateway.name }}
    - name: {{ .Values.gatewayApi.existingGateway.name }}
      {{- if .Values.gatewayApi.existingGateway.namespace }}
      namespace: {{ .Values.gatewayApi.existingGateway.namespace }}
      {{- end }}
      sectionName: {{ .Values.gatewayApi.listeners.http.name | default "web" }}
    {{- else }}
    - name: {{ include "rustfs.fullname" $ }}-gateway
      sectionName: {{ .Values.gatewayApi.listeners.http.name | default "web" }}
    {{- end }}
  rules:
    - filters:
        - type: RequestRedirect
          requestRedirect:
            scheme: https
            statusCode: 301
  {{- end }}
{{- end }}
