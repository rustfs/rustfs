[package]
name = "rustfs-fuzz"
version = "0.0.0"
edition = "2024"
publish = false

[package.metadata]
cargo-fuzz = true

[workspace]

[dependencies]
arbitrary = { version = "1", features = ["derive"] }
http = "1.5.0"
libfuzzer-sys = "0.4"
rustfs-ecstore = { path = "../crates/ecstore" }
rustfs-filemeta = { path = "../crates/filemeta" }
rustfs-notify = { path = "../crates/notify" }
rustfs-policy = { path = "../crates/policy" }
rustfs-security-governance = { path = "../crates/security-governance" }
rustfs-signer = { path = "../crates/signer" }
rustfs-utils = { path = "../crates/utils", features = ["compress", "path"] }
serde_json = "1"
time = { version = "0.3.55", features = ["macros"] }

[[bin]]
name = "bucket_validation"
path = "fuzz_targets/bucket_validation.rs"
test = false
doc = false
bench = false

[[bin]]
name = "archive_extract"
path = "fuzz_targets/archive_extract.rs"
test = false
doc = false
bench = false

[[bin]]
name = "local_metadata"
path = "fuzz_targets/local_metadata.rs"
test = false
doc = false
bench = false

[[bin]]
name = "policy_ingress"
path = "fuzz_targets/policy_ingress.rs"
test = false
doc = false
bench = false

[[bin]]
name = "path_containment"
path = "fuzz_targets/path_containment.rs"
test = false
doc = false
bench = false

[[bin]]
name = "sigv4_request"
path = "fuzz_targets/sigv4_request.rs"
test = false
doc = false
bench = false

[[bin]]
name = "notify_xml"
path = "fuzz_targets/notify_xml.rs"
test = false
doc = false
bench = false
