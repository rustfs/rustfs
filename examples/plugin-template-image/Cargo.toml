[package]
name = "rustfs-image-transform"
version = "0.1.0"
edition = "2024"
rust-version = "1.94.1"
publish = false

[workspace]

[dependencies]
aws-credential-types = "=1.3.0"
aws-sdk-s3 = { version = "=1.152.0", default-features = false, features = ["rt-tokio", "default-https-client", "http-1x"] }
libvips = "=2.3.0"
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.145"
tokio = { version = "=1.53.2", features = ["fs", "io-util", "macros", "net", "rt-multi-thread"] }
url = "=2.5.7"
zeroize = "=1.8.2"
