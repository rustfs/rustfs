# e2e nextest profiles of the nightly both-stack lane (.github/workflows/dual-stack-nightly.yml).
#
# Every `[profile.e2e-*]` of .config/nextest.toml that runs on a schedule or on main today has exactly
# one table here; scripts/test_dual_stack.py fails when the two lists differ. Each profile runs once per
# stack (`RUSTFS_S3_STACK=legacy` and `=gateway`) on the same binary, and the two JUnit reports are
# diffed case by case by scripts/dual_stack.py.
#
# source   the workflow that runs the profile on its own today (the lane reproduces that setup)
# runner   the runner label of that workflow
# features the cargo features its binary is built with
# setup    environment the profile needs before it runs; the workflow gates one step group on each tag:
#          awscurl, full-tools (iptables, mc, Vault), protocols-tools (iproute2), pools (four tmpfs
#          pools and the pinned previous release), minio (the MinIO source container)
# nextest_args  extra `cargo nextest run` arguments the source workflow passes
# filter   a filterset ANDed with the profile's default-filter, applied to both stacks alike
#
# Two selections are left out of both stacks on purpose, because a per-stack leg cannot run them:
#   dual_stack_differential::  starts its own servers with an explicit stack, so it would put a server
#       of the other stack into every leg and defeat the proof of which stack a leg exercised; it
#       compares the two stacks itself and runs in the pull-request gate.
#   distributed_startup_regression_test::  needs the hooks-binary build manifest that only ci.yml's
#       build job produces.

schema = 1

[[profile]]
name = "e2e-smoke"
source = "ci.yml e2e-tests"
runner = "sm-standard-4"
timeout_minutes = 90
features = "e2e-test-hooks"
setup = ["awscurl"]
nextest_args = ""
filter = "not test(/^dual_stack_differential::/)"

[[profile]]
name = "e2e-full"
source = "ci.yml e2e-full"
runner = "sm-standard-4"
timeout_minutes = 150
features = "e2e-test-hooks"
setup = ["awscurl", "full-tools"]
nextest_args = ""
filter = "not test(/^(dual_stack_differential|distributed_startup_regression_test)::/)"

[[profile]]
name = "e2e-repl-nightly"
source = "e2e-replication-nightly.yml repl-nightly"
runner = "sm-standard-4"
timeout_minutes = 90
features = ""
setup = ["awscurl"]
nextest_args = ""
filter = ""

[[profile]]
name = "e2e-nightly"
source = "e2e-replication-nightly.yml cluster-nightly"
runner = "sm-standard-4"
timeout_minutes = 120
features = "e2e-test-hooks"
setup = []
nextest_args = ""
filter = ""

[[profile]]
name = "e2e-protocols"
source = "e2e-replication-nightly.yml protocols-nightly"
runner = "sm-standard-4"
timeout_minutes = 90
features = "ftps,webdav,sftp"
setup = ["protocols-tools"]
nextest_args = "-j 1 --no-capture"
filter = ""

[[profile]]
name = "e2e-distributed"
source = "e2e-distributed.yml"
runner = "ubuntu-latest"
timeout_minutes = 180
features = "e2e-test-hooks"
setup = ["pools"]
nextest_args = "--no-tests=fail"
filter = ""

[[profile]]
name = "e2e-odm-interop"
source = "on-demand-migration-interop.yml minio-source"
runner = "ubuntu-latest"
timeout_minutes = 90
features = ""
setup = ["minio"]
nextest_args = "--no-tests=fail"
filter = ""
