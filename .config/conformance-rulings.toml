# Rulings for the gateway conformance lane. Each row covers one complete diagnostic.
# Remove a row when the case passes. Review the referenced compatibility decision before expiry.
# Backlog #2684 registers both R/K entries and the legacy response heads in rustfs/gateway#1159.
# Official RustFS 1.0.5 and the gateway candidate both omit the region on a successful HeadBucket.

[[ruling]]
case = "c-bkt-0008"
ledger = "rustfs/gateway#1159"
reason = "The RustFS profile preserves the absent bucket region on successful HeadBucket (rustfs/backlog#2684)."
failure = "[expect/headers_present] at /expect/headers_present/x-amz-bucket-region: exchange #1, attempt 1: expected `x-amz-bucket-region: us-east-1`, observed no such header"
expires = 2027-02-01

