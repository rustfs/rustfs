# Connection-close ruling: https://github.com/rustfs/backlog/issues/2684#issuecomment-7124472117

[[ruling]]
case = "c-cred-0013"
ledger = "rustfs/gateway#1120"
reason = "The released and native hosts both close this HTTP/1 connection after serving the expected refusal."
failure = "[expect/connection_after] at /expect/connection_after: exchange #1, attempt 1: expected the connection to be `open` afterwards, observed `closed`"
expires = 2027-02-01

