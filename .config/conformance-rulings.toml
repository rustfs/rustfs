# Rulings for the gateway conformance lane (.github/workflows/gateway-acceptance.yml).
#
# One row per case that fails on the GATEWAY stack for a reviewed reason: `case`, `ledger` (the
# rustfs/backlog#2684 entry that accepts the difference, R-0xx or K-n) and a one-line `reason`.
# scripts/check_conformance_rulings.py fails the lane on a failed case without a row, and on a row
# whose case no longer fails or no longer exists. The legacy stack is a reference run and takes no
# rulings: the `rustfs` profile describes the gateway edge, not the legacy one.
