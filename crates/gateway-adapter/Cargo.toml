[package]
name = "rustfs-gateway-adapter"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
homepage.workspace = true
description = "RustFS implementations of the rustfs-gateway extension traits (credentials over IAM)."
keywords = ["rustfs", "gateway", "s3", "iam"]
categories = ["web-programming", "authentication"]
authors.workspace = true
publish = false

[package.metadata.gateway]
# Documentary only: this crate is a ring-2 consumer of the gateway (it depends on
# RustFS business crates). The RustFS repository does not run the gateway's ring guard.
ring = 2

[lints]
workspace = true

[dependencies]
rustfs-gateway = { workspace = true }
rustfs-iam = { workspace = true }
rustfs-policy = { workspace = true }

[dev-dependencies]
rustfs-credentials = { workspace = true }
time = { workspace = true }
tokio = { workspace = true, features = ["macros", "rt"] }
