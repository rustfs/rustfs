[package]
name = "rustfs-nixl"
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
version.workspace = true
homepage.workspace = true
description = "Server side of RustFS S3-over-RDMA GETs and PUTs on NIXL (UCX backend): GPU-side and CPU-side NICs by GID, no IPoIB"
keywords = ["rdma", "nixl", "ucx", "gpudirect", "s3"]
categories = ["network-programming"]
documentation = "https://docs.rs/rustfs-nixl/latest/rustfs_nixl/"

[lints]
workspace = true

# NIXL/UCX only exists on Linux; elsewhere the crate is empty, so a workspace
# build or test on macOS neither builds nor links nixl-sys.
[target.'cfg(target_os = "linux")'.dependencies]
base64-simd = { workspace = true }
bytes = { workspace = true }
memmap2 = { workspace = true }
nixl-sys = { git = "https://github.com/ai-dynamo/nixl", tag = "v1.5.2" }
parking_lot = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true, features = ["rt-multi-thread", "sync", "time"] }
tracing = { workspace = true }
