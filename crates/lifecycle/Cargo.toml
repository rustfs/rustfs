[package]
name = "rustfs-lifecycle"
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
version.workspace = true
homepage.workspace = true
description = "Lifecycle rule evaluation contracts for RustFS."
keywords = ["lifecycle", "storage", "rustfs", "Minio"]
categories = ["web-programming", "development-tools", "filesystem"]
documentation = "https://docs.rs/rustfs-lifecycle/latest/rustfs_lifecycle/"

[features]
default = []
hotpath = [
    "hotpath/hotpath",
    "hotpath/tokio",
    "rustfs-common/hotpath",
    "rustfs-config/hotpath",
    "rustfs-replication/hotpath",
    "rustfs-storage-api/hotpath",
]
hotpath-alloc = [
    "hotpath",
    "hotpath/hotpath-alloc",
    "rustfs-common/hotpath-alloc",
    "rustfs-config/hotpath-alloc",
    "rustfs-replication/hotpath-alloc",
    "rustfs-storage-api/hotpath-alloc",
]
hotpath-cpu = [
    "hotpath",
    "hotpath/hotpath-cpu",
    "rustfs-common/hotpath-cpu",
    "rustfs-config/hotpath-cpu",
    "rustfs-replication/hotpath-cpu",
    "rustfs-storage-api/hotpath-cpu",
]

[dependencies]
hotpath.workspace = true
async-trait.workspace = true
metrics.workspace = true
rustfs-common.workspace = true
rustfs-config = { workspace = true, features = ["constants"] }
rustfs-replication.workspace = true
rustfs-storage-api.workspace = true
s3s = { workspace = true, features = ["minio"] }
time = { workspace = true, features = ["parsing", "formatting", "macros", "serde"] }
tracing.workspace = true
url.workspace = true
uuid = { workspace = true, features = ["v4", "serde", "fast-rng", "macro-diagnostics"] }

[dev-dependencies]
metrics-util = { workspace = true, features = ["debugging"] }
proptest = "1"
serial_test = { workspace = true }
temp-env.workspace = true
tokio = { workspace = true, features = ["macros", "fs", "rt-multi-thread"] }

[lints]
workspace = true

[lib]
doctest = false
