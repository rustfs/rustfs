[package]
name = "rustfs-object-data-cache"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
homepage.workspace = true
description = "Long-term object body cache engine for RustFS."
keywords = ["cache", "object-storage", "rustfs"]
categories = ["web-programming", "development-tools"]

[lib]
doctest = false

[features]
default = ["cache"]
runtime-memory = ["dep:sysinfo"]
cache = [
    "runtime-memory",
    "dep:bytes",
    "dep:metrics",
    "dep:moka",
    "dep:starshard",
    "dep:thiserror",
    "dep:tokio",
    "dep:tracing",
    "sysinfo/multithread",
]
hotpath = ["cache", "hotpath/hotpath", "hotpath/tokio"]
hotpath-alloc = ["hotpath", "hotpath/hotpath-alloc"]
hotpath-cpu = ["hotpath", "hotpath/hotpath-cpu"]

[dependencies]
hotpath.workspace = true
bytes = { workspace = true, optional = true, features = ["serde"] }
metrics = { workspace = true, optional = true }
moka = { workspace = true, optional = true, features = ["future"] }
starshard = { workspace = true, optional = true, features = ["rayon", "async", "serde"] }
sysinfo = { workspace = true, optional = true }
thiserror = { workspace = true, optional = true }
tokio = { workspace = true, optional = true, features = ["sync", "time", "fs", "rt-multi-thread"] }
tracing = { workspace = true, optional = true }

[dev-dependencies]
criterion = { workspace = true, features = ["html_reports"] }
metrics-util = { workspace = true, features = ["debugging"] }
# `rt-multi-thread` lets the concurrency stress tests run tasks on real worker
# threads, so they exercise true parallelism on the shared singleflight/index
# state rather than only cooperative interleaving.
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "time", "fs"] }

[[bench]]
name = "cache_bench"
harness = false

[lints]
workspace = true
