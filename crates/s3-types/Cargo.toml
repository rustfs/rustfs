[package]
name = "rustfs-s3-types"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
homepage.workspace = true
description = "S3 event and error type definitions for RustFS."
keywords = ["s3", "event", "error", "types", "rustfs"]
categories = ["data-structures"]
build = "build.rs"

[lints]
workspace = true

[features]
default = []
# Legacy edge only: `From` conversions between this crate's error and body
# types and the s3s ones, so the s3s-facing `impl S3` can keep using `?` and
# hand bodies across while the gateway migration is in flight
# (rustfs/backlog#2734). Off by default; the runtime dependency tree of this
# crate carries no s3s unless a consumer asks.
# DELETE BY T4.2 (rustfs/backlog#2784) together with src/compat_s3s.rs.
compat-s3s = ["dep:legacy-s3s"]
hotpath = ["hotpath/hotpath"]
hotpath-alloc = ["hotpath", "hotpath/hotpath-alloc"]
hotpath-cpu = ["hotpath", "hotpath/hotpath-cpu"]

[dependencies]
bytes = { workspace = true }
futures-core = { workspace = true }
hotpath.workspace = true
http = { workspace = true }
http-body = { workspace = true }
http-body-util = { workspace = true }
pin-project-lite = { workspace = true }
# The s3s package under the name the legacy edge knows it by. Only
# src/compat_s3s.rs may use it; see that file's header for the footprint note.
legacy-s3s = { workspace = true, optional = true }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true, features = ["raw_value"] }

[dev-dependencies]
# Oracle for the parity tests in src/compat_s3s.rs; never a normal dependency.
legacy-s3s = { workspace = true }
# The HTTP/1.1 server those parity tests compare bodies through, byte for byte.
hyper = { workspace = true, features = ["http1", "server"] }
hyper-util = { workspace = true, features = ["tokio"] }
tokio = { workspace = true, features = ["io-util", "macros", "rt"] }

[lib]
doctest = false
