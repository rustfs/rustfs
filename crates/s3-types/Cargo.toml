[package]
name = "rustfs-s3-types"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
homepage.workspace = true
description = "S3 event and error type definitions for RustFS."
keywords = ["s3", "event", "error", "types", "rustfs"]
categories = ["data-structures"]
build = "build.rs"

[lints]
workspace = true

[features]
default = []
# Render owned errors with the legacy XML wire format for protocol comparisons.
http-response = ["dep:quick-xml"]
hotpath = []
hotpath-alloc = ["hotpath"]
hotpath-cpu = ["hotpath"]

[dependencies]
bytes = { workspace = true }
futures-core = { workspace = true }
http = { workspace = true }
http-body = { workspace = true }
http-body-util = { workspace = true }
pin-project-lite = { workspace = true }
quick-xml = { workspace = true, optional = true }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true, features = ["raw_value"] }

[dev-dependencies]
quick-xml = { workspace = true }
# Oracle for the parity tests in src/compat_s3s.rs; never a normal dependency.
legacy-s3s = { package = "s3s", git = "https://github.com/s3s-project/s3s", rev = "5761ddfe4c509fcac87e3b99fd5bd9e176b442c0", features = ["minio"] }
# The HTTP/1.1 server those parity tests compare bodies through, byte for byte.
hyper = { workspace = true, features = ["http1", "server"] }
hyper-util = { workspace = true, features = ["tokio"] }
tokio = { workspace = true, features = ["io-util", "macros", "rt"] }

[lib]
doctest = false
